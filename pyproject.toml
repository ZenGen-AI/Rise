[project]
name = "rise-controlplane"
version = "0.1.0"
description = "Rise ControlPlane core and factory simulator stubs"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "grpcio>=1.84.0",
    "protobuf>=7.35.1,<8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "grpcio-tools>=1.84.0"]
memory = ["starling-memory @ git+https://github.com/ruijieguo/starling@cff319d952360727823024ff43c71b15055bd8e3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane", "src/simulator", "src/diagnostic", "src/mindtrainer", "src/inference_bridge", "src/recipestore", "src/trainplanner", "src/trainscheduler", "src/simple_actio", "src/mindagent", "src/factory", "src/compute"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: 真起子进程或多段作业的测试,用 -m 'not slow' 跳过",
    "memory_live: 连真抽取与真嵌入端点的用例,只在设了 RISE_MEMORY_LIVE=1 时跑,不进 CI",
]
