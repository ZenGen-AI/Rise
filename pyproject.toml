[project]
name = "rismforge-controlplane"
version = "0.1.0"
description = "RismForge ControlPlane core and factory simulator stubs"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "grpcio>=1.84.0",
    "protobuf>=7.35.1,<8.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "grpcio-tools>=1.84.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane", "src/simulator", "src/diagnostic", "src/mindtrainer", "src/inference_bridge", "src/recipestore"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
