<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">RecipeStore 的模块</title><desc id="d">七个模块分三层:两个处理器在上,检索、增益、战绩与生命周期在中间,id 与校验器在底层;整个包只导入 controlplane。 节点;- admit:handle_admit_recipe / has_repro_evidence;- record:handle_record_track / used_as_for;- library:find_recipes · get_recipe / compare · track_summary;- track:append_track_entry · verdict / deprecate · deprecated_by;- gain:compute_gain · GainResult / baseline_run_of;- ids:recipe_id_for · run_id_of;- validate:validate_reproducibility / ReproReport · RECIPE_TYPES;- controlplane:本包之外只导入它:Envelope · GitStore · paths · states · ledger · evidence · Action;连线;- admit → track;- record → track;- record → gain;- record → library;- track → library;- library → ids:取 run id</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="640" fill="#ffffff"/><rect x="14" y="44" width="1052" height="130" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">处理器:注入调和循环,签名 Callable[[GitStore, Action], None]</text><rect x="14" y="196" width="1052" height="150" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="218" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">领域模块:读写产物树</text><rect x="14" y="368" width="1052" height="120" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="390" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">纯函数与工具:不读树</text><path d="M380.0,158.0 L380.0,190.0 Q380.0,197.0 387.0,197.