<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">端到端测试走的闭环</title><desc id="d">测试先手工登记全错的基线 run-000 与 zengen-v1,再从人工写的 run-001 出发,每一步都经 factory reconcile --once,人工动作用写状态模拟。主链转到第二轮训练与第三条指令;MindAgent 链在同一套装配下并行验证。 节点;- 登记基线:run-000 全错报告 / zengen-v1;- run-001 训练:派发 · mock 诊断;- 门①批准:写状态模拟 approve;- 晋级 zengen-v2:promote_candidate;- 提名配方:增益 &gt; min_gain;- 门③批准并收录:recipe-run-001;- 规划 run-002:HeuristicBackend clone;- 确认指令:awaiting → pending;- 第二轮训练:晋级 zengen-v3;- 战绩 · 再规划:run-003 待确认;- 两次轮次 start_agent_round:zengen-v2 空库零提案 · 放基线技能 / zengen-v3 产出 pending_review 提案;- 门②批准并收录:admit_proposal / 库版本是字符串;连线;- 登记基线 → run-001 训练;- run-001 训练 → 门①批准;- 门①批准 → 晋级 zengen-v2;- 晋级 zengen-v2 → 提名配方;- 提名配方 → 门③批准并收录;- 门③批准并收录 → 规划 run-002;- 规划 run-002 → 确认指令;- 确认指令 → 第二轮训练;- 第二轮训练 → 战绩 · 再规划;- 两次轮次 start_agent_round → 门②批准并收录</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="640" fill="#ffffff"/><rect x="14" y="44" width="1052" height="330" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">主链:test_the_whole_loop_turns_twice</text><rect x="14" y="400" width="1052" height="180" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="422" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">MindAgent 链:test_the_mindagent_line_runs_inside_the_reconcile_loop</text><path d="M216.0,125.0 L244.0,125.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><pa