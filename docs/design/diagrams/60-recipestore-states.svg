<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">配方的生命周期</title><desc id="d">配方候选由提名器写成 pending_review,经门③批准后由收录处理器写出 effective 的配方,候选随之置 effective;配方在战绩退化时被战绩处理器废弃,被取代时置 superseded。 节点;- 候选 pending_review:提名器写入;- 候选 approved:等待收录;- 候选 effective:已收录;- 候选 rejected:保留记录;- 配方 effective:收录时直接写成;- 配方 deprecated:最近一条战绩退化;- 配方 superseded:被新配方取代;连线;- 候选 pending_review → 候选 approved:门③ approve;- 候选 pending_review → 候选 rejected:门③ reject;- 候选 approved → 配方 effective:收录处理器写配方;- 候选 approved → 候选 effective:收录最后一步;- 配方 effective → 配方 deprecated:战绩处理器;- 配方 effective → 配方 superseded:被取代</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="470" fill="#ffffff"/><rect x="14" y="44" width="520" height="380" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">配方候选 recipe_candidates/recipe-&lt;run&gt;.yaml</text><rect x="560" y="44" width="506" height="380" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="574" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">配方 recipes/recipe-&lt;run&gt;/recipe.yaml</text><path d="M155.0,156.0 L155.0,210.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M250.0,128.0 L320.0,128.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M250.0,238.0 L590.0,238.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M155.0,266.0 L155.0,320.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M770.0,238.0 L860.0,238.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M680.0,266.0 L680.0,351.0 Q680.0,358.0 687.0,358.0 L860.0,358.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><rect x="60" y="100" width="190" height="56" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="155.0" y="123.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">pending_review</text><text x="155.0" y="140.4" text-anchor="middle" font-size="12" fill="#475569">提名器写入</text><rect x="60" y="210" width="190" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="155.0" y="233.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">approved</text><text x="155.0" y="250.4" text-anchor="middle" font-size="12" fill="#475569">等待收录</text><rect x="60" y="320" width="190" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="155.0" y="343.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">effective</text><text x="155.0" y="360.4" text-anchor="middle" font-size="12" fill="#475569">已收录</text><rect x="320" y="100" width="170" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="405.0" y="123.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">rejected</text><text x="405.0" y="140.4" text-anchor="middle" font-size="12" fill="#475569">保留记录</text><rect x="590" y="210" width="180" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="680.0" y="233.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">effective</text><text x="680.0" y="250.4" text-anchor="middle" font-size="12" fill="#475569">收录时直接写成</text><rect x="860" y="210" width="170" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="945.0" y="233.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">deprecated</text><text x="945.0" y="250.4" text-anchor="middle" font-size="12" fill="#475569">最近一条战绩退化</text><rect x="860" y="330" width="170" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="945.0" y="353.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">superseded</text><text x="945.0" y="370.4" text-anchor="middle" font-size="12" fill="#475569">被新配方取代</text><rect x="610" y="100" width="260" height="52.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="610" y="100" width="4" height="52.0" rx="2" fill="#64748b"/><text x="624" y="120.0" font-size="12" fill="#0f172a">配方新建即 effective,不经迁移</text><text x="624" y="138.0" font-size="12" fill="#0f172a">战绩退化时自动 deprecated</text><rect x="115.7" y="173.6" width="78.7" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="155.0" y="187.3" text-anchor="middle" font-size="12" fill="#475569">门③ approve</text><rect x="251.6" y="118.6" width="66.8" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="285.0" y="132.3" text-anchor="middle" font-size="12" fill="#475569">门③ reject</text><rect x="368.0" y="228.6" width="104.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="420.0" y="242.3" text-anchor="middle" font-size="12" fill="#475569">收录处理器写配方</text><rect x="115.0" y="283.6" width="80.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="155.0" y="297.3" text-anchor="middle" font-size="12" fill="#475569">收录最后一步</text><rect x="781.0" y="228.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="815.0" y="242.3" text-anchor="middle" font-size="12" fill="#475569">战绩处理器</text><rect x="702.0" y="348.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="724.0" y="362.3" text-anchor="middle" font-size="12" fill="#475569">被取代</text><rect x="40" y="442" width="18" height="13" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="65" y="453" font-size="12" fill="#475569">等待人工</text><rect x="135.0" y="442" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="160.0" y="453" font-size="12" fill="#475569">生效</text><rect x="206.0" y="442" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="231.0" y="453" font-size="12" fill="#475569">拒绝</text></svg>
