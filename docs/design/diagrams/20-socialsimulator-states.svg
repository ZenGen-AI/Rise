<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 530" width="1080" height="530" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">实时会话状态机</title><desc id="d">创建请求校验通过才建驱动器,随即进入 ACTIVE;校验或依赖失败时不建会话,直接以 EndSession 拒绝。运行器返回后进入 COMPLETING 再到 CLOSED 并落盘;超时、后端失败、断连转入 FAILED,不落盘。 节点;- 流已连接:等待 CreateSession;- CREATED;- ACTIVE;- COMPLETING;- CLOSED;- 创建被拒(无会话):invalid_session / role_backend_failure;- FAILED;连线;- 流已连接 → CREATED:校验通过;- CREATED → ACTIVE:start();- ACTIVE → COMPLETING:运行器返回;- COMPLETING → CLOSED:推 EndSession;- 流已连接 → 创建被拒(无会话):校验或依赖失败 · 10 秒未创建;- CREATED → FAILED:迁移表允许;- ACTIVE → FAILED:超时 · 后端失败 · 断连;- COMPLETING → FAILED:收尾时已有中止原因</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="530" fill="#ffffff"/><path d="M166.0,103.0 L236.0,103.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M376.0,103.0 L446.0,103.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M586.0,103.0 L656.0,103.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M806.0,103.0 L916.0,103.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M91.0,132.0 L91.0,270.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M306.0,126.0 L306.0,296.0 Q306.0,303.0 313.0,303.0 L430.0,303.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M516.0,126.0 L516.0,280.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M731.0,126.0 L731.0,296.0 Q731.0,303.0 724.0,303.0 L630.0,303.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="16" y="74" width="150" height="58" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="91.0" y="99.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">流已连接</text><text x="91.0" y="116.0" text-anchor="middle" font-size="12" fill="#475569">等待 CreateSession</text><rect x="236" y="80" width="140" height="46" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="306.0" y="107.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">CREATED</text><rect x="446" y="80" width="140" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="516.0" y="107.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">ACTIVE</text><rect x="656" y="80" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="731.0" y="107.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">COMPLETING</text><rect x="916" y="80" width="140" height="46" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="986.0" y="107.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">CLOSED</text><rect x="16" y="270" width="200" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="116.0" y="289.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">创建被拒(无会话)</text><text x="116.0" y="306.4" text-anchor="middle" font-size="12" fill="#475569">invalid_session</text><text x="116.0" y="323.8" text-anchor="middle" font-size="12" fill="#475569">role_backend_failure</text><rect x="430" y="280" width="200" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="530.0" y="307.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">FAILED</text><rect x="440" y="368" width="300" height="88.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="440" y="368" width="4" height="88.0" rx="2" fill="#64748b"/><text x="454" y="388.0" font-size="12" fill="#0f172a">CLOSED 的终止原因</text><text x="454" y="406.0" font-size="12" fill="#0f172a">max_turns · client_terminated</text><text x="454" y="424.0" font-size="12" fill="#0f172a">goal_reached 只出现在批量路径</text><text x="454" y="442.0" font-size="12" fill="#0f172a">收尾时调 on_session_closed 落盘</text><rect x="756" y="368" width="300" height="142.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="756" y="368" width="4" height="142.0" rx="2" fill="#64748b"/><text x="770" y="388.0" font-size="12" fill="#0f172a">FAILED 的终止原因</text><text x="770" y="406.0" font-size="12" fill="#0f172a">timeout · client_disconnected</text><text x="770" y="424.0" font-size="12" fill="#0f172a">role_backend_timeout</text><text x="770" y="442.0" font-size="12" fill="#0f172a">role_backend_unavailable</text><text x="770" y="460.0" font-size="12" fill="#0f172a">role_backend_rejected</text><text x="770" y="478.0" font-size="12" fill="#0f172a">role_backend_failure</text><text x="770" y="496.0" font-size="12" fill="#0f172a">不调落盘钩子,episode_id 为空</text><rect x="173.0" y="93.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="201.0" y="107.3" text-anchor="middle" font-size="12" fill="#475569">校验通过</text><rect x="388.1" y="93.6" width="45.8" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="411.0" y="107.3" text-anchor="middle" font-size="12" fill="#475569">start()</text><rect x="587.0" y="93.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="621.0" y="107.3" text-anchor="middle" font-size="12" fill="#475569">运行器返回</text><rect x="814.8" y="93.6" width="92.4" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="861.0" y="107.3" text-anchor="middle" font-size="12" fill="#475569">推 EndSession</text><rect x="2.6" y="191.6" width="176.8" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="91.0" y="205.3" text-anchor="middle" font-size="12" fill="#475569">校验或依赖失败 · 10 秒未创建</text><rect x="272.0" y="267.1" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="306.0" y="280.8" text-anchor="middle" font-size="12" fill="#475569">迁移表允许</text><rect x="444.9" y="193.6" width="142.2" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="516.0" y="207.3" text-anchor="middle" font-size="12" fill="#475569">超时 · 后端失败 · 断连</text><rect x="673.0" y="227.8" width="116.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="731.0" y="241.5" text-anchor="middle" font-size="12" fill="#475569">收尾时已有中止原因</text><rect x="40" y="482" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="65" y="493" font-size="12" fill="#475569">进行中</text><rect x="123.0" y="482" width="18" height="13" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="148.0" y="493" font-size="12" fill="#475569">正常终态</text><rect x="218.0" y="482" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="243.0" y="493" font-size="12" fill="#475569">失败与拒绝</text></svg>
