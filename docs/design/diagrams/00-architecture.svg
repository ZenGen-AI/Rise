<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 730" width="1080" height="730" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">RismForge 系统架构</title><desc id="d">四层结构。控制层放决策与配方相关的四个组件,协调层 ControlPlane 配三道人工审核门,计算层放三个子系统,共享基础设施放 Actio、训练与推理引擎。所有子系统经 ControlPlane 读写产物,只有两条受限直连接口绕过它。 节点;- RecipeStore:配方仓库 · 战绩 · 生命周期;- TrainScheduler:装配上下文 · 校验决策 / 构造指令 · 提名配方;- TrainPlanner:决策学习者 / 可插拔决策后端;- 外部推理桥接:命令行调用外部强模型 / 凭证只留在控制层;- ControlPlane:git 版本化产物树 · 状态机 · 调和循环 · 指令确认;- 三道人工审核门:①checkpoint 晋级 / ②技能记忆纳入 / ③配方入库;- MindTrainer:权重级训练 / SFT → GRPO + OPD;- SocialSimulator:情境仿真 · 实时环境服务 / 诊断评测;- MindAgent:部署态智能体 / 技能与记忆自进化;- ROLL · vLLM:分布式训练 · 推理引擎;- Actio:带技能库与显式记忆的智能体框架 / 每次响应附带激活轨迹;连线;- RecipeStore ↔ ControlPlane;- TrainScheduler ↔ ControlPlane;- TrainPlanner ↔ ControlPlane;- ControlPlane ↔ MindTrainer;- ControlPlane ↔ SocialSimulator;- ControlPlane ↔ MindAgent;- ControlPlane ↔ 三道人工审核门;- RecipeStore ↔ TrainScheduler:查配方;- TrainScheduler ↔ TrainPlanner:规划;- TrainPlanner → 外部推理桥接:推理;- MindTrainer ↔ SocialSimulator:①;- SocialSimulator ↔ MindAgent:②;- MindTrainer → ROLL · vLLM;- SocialSimulator → Actio;- MindAgent → Actio</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1080" height="730" fill="#ffffff"/><rect x="14" y="44" width="1052" height="146" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">控制层(本地开发机)</text><rect x="14" y="214" width="1052" height="128" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="236" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">协调层</text><rect x="14" y="366" width="1052" height="150" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="1052" y="388" text-anchor="end" font-size="13" font-weight="700" fill="#16a34a">计算层(远程 GPU 服务器)</text><rect x="14" y="546" width="1052" height="130" rx="12" fill="#7c3aed" fill-opacity="0.05" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="568" text-anchor="start" font-size="13" font-weight="700" fill="#7c3aed">共享基础设施</text><path d="M165.0,170.0 L165.0,255.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M435.0,170.0 L435.0,255.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M705.0,170.0 L705.0,255.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M165.0,319.0 L165.0,412.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M435.0,319.0 L435.0,412.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M705.0,319.0 L705.0,412.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M850.0,287.0 L880.0,287.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M270.0,130.0 L330.0,130.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" s