<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">一次诊断的双轨数据流</title><desc id="d">静态轨从题库按档选题,经 SoMEval 运行器取 k 个回答,规则式题目重打分。动态轨由调用方给 spec,跑多轮 episode 后由 judge 给候选话语打分。两轨的 ItemResult 分开存放,分别送入错误归类与逐轨聚合,L2 融合后聚到 L1,再与基线比较,最后写报告。 节点;- 选题:select_items / full 全部 · quick 每 L3 一题;- 动态 spec:调用方提供 / 题目 · 情境 · 绑定 · 后端;- SoMEval 执行:run_static_items / 每题 k 个回答;- 多轮 episode:run_dynamic_item / 取候选角色位的话语;- 规则重打分:RuleScorer / 只对 rule 模式题;- judge 打分:LLMJudgeScorer / 先过自评偏差守卫;- ItemResult:按轨分开存放;- 错误归类:静态:变体族 / 动态:一致性;- 逐轨聚合:L3 · L2 各轨分开;- 融合到 L1:两轨都有的 L2 融合;- 退化判定:对照基线 · 区间不相交;- 组装并写入:报告 · 错误画像 / write_report;连线;- 选题 → SoMEval 执行:静态题;- SoMEval 执行 → 规则重打分:原始输出;- 动态 spec → 多轮 episode;- 多轮 episode → judge 打分:话语;- 规则重打分 → ItemResult;- judge 打分 → ItemResult;- ItemResult → 错误归类;- ItemResult → 逐轨聚合:分数;- 逐轨聚合 → 融合到 L1;- 融合到 L1 → 退化判定;- 退化判定 → 组装并写入:标记;- 错误归类 → 组装并写入:ErrorProfile</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="640" fill="#ffffff"/><rect x="14" y="56" width="726" height="150" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="78" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">静态轨</text><rect x="14" y="286" width="726" height="150" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="308" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">动态轨</text><path d="M230.0,137.0 L270.0,137.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M470.0,137.0 L510.0,137.0" fill="none" st