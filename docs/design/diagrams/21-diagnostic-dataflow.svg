12" fill="#475569">只对 rule 模式题</text><rect x="510" y="330" width="200" height="74" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="610.0" y="354.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">judge 打分</text><text x="610.0" y="371.4" text-anchor="middle" font-size="12" fill="#475569">LLMJudgeScorer</text><text x="610.0" y="388.8" text-anchor="middle" font-size="12" fill="#475569">先过自评偏差守卫</text><path d="M780,179 a100.0,9 0 0 1 200,0 v92 a100.0,9 0 0 1 -200,0 z" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><ellipse cx="880.0" cy="179" rx="100.0" ry="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="880.0" y="230.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ItemResult</text><text x="880.0" y="247.1" text-anchor="middle" font-size="12" fill="#475569">按轨分开存放</text><rect x="780" y="330" width="200" height="74" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="880.0" y="354.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">错误归类</text><text x="880.0" y="371.4" text-anchor="middle" font-size="12" fill="#475569">静态:变体族</text><text x="880.0" y="388.8" text-anchor="middle" font-size="12" fill="#475569">动态:一致性</text><rect x="780" y="520" width="200" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="880.0" y="548.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">逐轨聚合</text><text x="880.0" y="565.0" text-anchor="middle" font-size="12" fill="#475569">L3 · L2 各轨分开</text><rect x="530" y="520" width="200" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="630.0" y="548.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">融合到 L1</text><text x="630.0" y="565.0" text-anchor="middle" font-size="12" fill="#475569">两轨都有的 L2 融合</text><rect x="280" y="520" width="200" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="380.0" y="548.2" 