<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">一次 InteractTrain 会话的消息流程</title><desc id="d">MindTrainer 的客户端建会话,服务端校验后启动驱动器。每一轮客户端提交话语,驱动器经运行器记一轮并立即推送,对手轮由服务端后端产生且抹掉内心推理。跑满 4 轮后服务端落盘 Episode 并推 EndSession,客户端在本地重建同一条 Episode。 节点;- 建会话:create_session / 客户端位 a · max_turns 4;- 校验并启动:validate_create_session / 建后端 · start();- 第 0 轮等客户端:ClientDrivenBackend / 阻塞,最多 30 秒;- 策略出第 0 句:policy.respond(turns) / submit_turn;- 第 0 轮入记录:on_turn 入 outbox / 客户端轮原样回显;- 对手第 1 轮:TimeoutBackend 60 秒 / 看不到 a 的内心推理;- 推送 TurnUpdate:回显 + 对手轮 / 对手轮抹掉推理;- 收回显与对手轮:吞掉回显 / 返回对手轮列表;- 第 3 轮后返回:terminated_reason max_turns / on_session_closed 落盘;- 推 EndSession:max_turns / episode_id ep-sess-…;- 本地重建 Episode:drain_until_end() / 只收 max_turns / 或 goal_reached;连线;- 建会话 → 校验并启动:CreateSession;- 校验并启动 → 第 0 轮等客户端:后台线程;- 校验并启动 → 策略出第 0 句:SessionReady;- 策略出第 0 句 → 第 0 轮等客户端:SubmitTurn;- 第 0 轮等客户端 → 第 0 轮入记录:收到话语;- 第 0 轮入记录 → 对手第 1 轮:第 1 轮;- 对手第 1 轮 → 推送 TurnUpdate:对手话语入 outbox;- 推送 TurnUpdate → 收回显与对手轮:TurnUpdate ×2;- 收回显与对手轮 → 第 3 轮后返回:第 2、3 轮重复 4 至 8;- 第 3 轮后返回 → 推 EndSession:closed 事件;- 推 EndSession → 本地重建 Episode:EndSession</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="760" fill="#ffffff"/><rect x="14" y="44" width="242" height="680" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">调用方进程:MindTrainer</text><rect x="300" y="44" width="766" height="680" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="314" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">实时环境服务进程</text><path d="M240.0,138.0 L330.0,138.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M430.0,176.0 L430.0,186.0 Q430.0,193.0 437.0,193.0 L591.0,193.0 Q598.0,193.0 598.0,200.0 L598.0,210.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M370.0,176.0 L370.0,186.0 Q370.0,193.0 363.0,193.0 L194.5,193.0 Q187.5,193.0 187.5,200.0 L187.5,210.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M240.0,248.0 L550.0,248.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M670.0,286.0 L670.0,330.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M790.0,368.0 L830.0,368.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M940.0,406.0 L940.0,481.0 Q940.0,488.0 933.0,488.0 L530.0,488.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M530.0,488.0 L30.0,488.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M135.0,526.0 L135.0,575.8 Q135.0,582.8 142.0,582.8 L550.0,582.8" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M622.0,636.0 L622.0,661.0 Q622.0,668.0 615.0,668.0 L530.0,668.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M530.0,668.0 L280.5,668.0 Q280.0,668.0 280.0,668.5 L280.0,668.5 Q280.0,669.0 279.5,669.0 L30.0,669.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="30" y="100" width="210" height="76" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="135.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">建会话</text><text x="135.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">create_session</text><text x="135.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">客户端位 a · max_turns 4</text><rect x="330" y="100" width="200" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="430.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">校验并启动</text><text x="430.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">validate_create_session</text><text x="430.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">建后端 · start()</text><rect x="550" y="210" width="240" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="235.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">第 0 轮等客户端</text><text x="670.0" y="252.3" text-anchor="middle" font-size="12" fill="#475569">ClientDrivenBackend</text><text x="670.0" y="269.8" text-anchor="middle" font-size="12" fill="#475569">阻塞,最多 30 秒</text><rect x="30" y="210" width="210" height="76" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="135.0" y="235.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">策略出第 0 句</text><text x="135.0" y="252.3" text-anchor="middle" font-size="12" fill="#475569">policy.respond(turns)</text><text x="135.0" y="269.8" text-anchor="middle" font-size="12" fill="#475569">submit_turn</text><rect x="550" y="330" width="240" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="355.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">第 0 轮入记录</text><text x="670.0" y="372.4" text-anchor="middle" font-size="12" fill="#475569">on_turn 入 outbox</text><text x="670.0" y="389.8" text-anchor="middle" font-size="12" fill="#475569">客户端轮原样回显</text><rect x="830" y="330" width="220" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="940.0" y="355.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">对手第 1 轮</text><text x="940.0" y="372.4" text-anchor="middle" font-size="12" fill="#475569">TimeoutBackend 60 秒</text><text x="940.0" y="389.8" text-anchor="middle" font-size="12" fill="#475569">看不到 a 的内心推理</text><rect x="330" y="450" width="200" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="430.0" y="475.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">推送 TurnUpdate</text><text x="430.0" y="492.4" text-anchor="middle" font-size="12" fill="#475569">回显 + 对手轮</text><text x="430.0" y="509.8" text-anchor="middle" font-size="12" fill="#475569">对手轮抹掉推理</text><rect x="30" y="450" width="210" height="76" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="135.0" y="475.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">收回显与对手轮</text><text x="135.0" y="492.4" text-anchor="middle" font-size="12" fill="#475569">吞掉回显</text><text x="135.0" y="509.8" text-anchor="middle" font-size="12" fill="#475569">返回对手轮列表</text><rect x="550" y="560" width="240" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="585.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">第 3 轮后返回</text><text x="670.0" y="602.4" text-anchor="middle" font-size="12" fill="#475569">terminated_reason max_turns</text><text x="670.0" y="619.8" text-anchor="middle" font-size="12" fill="#475569">on_session_closed 落盘</text><rect x="330" y="630" width="200" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="430.0" y="655.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">推 EndSession</text><text x="430.0" y="672.4" text-anchor="middle" font-size="12" fill="#475569">max_turns</text><text x="430.0" y="689.8" text-anchor="middle" font-size="12" fill="#475569">episode_id ep-sess-…</text><rect x="30" y="624" width="210" height="90" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="135.0" y="647.9" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">本地重建 Episode</text><text x="135.0" y="664.6" text-anchor="middle" font-size="12" fill="#475569">drain_until_end()</text><text x="135.0" y="682.0" text-anchor="middle" font-size="12" fill="#475569">只收 max_turns</text><text x="135.0" y="699.4" text-anchor="middle" font-size="12" fill="#475569">或 goal_reached</text><circle cx="30" cy="100" r="10" fill="#16a34a"/><text x="30" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text><circle cx="330" cy="100" r="10" fill="#16a34a"/><text x="330" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text><circle cx="550" cy="210" r="10" fill="#16a34a"/><text x="550" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text><circle cx="30" cy="210" r="10" fill="#16a34a"/><text x="30" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text><circle cx="550" cy="330" r="10" fill="#16a34a"/><text x="550" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text><circle cx="830" cy="330" r="10" fill="#16a34a"/><text x="830" y="334" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text><circle cx="330" cy="450" r="10" fill="#16a34a"/><text x="330" y="454" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text><circle cx="30" cy="450" r="10" fill="#16a34a"/><text x="30" y="454" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text><circle cx="550" cy="560" r="10" fill="#16a34a"/><text x="550" y="564" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">9</text><circle cx="330" cy="630" r="10" fill="#16a34a"/><text x="330" y="634" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">10</text><circle cx="30" cy="624" r="10" fill="#16a34a"/><text x="30" y="628" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">11</text><text x="430" y="84" text-anchor="middle" font-size="12" fill="#475569">服务端主循环</text><text x="670" y="84" text-anchor="middle" font-size="12" fill="#475569">驱动器与运行器</text><text x="940" y="84" text-anchor="middle" font-size="12" fill="#475569">对手后端</text><rect x="237.7" y="128.6" width="94.5" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="285.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">CreateSession</text><rect x="486.0" y="183.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="514.0" y="197.3" text-anchor="middle" font-size="12" fill="#475569">后台线程</text><rect x="233.7" y="183.6" width="90.2" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="278.75" y="197.3" text-anchor="middle" font-size="12" fill="#475569">SessionReady</text><rect x="356.0" y="238.6" width="78.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="395.0" y="252.3" text-anchor="middle" font-size="12" fill="#475569">SubmitTurn</text><rect x="642.0" y="298.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="670.0" y="312.3" text-anchor="middle" font-size="12" fill="#475569">收到话语</text><rect x="786.7" y="358.6" width="46.6" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="810.0" y="372.3" text-anchor="middle" font-size="12" fill="#475569">第 1 轮</text><rect x="720.8" y="478.6" width="110.4" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/