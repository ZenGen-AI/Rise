<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" width="1080" height="680" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">一轮 agent_round 的处理</title><desc id="d">调和循环为最新 effective 模型产生 start_agent_round。处理器先判终态,再取代旧轮次,写 pending 轮次产物作幂等键,然后部署、分析、提案、验证、打包,最后置 executed。确定性错误与任何桥接失败置 failed 并记 T3;非桥接瞬态上抛,轮次保持 pending,守护进程退出,重启后的 tick 重入。 节点;- 产生动作:最新 effective 模型 / 轮次缺失或 pending;- 读轮次产物:终态:直接返回 / 读不出:写 failed;- 取代旧轮次:旧模型 pending 轮次 / 过期动作自身同样;- 绑定并写 pending:读模型与正式库 / 轮次产物 = 幂等键;- 部署 episode:技能版本一致 · 起点副本已删 / digest_before 对得上 / 则复用不重跑;- 分析 · 提案 · 验证:纯函数为主 / 桥接仅在提案生成;- 筛选并打包:提案 pending_review / id 由轮次与序号确定;- 轮次 executed:写 findings · proposals / dropped;- 空操作:不写 · 不提交;- 旧轮次 failed:category superseded;- 上抛 · 保持 pending:非桥接瞬态 / 如会话 T1 重跑用尽;- 轮次 failed:先回滚在途 episode / T3 失败记录 / failure-agent-&lt;model&gt;;连线;- 产生动作 → 读轮次产物;- 读轮次产物 → 取代旧轮次;- 取代旧轮次 → 绑定并写 pending;- 绑定并写 pending → 部署 episode;- 部署 episode → 分析 · 提案 · 验证;- 分析 · 提案 · 验证 → 筛选并打包;- 筛选并打包 → 轮次 executed;- 读轮次产物 → 空操作:已终态;- 取代旧轮次 → 旧轮次 failed:被取代;- 部署 episode → 上抛 · 保持 pending:瞬态;- 分析 · 提案 · 验证 → 轮次 failed:确定性 / 桥接;- 部署 episode → 轮次 failed:不可重跑;- 上抛 · 保持 pending → 产生动作:下一 tick 重入(R19)(虚线)</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1080" height="680" fill="#ffffff"/><path d="M240.0,202.0 L310.0,202.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M510.0,202.0 L580.0,202.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" 