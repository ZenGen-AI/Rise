oke-width="1.5"/><text x="950.0" y="549.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">上抛 · 保持 pending</text><text x="950.0" y="566.4" text-anchor="middle" font-size="12" fill="#475569">非桥接瞬态</text><text x="950.0" y="583.8" text-anchor="middle" font-size="12" fill="#475569">如会话 T1 重跑用尽</text><rect x="580" y="520" width="200" height="84" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="680.0" y="540.9" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">轮次 failed</text><text x="680.0" y="557.6" text-anchor="middle" font-size="12" fill="#475569">先回滚在途 episode</text><text x="680.0" y="575.0" text-anchor="middle" font-size="12" fill="#475569">T3 失败记录</text><text x="680.0" y="592.4" text-anchor="middle" font-size="12" fill="#475569">failure-agent-&lt;model&gt;</text><circle cx="40" cy="160" r="10" fill="#16a34a"/><text x="40" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text><circle cx="310" cy="160" r="10" fill="#16a34a"/><text x="310" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text><circle cx="580" cy="160" r="10" fill="#16a34a"/><text x="580" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text><circle cx="850" cy="160" r="10" fill="#16a34a"/><text x="850" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text><circle cx="850" cy="340" r="10" fill="#16a34a"/><text x="850" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text><circle cx="580" cy="340" r="10" fill="#16a34a"/><text x="580" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text><circle cx="310" cy="340" r="10" fill="#16a34a"/><text x="310" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text><circle cx="40" cy="340" r="10" fill="#16a34a"/><text x="40" y="344" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text><rect x="40" y="454" width="470" height="52.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="40" y="454" width="4" height="52.0" rx="2" fill="#64748b"/><text x="54" y="474.0" font-size="12" fill="#0f172a">R18:任何桥接失败都升级为 T3,不留 pending</text><text x="54" y="492.0" font-size="12" fill="#0f172a">避免守护循环无限空转外部推理</text><rect x="388.0" y="118.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="410.0" y="132.3" text-anchor="middle" font-size="12" fill="#475569">已终态</text><rect x="658.0" y="118.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="680.0" y="132.3" text-anchor="middle" font-size="12" fill="#475569">被取代</text><rect x="934.0" y="462.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="950.0" y="476.3" text-anchor="middle" font-size="12" fill="#475569">瞬态</text><rect x="640.0" y="462.6" width="80.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="680.0" y="476.3" text-anchor="middle" font-size="12" fill="#475569">确定性 / 桥接</text><rect x="807.8" y="466.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="835.8" y="480.3" text-anchor="middle" font-size="12" fill="#475569">不可重跑</text><rect x="429.2" y="630.6" width="116.7" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="487.6" y="644.3" text-anchor="middle" font-size="12" fill="#475569">下一 tick 重入(R19)</text><rect x="40" y="654" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="65" y="665" font-size="12" fill="#475569">调和循环</text><rect x="135.0" y="654" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="160.0" y="665" font-size="12" fill="#475569">MindAgent 步骤</text><rect x="271.64" y="654" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="296.64" y="665" font-size="12" fill="#475569">失败路径</text><rect x="366.64" y="