<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">plan() 的重采样流程</title><desc id="d">模板只渲染一次。每次尝试把此前的被拒原因拼进提示交给后端,严格解析,再交校验器。解析失败与校验违规都记一条原因并消耗同一个预算,预算用完抛 PlannerFailedError。渲染错误与后端异常不进重试,原样上抛。 节点;- 渲染提示:render_prompt / 只做一次;- 拼入被拒原因:with_feedback / 第 n 次带前 n−1 条;- 后端给出文本:backend.decide / task_id 每次不同;- 严格解析:parse_decision;- 领域校验:validator(decision) / None 即通过;- 返回 PlannerResult:决策 · 理由 · 模板版本 / 尝试次数 · 后端名;- 记一条被拒原因:parse error 或 invalid decision;- 预算还有剩?:总次数 = 1 + max_parse_retries;- PlannerFailedError:reason · attempts · reasons;- 原样上抛,不计预算:PromptRenderError / BridgeError 与其他后端异常;连线;- 渲染提示 → 拼入被拒原因;- 拼入被拒原因 → 后端给出文本;- 后端给出文本 → 严格解析;- 严格解析 → 领域校验:合格;- 领域校验 → 返回 PlannerResult:通过;- 严格解析 → 记一条被拒原因:不合格;- 领域校验 → 记一条被拒原因:违规;- 记一条被拒原因 → 预算还有剩?;- 预算还有剩? → 拼入被拒原因:有,再采样;- 预算还有剩? → PlannerFailedError:无;- 渲染提示 → 原样上抛,不计预算:模板缺陷;- 后端给出文本 → 原样上抛,不计预算:后端异常</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1080" height="600" fill="#ffffff"/><path d="M260.0,106.0 L300.0,106.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M520.0,106.0 L560.0,106.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M780.0,106.0 L820.0,106.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M930.0,142.0 L930.0,230.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M930.0,302.0 L930.0,390.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M864.0,142.0 L864.0,183.0 Q864.0,190.0 857.0,190.0 L727.0,190.0 Q720.0,190.0 720.0,197.0 L720.0,241.0 Q720.0,248.0 713.0,248.0 L690.0,248.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M820.0,276.8 L755.9,276.8 Q755.0,276.8 755.0,275.9 L755.0,275.9 Q755.0,275.0 754.1,275.0 L690.0,275.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M560.0,290.0 L560.0,360.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M430.0,396.0 L337.0,396.0 Q330.0,396.0 330.0,389.0 L330.0,177.0 Q330.0,170.0 337.0,170.0 L403.0,170.0 Q410.0,170.0 410.0,163.0 L410.0,142.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M560.0,432.0 L560.0,500.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M150.0,142.0 L150.0,230.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M604.0,70.0 L604.0,55.0 Q604.0,48.0 597.0,48.0 L29.0,48.0 Q22.0,48.0 22.0,55.0 L22.0,259.0 Q22.0,266.0 29.0,266.0 L40.0,266.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><rect x="40" y="70" width="220" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="150.0" y="93.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">渲染提示</text><text x="150.0" y="110.3" text-anchor="middle" font-size="12" fill="#475569">render_prompt</text><text x="150.0" y="127.8" text-anchor="middle" font-size="12" fill="#475569">只做一次</text><rect x="300" y="70" width="220" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="410.0" y="93.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">拼入被拒原因</text><text x="410.0" y="110.3" text-anchor="middle" font-size="12" fill="#475569">with_feedback</text><text x="410.0" y="127.8" text-anchor="middle" font-size="12" fill="#475569">第 n 次带前 n−1 条</text><rect x="560" y="70" width="220" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="670.0" y="93.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">后端给出文本</text><text x="670.0" y="110.3" text-anchor="middle" font-size="12" fill="#475569">backend.decide</text><text x="670.0" y="127.8" text-anchor="middle" font-size="12" fill="#475569">task_id 每次不同</text><rect x="820" y="70" width="220" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="930.0" y="102.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">严格解析</text><text x="930.0" y="119.0" text-anchor="middle" font-size="12" fill="#475569">parse_decision</text><rect x="820" y="230" width="220" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="930.0" y="253.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">领域校验</text><text x="930.0" y="270.4" text-anchor="middle" font-size="12" fill="#475569">validator(decision)</text><text x="930.0" y="287.8" text-anchor="middle" font-size="12" fill="#475569">None 即通过</text><rect x="820" y="390" width="220" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="930.0" y="413.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">返回 PlannerResult</text><text x="930.0" y="430.4" text-anchor="middle" font-size="12" fill="#475569">决策 · 理由 · 模板版本</text><text x="930.0" y="447.8" text-anchor="middle" font-size="12" fill="#475569">尝试次数 · 后端名</text><rect x="430" y="230" width="260" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="560.0" y="256.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">记一条被拒原因</text><text x="560.0" y="273.1" text-anchor="middle" font-size="12" fill="#475569">parse error 或 invalid decision</text><polygon points="446.0,360.0 674.0,360.0 690.0,396.0 674.0,432.0 446.0,432.0 430.0,396.0" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/><text x="560.0" y="392.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">预算还有剩?</text><text x="560.0" y="409.1" text-anchor="middle" font-size="12" fill="#475569">总次数 = 1 + max_parse_retries</text><rect x="430" y="500" width="260" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="560.0" y="526.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">PlannerFailedError</text><text x="560.0" y="543.0" text-anchor="middle" font-size="12" fill="#475569">reason · attempts · reasons</text><rect x="40" y="230" width="260" height="72" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="170.0" y="253.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">原样上抛,不计预算</text><text x="170.0" y="270.4" text-anchor="middle" font-size="12" fill="#475569">PromptRenderError</text><text x="170.0" y="287.8" text-anchor="middle" font-size="12" fill="#475569">BridgeError 与其他后端异常</text><circle cx="40" cy="70" r="10" fill="#2563eb"/><text x="40" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text><circle cx="300" cy="70" r="10" fill="#2563eb"/><text x="300" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text><circle cx="560" cy="70" r="10" fill="#2563eb"/><text x="560" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text><circle cx="820" cy="70" r="10" fill="#2563eb"/><text x="820" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text><circle cx="820" cy="230" r="10" fill="#2563eb"/><text x="820" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text><circle cx="820" cy="390" r="10" fill="#2563eb"/><text x="820" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text><rect x="914.0" y="176.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="930.0" y="190.3" text-anchor="middle" font-size="12" fill="#475569">合格</text><rect x="914.0" y="336.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="930.0" y="350.3" text-anchor="middle" font-size="12" fill="#475569">通过</text><rect x="750.0" y="180.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="772.0" y="194.3" text-anchor="middle" font-size="12" fill="#475569">不合格</text><rect x="739.0" y="266.5" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="755.0" y="280.2" text-anchor="middle" font-size="12" fill="#475569">违规</text><rect x="299.8" y="269.6" width="60.3" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="330.0" y="283.3" text-anchor="middle" font-size="12" fill="#475569">有,再采样</text><rect x="550.0" y="456.6" width="20.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="560.0" y="470.3" text-anchor="middle" font-size="12" fill="#475569">无</text><rect x="122.0" y="176.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="150.003" y="190.3" text-anchor="middle" font-size="12" fill="#475569">模板缺陷</text><rect x="178.0" y="38.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="206.0" y="52.3" text-anchor="middle" font-size="12" fill="#475569">后端异常</text><rect x="40" y="570" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="65" y="581" font-size="12" fill="#475569">正常步骤</text><rect x="135.0" y="570" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="160.0" y="581" font-size="12" fill="#475569">失败与上抛</text></svg>
