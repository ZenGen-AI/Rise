<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">TrainScheduler 的上下文</title><desc id="d">调和循环把 plan_next_round 与 nominate_recipe 两种动作交给 TrainScheduler 的处理器。处理器调 TrainPlanner 拿决策,查 RecipeStore 的配方与增益,借 MindTrainer 的两个数据模块校验指令,结果全部写回产物树。人工经命令行确认指令、审核配方候选,也可以直接写指令。 节点;- MindTrainer 数据模块:training_config · data_spec / 只导入这两个模块;- ControlPlane 调和循环:读树 · 纯函数算动作 / 注入的处理器执行动作;- 人工命令行:confirm 指令 · 门③ 审核 / 直接手写指令;- TrainPlanner:plan(ctx, validator) / 返回结构化决策;- TrainScheduler:装配上下文 · 领域校验 / 构造指令 · 提名配方;- RecipeStore:find_recipes · get_recipe / compute_gain · 复现校验;- 产物树:读:候选 · 诊断 · 模型 · 成本 · 配置 / 写:决策 · 指令 · 提名标记 · 配方候选;连线;- ControlPlane 调和循环 → TrainScheduler:Action(run id);- TrainScheduler ↔ TrainPlanner:规划;- TrainScheduler ↔ RecipeStore:查配方与增益;- TrainScheduler → MindTrainer 数据模块:校验配置;- TrainScheduler ↔ 产物树:读证据 · 写产物;- 人工命令行 → 产物树:写状态</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="600" fill="#ffffff"/><path d="M540.0,136.0 L540.0,250.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M680.0,288.0 L40.0,288.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M680.0,288.0 L800.0,288.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M400.0,265.2 L347.0,265.2 Q340.0,265.2 340.0,258.2 L340.0,105.0 Q340.0,98.0 333.0,98.0 L280.0,98.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,326.0 L540.0,430.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M1040.0,98.0 L1053.0,98.0 Q1060.0,98.0 1060.0,105.0 L1060.0,495.0 Q1060.0,502.0 1053.0,502.0 L680.0,502.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="40" y="60" width="240" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="160.0" y="85.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MindTrainer 数据模块</text><text x="160.0" y="102.3" text-anchor="middle" font-size="12" fill="#475569">training_config · data_spec</text><text x="160.0" y="119.8" text-anchor="middle" font-size="12" fill="#475569">只导入这两个模块</text><rect x="400" y="60" width="280" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="85.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ControlPlane 调和循环</text><text x="540.0" y="102.3" text-anchor="middle" font-size="12" fill="#475569">读树 · 纯函数算动作</text><text x="540.0" y="119.8" text-anchor="middle" font-size="12" fill="#475569">注入的处理器执行动作</text><rect x="800" y="60" width="240" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="920.0" y="85.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">人工命令行</text><text x="920.0" y="102.3" text-anchor="middle" font-size="12" fill="#475569">confirm 指令 · 门③ 审核</text><text x="920.0" y="119.8" text-anchor="middle" font-size="12" fill="#475569">直接手写指令</text><rect x="40" y="250" width="240" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="160.0" y="275.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">TrainPlanner</text><text x="160.0" y="292.4" text-anchor="middle" font-size="12" fill="#475