<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">外部推理桥接的上下文</title><desc id="d">TrainPlanner 与 MindAgent 经桥接调用外部强模型,factory 读配置装配桥接。桥接按变量名从环境取凭证,经子进程调外部命令行工具,成功调用记成本,日志脱敏后写进 git 不可见的目录。TrainScheduler 把任何桥接失败升级为 T3 写失败记录。 节点;- TrainScheduler:规划处理器 / 桥接失败升级为 T3;- TrainPlanner:BridgeDecisionBackend;- MindAgent:技能提案生成器 / 可选 judge 附注;- factory 组合根:读 backends.yaml / 按角色构造 CliBridge;- 外部推理桥接:InferenceBridge 协议 / CliBridge · ScriptedBridge;- 外部强模型命令行:claude -p · codex exec / 本机登录态;- ControlPlane 产物树:run_trace · failure_record / config/backends.yaml;- 桥接日志目录:.rise/logs / 对 git 不可见;- 环境变量:凭证值只在这里 / 不进 git 树;连线;- TrainScheduler → TrainPlanner:plan();- TrainPlanner → 外部推理桥接:complete();- MindAgent → 外部推理桥接:complete();- factory 组合根 → 外部推理桥接:构造;- 外部推理桥接 → 外部强模型命令行:子进程 · 标准输入;- 环境变量 → 外部推理桥接:按变量名解析;- 外部推理桥接 → ControlPlane 产物树:成本记录;- 外部推理桥接 → 桥接日志目录:脱敏日志;- TrainScheduler → ControlPlane 产物树:T3 失败记录</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="560" fill="#ffffff"/><rect x="14" y="44" width="1052" height="140" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">调用方与装配</text><rect x="14" y="370" width="720" height="140" rx="12" fill="#0891b2" fill-opacity="0.05" stroke="#0891b2" stroke-width="1.2"/><text x="28" y="392" text-anchor="start" font-size="13" font-weight="700" fill="#0891b2">落地位置</text><path d="M260.0,125.0 L290.0,125.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M405.0,160.0 L405.0,230.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M600.0,160.0 L600.0,230.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M835.0,160.0 L835.0,193.0 Q835.0,200.0 828.0,200.0 L742.0,200.0 Q735.0,200.0 735.0,207.0 L735.0,238.0 Q735.0,245.0 728.0,245.0 L700.0,245.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M700.0,270.0 L820.0,270.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M800.0,450.0 L772.0,450.0 Q765.0,450.0 765.0,443.0 L765.0,307.0 Q765.0,300.0 758.0,300.0 L700.0,300.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M380.0,293.0 L307.0,293.0 Q300.0,293.0 300.0,300.0 L300.0,410.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M572.0,320.0 L572.0,410.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M145.0,160.0 L145.0,410.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="30" y="90" width="230" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="145.0" y="112.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">TrainScheduler</text><text x="145.0" y="129.3" text-anchor="middle" font-size="12" fill="#475569">规划处理器</text><text x="145.0" y="146.8" text-anchor="middle" font-size="12" fill="#475569">桥接失败升级为 T3</text><rect x="290" y="90" width="230" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="405.0" y="121.2" text-anchor="mi