<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">激活轨迹如何经协议落盘</title><desc id="d">客户端把 respond 产出的轨迹放进 SubmitTurn 的 Struct 字段。服务端解出字典,经驱动器与客户端驱动后端交给 runner,runner 写进 TurnRecord,会话结束时整份 episode 落盘。逐轮回显时只抹掉对手轮次的轨迹与内心推理,客户端自己的轮次原样回显。 节点;- SimpleActioInstance.respond:返回三元组 / 轨迹叶子没有数字;- client.submit_turn:activation_trace 关键字参数 / SetInParent 后 update;- 客户端本地历史:自己的轮次带轨迹 / 下一轮作 history;- EnvironmentServicer:HasField 才 MessageToDict / 得 dict,否则传 None;- SessionDriver:submit_turn 原样转交轨迹;- ClientDrivenBackend:带轨迹时返回三元组 / 不带时仍是二元组;- run_episode:_unpack_reply 收二元组或三元组 / 深拷贝写进 TurnRecord;- episode 落盘:会话结束时写入完整记录 / 对手轮次的轨迹也在;- _drain_ready_events:逐轮事件:对手轮次抹掉两项 / 自己的轮次原样回显;连线;- SimpleActioInstance.respond → client.submit_turn;- client.submit_turn → EnvironmentServicer:SubmitTurn.activation_trace;- EnvironmentServicer → SessionDriver;- SessionDriver → ClientDrivenBackend;- ClientDrivenBackend → run_episode:三元组;- run_episode → episode 落盘;- run_episode → _drain_ready_events;- _drain_ready_events → 客户端本地历史:TurnUpdate</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="600" fill="#ffffff"/><rect x="14" y="40" width="1052" height="150" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="62" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">客户端进程(MindAgent 部署驱动器)</text><rect x="14" y="222" width="1052" height="340" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="244" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">实时环境服务进程(SocialSimulator)</text><path d="M284.0,126.0 L290.0,126.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M410.0,166.0 L410.0,199.0 Q410.0,206.0 403.0,206.0 L157.0,206.0 Q150.0,206.0 150.0,213.0 L150.0,300.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M270.0,340.0 L290.0,340.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M530.0,340.0 L550.0,340.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M670.0,380.0 L670.0,450.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M550.0,490.0 L541.0,490.0 Q540.0,490.0 540.0,489.0 L540.0,489.0 Q540.0,488.0 539.0,488.0 L530.0,488.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M790.0,490.0 L810.0,490.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M930.0,450.0 L930.0,166.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="24" y="86" width="260" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="154.0" y="113.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SimpleActioInstance.respond</text><text x="154.0" y="130.3" text-anchor="middle" font-size="12" fill="#475569">返回三元组</text><text x="154.0" y="147.8" text-anchor="middle" font-size="12" fill="#475569">轨迹叶子没有数字</text><rect x="290" y="86" width="240" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="410.0" y="113.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">client.submit_turn</text><text x="410.0" y="130.3" text-anchor="middle" font-size="12" fill="#475569">activation_trace 关键字参数</text><text x="410.0" y="147.8" text-anchor="middle" font-size="12" fill="#475569">SetInParent 后 update</text><rect x="810" y="86" width="240" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="930.0" y="113.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">客户端本地历史</text><text x="930.0" y="130.3" text-anchor="middle" font-size="12" fill="#475569">自己的轮次带轨迹</text><text x="930.0" y="147.8" text-anchor="middle" font-size="12" fill="#475569">下一轮作 history</text><rect x="30" y="300" width="240" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="150.0" y="327.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">EnvironmentServicer</text><text x="150.0" y="344.4" text-anchor="middle" font-size="12" fill="#475569">HasField 才 MessageToDict</text><text x="150.0" y="361.8" text-anchor="middle" font-size="12" fill="#475569">得 dict,否则传 None</text><rect x="290" y="300" width="240" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="410.0" y="336.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SessionDriver</text><text x="410.0" y="353.1" text-anchor="middle" font-size="12" fill="#475569">submit_turn 原样转交轨迹</text><rect x="550" y="300" width="240" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="327.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ClientDrivenBackend</text><text x="670.0" y="344.4" text-anchor="middle" font-size="12" fill="#475569">带轨迹时返回三元组</text><text x="670.0" y="361.8" text-anchor="middle" font-size="12" fill="#475569">不带时仍是二元组</text><rect x="550" y="450" width="240" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="477.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">run_episode</text><text x="670.0" y="494.4" text-anchor="middle" font-size="12" fill="#475569">_unpack_reply 收二元组或三元组</text><text x="670.0" y="511.8" text-anchor="middle" font-size="12" fill="#475569">深拷贝写进 TurnRecord</text><path d="M290,449 a120.0,9 0 0 1 240,0 v78 a120.0,9 0 0 1 -240,0 z" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><ellipse cx="410.0" cy="449" rx="120.0" ry="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="410.0" y="484.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">episode 落盘</text><text x="410.0" y="501.4" text-anchor="middle" font-size="12" fill="#475569">会话结束时写入完整记录</text><text x="410.0" y="518.8" text-anchor="middle" font-size="12" fill="#475569">对手轮次的轨迹也在</text><rect x="810" y="450" width="240" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="930.0" y="477.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">_drain_ready_events</text><text x="930.0" y="494.4" text-anchor="middle" font-size="12" fill="#475569">逐轮事件:对手轮次抹掉两项</text><text x="930.0" y="511.8" text-anchor="middle" font-size="12" fill="#475569">自己的轮次原样回显</text><circle cx="24" cy="86" r="10" fill="#16a34a"/><text x="24" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text><circle cx="290" cy="86" r="10" fill="#16a34a"/><text x="290" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text><circle cx="30" cy="300" r="10" fill="#16a34a"/><text x="30" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text><circle cx="290" cy="300" r="10" fill="#16a34a"/><text x="290" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text><circle cx="550" cy="300" r="10" fill="#16a34a"/><text x="550" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text><circle cx="550" cy="450" r="10" fill="#16a34a"/><text x="550" y="454" text-anchor="middle" font-size="11" font-weight