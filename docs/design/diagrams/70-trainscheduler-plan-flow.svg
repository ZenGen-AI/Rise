<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 790" width="1080" height="790" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">规划处理器的步骤与重入</title><desc id="d">处理器先看决策产物的状态:已终态就空操作,pending 就按记下的 run id 续写,不在才完整规划。run id 先落进 pending 决策,再写指令,最后把决策置 executed。任何一步确定性失败都把决策置 failed 并写 T3 失败记录。 节点;- 决策产物的状态:planner_decision.yaml;- 空操作:零提交;- 装配上下文:assemble_context;- 规划:plan() 带 validator;- 分配 run id:allocate_run_id;- 写决策 pending:载荷带 next_run_id;- 解析动作:resolve_action;- 写指令:construct_directive;- 决策置 executed:本轮规划完成;- 决策置 failed:failure = {T3, reason, attempts} / record_failure 写失败记录 / 正常返回,不上抛;连线;- 决策产物的状态 → 空操作:终态;- 决策产物的状态 → 装配上下文:不在;- 决策产物的状态 → 解析动作:(a);- 决策产物的状态 → 决策置 executed:(b);- 装配上下文 → 规划;- 规划 → 分配 run id;- 分配 run id → 写决策 pending;- 写决策 pending → 解析动作;- 解析动作 → 写指令;- 写指令 → 决策置 executed;- 装配上下文 → 决策置 failed:装配失败;- 规划 → 决策置 failed:耗尽或桥接失败;- 分配 run id → 决策置 failed:编号冲突;- 解析动作 → 决策置 failed:解析失败;- 写指令 → 决策置 failed:构造失败</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="790" fill="#ffffff"/><path d="M300.0,95.0 L240.0,95.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M460.0,130.0 L460.0,180.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M334.0,130.0 L334.0,153.0 Q334.0,160.0 327.0,160.0 L277.0,160.0 Q270.0,160.0 270.0,167.0 L270.0,521.0 Q270.0,528.0 277.0,528.0 L330.0,528.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M318.0,130.0 L318.0,143.0 Q318.0,150.0 311.0,150.0 L237.0,150.0 Q230.0,150.0 230.0,157.0 L230.0,681.0 Q230.0,688.0 237.0,688.0 L330.0,688.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M460.0,236.0 L460.0,260.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M460.0,316.0 L460.0,340.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M460.0,396.0 L460.0,420.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M460.0,476.0 L460.0,500.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M460.0,556.0 L460.0,580.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M460.0,636.0 L460.0,660.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M590.0,208.0 L700.0,208.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M590.0,288.0 L700.0,288.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M590.0,368.0 L700.0,368.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M590.0,528.0 L700.0,528.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M590.0,608.0 L700.0,608.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><polygon points="316.0,60.0 604.0,60.0 620.0,95.0 604.0,130.0 316.0,130.0 300.0,95.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="460.0" y="91.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">决策产物的状态</text><text x="460.0" y="108.0" text-anchor="middle" font-size="12" fill="#475569">planner_decision.yaml</text><rect x="40" y="67" width="200" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="140.0" y="91.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">空操作</text><text x="140.0" y="108.0" text-anchor="middle" font-size="12" fill="#475569">零提交</text><rect x="330" y="180" width="260" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="460.0" y="204.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">装配上下文</text><text x="460.0" y="221.1" text-anchor="middle" font-size="12" fill="#475569">assemble_context</text><rect x="330" y="260" width="260" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="460.0" y="284.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">规划</text><text x="460.0" y="301.1" text-anchor="middle" font-size="12" fill="#475569">plan() 带 validator</text><rect x="330" y="340" width="260" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="460.0" y="364.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">分配 run id</text><text x="460.0" y="381.1" text-anchor="middle" font-size="12" fill="#475569">allocate_run_id</text><rect x="330" y="420" width="260" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="460.0" y="444.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">写决策 pending</text><text x="460.0" y="461.1" text-anchor="middle" font-size="12" fill="#475569">载荷带 next_run_id</text><rect x="330" y="500" width="260" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="460.0" y="524.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">解析动作</text><text x="460.0" y="541.0" text-anchor="middle" font-size="12" fill="#475569">resolve_action</text><rect x="330" y="580" width="260" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="460.0" y="604.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">写指令</text><text x="460.0" y="621.0" text-anchor="middle" font-size="12" fill="#475569">construct_directive</text><rect x="330" y="660" width="260" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="460.0" y="684.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">决策置 executed</text><text x="460.0" y="701.0" text-anchor="middle" font-size="12" fill="#475569">本轮规划完成</text><rect x="700" y="180" width="340" height="456" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="870.0" y="386.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">决策置 failed</text><text x="870.0" y="403.6" text-anchor="middle" font-size="12" fill="#475569">failure = {T3, reason, attempts}</text><text x="870.0" y="421.0" text-anchor="middle" font-size="12" fill="#475569">record_failure 写失败记录</text><text x="870.0" y="438.4" text-anchor="middle" font-size="12" fill="#475569">正常返回,不上抛</text><circle cx="318" cy="326" r="10" fill="#dc2626"/><text x="318" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">A</text><circle cx="318" cy="486" r="10" fill="#dc2626"/><text x="318" y="490" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">B</text><circle cx="318" cy="646" r="10" fill="#dc2626"/><text x="318" y="650" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">C</text><rect x="20" y="300" width="200" height="142.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/><rect x="20" y="300" width="4" height="142.0" rx="2" fill="#dc2626"/><text x="34" y="320.0" font-size="12" fill="#0f172a">A:树里什么都没写</text><text x="34" y="338.0" font-size="12" fill="#0f172a">下次触发从头规划</text><text x="34" y="356.0" font-size="12" fill="#0f172a">B:决策 pending、指令不在</text><text x="34" y="374.0" font-size="12" fill="#0f172a">走 (a) 从解析续写</text><text x="34" y="392.0" font-size="12" fill="#0f172a">不调后端、不重新分配</text><text x="34" y="410.0" font-size="12" fill="#0f172a">C:指令已在</text><text x="34" y="428.0" font-size="12" fill="#0f172a">走 (b) 只置 executed</text><rect x="700" y="660" width="340" height="52.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="700" y="660" width="4" height="52.0" rx="2" fill="#64748b"/><text x="714" y="680.0" font-size="12" fill="#0f172a">非桥接异常(OSError 等)、配置错、模板缺失</text><text x="714" y="698.0" font-size="12" fill="#0f172a">原样上抛,决策保持原状</text><rect x="254.0" y="85.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="270.0" y="99.3" text-anchor="middle" font-size="12" fill="#475569">终态</text><rect x="444.0" y="145.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="460.0" y="159.3" text-anchor="middle" font-size="12" fill="#475569">不在</text><rect x="258.3" y="291.5" width="23.5" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="270.0" y="305.2" text-anchor="middle" font-size="12" fill="#475569">(a)</text><rect x="218.3" y="480.2" width="23.5" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="230.0" y="493.9" text-anchor="middle" font-size="12" fill="#475569">(b)</text><rect x="617.0" y="198.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="645.0" y="212.3" text-anchor="middle" font-size="12" fill="#475569">装配失败</text><rect x="599.0" y="278.6" width="92.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="645.0" y="292.3" text-anchor="middle" font-size="12" fill="#475569">耗尽或桥接失败</text><rect x="617.0" y="358.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="645.0" y="372.3" text-anchor="middle" font-size="12" fill="#475569">编号冲突</text><rect x="617.0" y="518.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="645.0" y="532.3" text-anchor="middle" font-size="12" fill="#475569">解析失败</text><rect x="617.0" y="598.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="645.0" y="612.3" text-anchor="middle" font-size="12" fill="#475569">构造失败</text><text x="470" y="330" text-anchor="start" font-size="11" fill="#dc2626" font-weight="700">崩溃点 A</text><text x="470" y="490" text-anchor="start" font-size="11" fill="#dc2626" font-weight="700">崩溃点 B</text><text x="470" y="650" text-anchor="start" font-size="11" fill="#dc2626" font-weight="700">崩溃点 C</text><rect x="40" y="760" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="65" y="771" font-size="12" fill="#475569">处理器步骤</text><rect x="147.0" y="760" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="172.0" y="771" font-size="12" fill="#475569">确定性失败与崩溃点</text><rect x="302.0" y="760" width="18" height="13" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="327.0" y="771" font-size="12" fill="#475569">空操作与上抛</text></svg>
