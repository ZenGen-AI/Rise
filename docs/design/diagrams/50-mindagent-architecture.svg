<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">MindAgent 模块组成</title><desc id="d">轮次处理器按编号顺序调用五段流水线,读配置与正式库,失败经统一守卫留痕。收录处理器独立运行,只用正式库与失败守卫。全部模块都在 src/mindagent 下。 节点;- AgentConfig:config · 冻结数据类;- 正式库读取:library · load_library;- 失败守卫:failures · fail_once;- 收录处理器:admit / make_admit_proposal_handler;- 轮次处理器:rounds · make_start_round_handler 返回 (store, action) 处理器;- 部署驱动器:deployment / 跑部署 episode;- 经验分析器:analysis / 跨 episode 统计;- 提案生成器:proposals / 规则模板或桥接;- 提案验证器:verify / 离线重放度量行为;- 提案打包器:packaging / 筛选并写提案;连线;- 轮次处理器 → AgentConfig;- 轮次处理器 → 正式库读取;- 轮次处理器 → 失败守卫;- 收录处理器 → 失败守卫;- 收录处理器 → 正式库读取;- 轮次处理器 → 部署驱动器;- 轮次处理器 → 经验分析器;- 轮次处理器 → 提案生成器;- 轮次处理器 → 提案验证器;- 轮次处理器 → 提案打包器</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="600" fill="#ffffff"/><rect x="14" y="30" width="1052" height="520" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="52" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">src/mindagent</text><path d="M150.0,240.0 L150.0,144.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M410.0,240.0 L410.0,144.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M670.0,240.0 L670.0,144.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M820.0,112.0 L780.0,112.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M930.0,80.0 L930.0,57.0 Q930.0,50.0 923.0,50.0 L417.0,50.0 Q410.0,50.0 410.0,57.0 L410.0,80.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M132.0,304.0 L132.0,400.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M336.0,304.0 L336.0,400.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,304.0 L540.0,400.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M744.0,304.0 L744.0,400.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M948.0,304.0 L948.0,400.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="40" y="80" width="220" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="150.0" y="108.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">AgentConfig</text><text x="150.0" y="125.0" text-anchor="middle" font-size="12" fill="#475569">config · 冻结数据类</text><rect x="300" y="80" width="220" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="410.0" y="108.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">正式库读取</text><text x="410.0" y="125.0" text-anchor="middle" font-size="12" fill="#475569">library · load_library</text><rect x="560" y="80" width="220" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="108.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">失败守卫</text><text x="670.0" y="125.0" text-anchor="middle" font-size="12" fill="#475569">failures · fail_once</text><rect x="820" y="80" width="220" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="930.0" y="99.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">收录处理器</text><text x="930.0" y="116.3" text-anchor="middle" font-size="12" fill="#475569">admit</text><text x="930.0" y="133.8" text-anchor="middle" font-size="12" fill="#475569">make_admit_proposal_handler</text><rect x="40" y="240" width="1000" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="540.0" y="268.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">轮次处理器</text><text x="540.0" y="285.1" text-anchor="middle" font-size="12" fill="#475569">rounds · make_start_round_handler 返回 (store, action) 处理器</text><rect x="40" y="400" width="184" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="132.0" y="422.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">部署驱动器</text><text x="132.0" y="439.4" text-anchor="middle" font-size="12" fill="#475569">deployment</text><text x="132.0" y="456.8" text-anchor="middle" font-size="12" fill="#475569">跑部署 episode</text><rect x="244" y="400" width="184" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="336.0" y="422.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">经验分析器</text><text x="336.0" y="439.4" text-anchor="middle" font-size="12" fill="#475569">analysis</text><text x="336.0" y="456.8" text-anchor="middle" font-size="12" fill="#475569">跨 episode 统计</text><rect x="448" y="400" width="184" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="540.0" y="422.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">提案生成器</text><text x="540.0" y="439.4" text-anchor="middle" font-size="12" fill="#475569">proposals</text><text x="540.0" y="456.8" text-anchor="middle" font-size="12" fill="#475569">规则模板或桥接</text><rect x="652" y="400" width="184" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="744.0" y="422.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">提案验证器</text><text x="744.0" y="439.4" text-anchor="middle" font-size="12" fill="#475569">verify</text><text x="744.0" y="456.8" text-anchor="middle" font-size="12" fill="#475569">离线重放度量行为</text><rect x="856" y="400" width="184" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="948.0" y="422.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">提案打包器</text><text x="948.0" y="439.4" text-anchor="middle" font-size="12" fill="#475569">packaging</text><text x="948.0" y="456.8" text-anchor="middle" font-size="12" fill="#475569">筛选并写提案</text><circle cx="40" cy="400" r="10" fill="#16a34a"/><text x="40" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text><circle cx="244" cy="400" r="10" fill="#16a34a"/><text x="244" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text><circle cx="448" cy="400" r="10" fill="#16a34a"/><text x="448" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text><circle cx="652" cy="400" r="10" fill="#16a34a"/><text x="652" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text><circle cx="856" cy="400" r="10" fill="#16a34a"/><text x="856" y="404" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text><rect x="40" y="486" width="700" height="52.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="40" y="486" width="4" height="52.0" rx="2" fill="#64748b"/><text x="54" y="506.0" font-size="12" fill="#0f172a">可以导入:controlplane、simple_actio、inference_bridge、simulator(数据模型、产物读写、实时客户端)</text><text x="54" y="524.0" font-size="12" fill="#0f172a">不得导入:mindtrainer、diagnostic、factory;controlplane 也不导入 mindagent</text><rect x="40" y="570" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="65" y="581" font