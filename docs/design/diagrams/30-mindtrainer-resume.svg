<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" width="1080" height="610" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">续训判定</title><desc id="d">decide_resume 对已有的训练记录按六条规则依次判定,先命中者生效;未知状态直接抛 ValueError。结论只有四种:noop 原样返回,resume 从中间存点续,restart 从基座重来,escalate 交给人。 节点;- 已 executed 或 consumed?;- 状态是 failed?;- resume_attempts ≥ 上限?;- allow_resume 为假?;- 有 last_checkpoint_ref?;- checkpoint_intact 为 True?;- noop:原样返回已有记录;- escalate:抛 NeedsHumanError / 派发器记 T3,指令置 failed / 记录本身不改;- restart:从 base_checkpoint_ref 的 step 0 重来;- resume:从 checkpoint_step 续训;连线;- 已 executed 或 consumed? → 状态是 failed?:否;- 状态是 failed? → resume_attempts ≥ 上限?:否;- resume_attempts ≥ 上限? → allow_resume 为假?:否;- allow_resume 为假? → 有 last_checkpoint_ref?:否;- 有 last_checkpoint_ref? → checkpoint_intact 为 True?:是;- 已 executed 或 consumed? → noop:是;- 状态是 failed? → escalate:是 · 规则 2;- resume_attempts ≥ 上限? → escalate:是 · 规则 3;- allow_resume 为假? → escalate:是 · 规则 4;- 有 last_checkpoint_ref? → restart:否 · 从未存点;- checkpoint_intact 为 True? → resume:是;- checkpoint_intact 为 True? → escalate:否 · 损坏或无法确认</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="610" fill="#ffffff"/><path d="M205.0,108.0 L205.0,140.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M205.0,192.0 L205.0,224.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M205.0,276.0 L205.0,308.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M205.0,360.0 L205.0,392.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M205.0,444.0 L205.0,476.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M370.0,82.0 L720.0,82.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M370.0,166.0 L720.0,166.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M370.0,250.0 L720.0,250.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M370.0,334.0 L720.0,334.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M370.0,418.0 L720.0,418.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M370.0,502.0 L720.0,502.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M205.0,528.0 L205.0,549.0 Q205.0,556.0 212.0,556.0 L1041.0,556.0 Q1048.0,556.0 1048.0,549.0 L1048.0,334.0 Q1048.0,327.0 1041.0,327.0 L1020.0,327.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><polygon points="56.0,56.0 354.0,56.0 370.0,82.0 354.0,108.0 56.0,108.0 40.0,82.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="205.0" y="87.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">已 executed 或 consumed?</text><polygon points="56.0,140.0 354.0,140.0 370.0,166.0 354.0,192.0 56.0,192.0 40.0,166.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="205.0" y="170.9" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">状态是 failed?</text><polygon points="56.0,224.0 354.0,224.0 370.0,250.0 354.0,276.0 56.0,276.0 40.0,250.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="205.0" y="254.9" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">resume_attempts ≥ 上限?</text><polygon points="56.0,308.0 354.0,308.0 370.0,334.0 354.0,360.0 56.0,360.0 40.0,334.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="205.0" y="338.9" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">allow_resume 为假?</text><polygon points="56.0,392.0 354.0,392.0 370.0,418.0 354.0,444.0 56.0,444.0 40.0,418.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="205.0" y="422.9" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">有 last_checkpoint_ref?</text><polygon points="56.0,476.0 354.0,476.0 370.0,502.0 354.0,528.0 56.0,528.0 40.0,502.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="205.0" y="506.9" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">checkpoint_intact 为 True?</text><rect x="720" y="56" width="300" height="52" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="870.0" y="78.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">noop</text><text x="870.0" y="95.0" text-anchor="middle" font-size="12" fill="#475569">原样返回已有记录</text><rect x="720" y="140" width="300" height="220" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="870.0" y="228.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">escalate</text><text x="870.0" y="245.7" text-anchor="middle" font-size="12" fill="#475569">抛 NeedsHumanError</text><text x="870.0" y="263.1" text-anchor="middle" font-size="12" fill="#475569">派发器记 T3,指令置 failed</text><text x="870.0" y="280.4" text-anchor="middle" font-size="12" fill="#475569">记录本身不改</text><rect x="720" y="392" width="300" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="870.0" y="414.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">restart</text><text x="870.0" y="431.1" text-anchor="middle" font-size="12" fill="#475569">从 base_checkpoint_ref 的 step 0 重来</text><rect x="720" y="476" width="300" height="52" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="870.0" y="498.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">resume</text><text x="870.0" y="515.0" text-anchor="middle" font-size="12" fill="#475569">从 checkpoint_step 续训</text><rect x="195.0" y="114.6" width="20.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="205.0" y="128.3" text-anchor="middle" font-size="12" fill="#475569">否</text><rect x="195.0" y="198.6" width="20.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="205.0" y="212.3" text-anchor="middle" font-size="12" fill="#475569">否</text><rect x="195.0" y="282.6" width="20.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="205.0" y="296.3" text-anchor="middle" font-size="12" fill="#475569">否</text><rect x="195.0" y="366.6" width="20.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="205.0" y="380.3" text-anchor="middle" font-size="12" fill="#475569">否</text><rect x="195.0" y="450.6" width="20.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="205.0" y="464.3" text-anchor="middle" font-size="12" fill="#475569">是</text><rect x="535.0" y="72.6" width="20.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="545.0" y="86.3" text-anchor="middle" font-size="12" fill="#475569">是</text><rect x="508.1" y="156.6" width="73.9" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="545.0" y="170.3" text-anchor="middle" font-size="12" fill="#475569">是 · 规则 2</text><rect x="508.1" y="240.6" width="73.9" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="545.0" y="254.3" text-anchor="middle" font-size="12" fill="#475569">是 · 规则 3</text><rect x="508.1" y="324.6" width="73.9" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="545.0" y="338.3" text-anchor="middle" font-size="12" fill="#475569">是 · 规则 4</text><rect x="501.5" y="408.6" width="87.1" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="545.0" y="422.3" text-anchor="middle" font-size="12" fill="#475569">否 · 从未存点</text><rect x="535.0" y="492.6" width="20.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="545.0" y="506.3" text-anchor="middle" font-size="12" fill="#475569">是</text><rect x="453.9" y="546.6" width="123.1" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="515.4" y="560.3" text-anchor="middle" font-size="12" fill="#475569">否 · 损坏或无法确认</text><rect x="40" y="584" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="65" y="595" font-size="12" fill="#475569">判断点</text><rect x="123.0" y="584" width="18" height="13" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="148.0" y="595" font-size="12" fill="#475569">需人工 T3</text><rect x="224.96" y="584" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="249.96" y="595" font-size="12" fill="#475569">自动续训</text><rect x="319.96000000000004" y="584" width="18" height="13" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="344.96000000000004" y="595" font-size="12" fill="#475569">无动作</text></svg>
