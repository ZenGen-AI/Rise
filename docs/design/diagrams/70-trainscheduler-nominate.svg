<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 740" width="1080" height="740" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">提名处理器的判定</title><desc id="d">提名标记 nomination.yaml 是幂等键。候选已在时只补标记、不改候选。nomination_check 按固定顺序判定:还没到的情形不写标记,终局不提名写 skipped,通过才构造配方候选并写 nominated。 节点;- 提名标记在吗:nomination.yaml;- 空操作:标记就是幂等键;- 配方候选已在吗:recipe_candidates/recipe-&lt;run&gt;;- 只补 nominated 标记:候选一个字节都不改;- nomination_check:按固定顺序判定,第一条命中即停;- 不写标记,返回:还没到,下次触发再判;- 写 skipped 标记:终局,原因写进 reason;- build_recipe_candidate:按配方载荷拼候选并附 repro;- 写配方候选:状态 pending_review,等审核门③;- 写 nominated 标记:result · reason · gain · 基线 run;连线;- 提名标记在吗 → 空操作:在;- 提名标记在吗 → 配方候选已在吗:不在;- 配方候选已在吗 → 只补 nominated 标记:在;- 配方候选已在吗 → nomination_check:不在;- nomination_check → 不写标记,返回:还没到;- nomination_check → 写 skipped 标记:终局不提名;- nomination_check → build_recipe_candidate:提名;- build_recipe_candidate → 写配方候选;- 写配方候选 → 写 nominated 标记</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="740" fill="#ffffff"/><path d="M360.0,83.0 L270.0,83.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M520.0,116.0 L520.0,160.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M360.0,193.0 L270.0,193.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M520.0,226.0 L520.0,280.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M360.0,301.0 L270.0,301.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M360.0,328.0 L322.0,328.0 Q315.0,328.0 315.0,335.0 L315.0,421.0 Q315.0,428.0 308.0,428.0 L270.0,428.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M520.0,340.0 L520.0,400.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M520.0,460.0 L520.0,510.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M520.0,570.0 L520.0,620.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><polygon points="376.0,50.0 664.0,50.0 680.0,83.0 664.0,116.0 376.0,116.0 360.0,83.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="520.0" y="79.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">提名标记在吗</text><text x="520.0" y="96.0" text-anchor="middle" font-size="12" fill="#475569">nomination.yaml</text><rect x="40" y="55" width="230" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="155.0" y="79.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">空操作</text><text x="155.0" y="96.0" text-anchor="middle" font-size="12" fill="#475569">标记就是幂等键</text><polygon points="376.0,160.0 664.0,160.0 680.0,193.0 664.0,226.0 376.0,226.0 360.0,193.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="520.0" y="189.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">配方候选已在吗</text><text x="520.0" y="206.1" text-anchor="middle" font-size="12" fill="#475569">recipe_candidates/recipe-&lt;run&gt;</text><rect x="40" y="165" width="230" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="155.0" y="189.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">只补 nominated 标记</text><text x="155.0" y="206.1" text-anchor="middle" font-size="12" fill="#475569">候选一个字节都不改</text><rect x="360" y="280" width="320" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="520.0" y="306.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">nomination_check</text><text x="520.0" y="323.1" text-anchor="middle" font-size="12" fill="#475569">按固定顺序判定,第一条命中即停</text><rect x="40" y="282" width="230" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="155.0" y="306.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">不写标记,返回</text><text x="155.0" y="323.1" text-anchor="middle" font-size="12" fill="#475569">还没到,下次触发再判</text><rect x="40" y="400" width="230" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="155.0" y="424.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">写 skipped 标记</text><text x="155.0" y="441.1" text-anchor="middle" font-size="12" fill="#475569">终局,原因写进 reason</text><rect x="360" y="400" width="320" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="520.0" y="426.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">build_recipe_candidate</text><text x="520.0" y="443.1" text-anchor="middle" font-size="12" fill="#475569">按配方载荷拼候选并附 repro</text><rect x="360" y="510" width="320" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="520.0" y="536.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">写配方候选</text><text x="520.0" y="553.0" text-anchor="middle" font-size="12" fill="#475569">状态 pending_review,等审核门③</text><rect x="360" y="620" width="320" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="520.0" y="646.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">写 nominated 标记</text><text x="520.0" y="663.0" text-anchor="middle" font-size="12" fill="#475569">result · reason · gain · 基线 run</text><rect x="720" y="280" width="340" height="232.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="720" y="280" width="4" height="232.0" rx="2" fill="#64748b"/><text x="734" y="300.0" font-size="12" fill="#0f172a">判定顺序</text><text x="734" y="318.0" font-size="12" fill="#0f172a">1 无候选 checkpoint:还没到</text><text x="734" y="336.0" font-size="12" fill="#0f172a">2 候选 rejected:终局</text><text x="734" y="354.0" font-size="12" fill="#0f172a">3 候选 pending_review 或 approved:还没到</text><text x="734" y="372.0" font-size="12" fill="#0f172a">4 无指令:还没到</text><text x="734" y="390.0" font-size="12" fill="#0f172a">5 指令 mode 不是 batch 或 interact:终局</text><text x="734" y="408.0" font-size="12" fill="#0f172a">6 指令无 target_dimension:终局</text><text x="734" y="426.0" font-size="12" fill="#0f172a">7 无诊断报告:还没到</text><text x="734" y="444.0" font-size="12" fill="#0f172a">8 证据等级不可接受:终局</text><text x="734" y="462.0" font-size="12" fill="#0f172a">9 compute_gain 为 None:终局</text><text x="734" y="480.0" font-size="12" fill="#0f172a">10 增益低于 min_gain:终局</text><text x="734" y="498.0" font-size="12" fill="#0f172a">11 报告带退化标记:终局</text><rect x="305.0" y="73.6" width="20.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="315.0" y="87.3" text-anchor="middle" font-size="12" fill="#475569">在</text><rect x="504.0" y="128.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="520.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">不在</text><rect x="305.0" y="183.6" width="20.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="315.0" y="197.3" text-anchor="middle" font-size="12" fill="#475569">在</text><rect x="504.0" y="243.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="520.0" y="257.3" text-anchor="middle" font-size="12" fill="#475569">不在</text><rect x="293.0" y="291.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="315.0" y="305.3" text-anchor="middle" font-size="12" fill="#475569">还没到</text><rect x="281.0" y="406.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="315.0" y="420.3" text-anchor="middle" font-size="12" fill="#475569">终局不提名</text><rect x="504.0" y="360.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="520.0" y="374.3" text-anchor="middle" font-size="12" fill="#475569">提名</text><rect x="40" y="712" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="65" y="723" font-size="12" fill="#475569">处理器动作</text><rect x="147.0" y="712" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="172.0" y="723" font-size="12" fill="#475569">终局不提名</text><rect x="254.0" y="712" width="18" height="13" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="279.0" y="723" font-size="12" fill="#475569">空操作与等待</text></svg>
