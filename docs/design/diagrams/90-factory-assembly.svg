<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">组合根的装配流程</title><desc id="d">不传 --enable 时只构造 MindTrainer 派发器,与现有入口逐字节相同。传了 --enable 时读配置、校验资产与凭证、构造评估器与处理器,全部在第一个 tick 之前完成;任一步出错打印一行错误、退出码 2,树里不写任何东西。 节点;- 解析开关:--enable → ENABLE_MAP / 未知开关与空项拒绝;- 有处理器键吗:handler_keys 非空?;- 默认路径:只构造 / make_mindtrainer_dispatcher();- run_daemon:只传 dispatcher / 不读任何配置;- 读评估器配置:config/evaluator.yaml / 恰好五个键;- 校验诊断资产:分类表与题库在树里 / 评估后端注入;- 构造处理器:DEFAULT_BUILDERS / 桥接 · 凭证 · agent.yaml;- 注入并启动:dispatcher + 数据生产器 / handlers · evaluator;- FactoryConfigError:标准错误打印 factory: error: ... / 退出码 2 · 树里不写任何东西;连线;- 解析开关 → 有处理器键吗;- 有处理器键吗 → 默认路径:否;- 默认路径 → run_daemon;- 有处理器键吗 → 读评估器配置:是;- 读评估器配置 → 校验诊断资产;- 校验诊断资产 → 构造处理器;- 构造处理器 → 注入并启动;- 读评估器配置 → FactoryConfigError:缺文件或键;- 校验诊断资产 → FactoryConfigError:缺资产;- 构造处理器 → FactoryConfigError:缺角色或凭证</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="620" fill="#ffffff"/><path d="M270.0,96.0 L330.0,96.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M530.0,96.0 L590.0,96.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M820.0,96.0 L870.0,96.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M430.0,132.0 L430.0,174.0 Q430.0,181.0 423.0,181.0 L219.5,181.0 Q212.5,181.0 212.5,188.0 L212.5,230.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M270.0,266.0 L330.0,266.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M550.0,266.0 L610.0,266.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M830.0,266.0 L860.0,266.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M155.0,302.0 L155.0,449.0 Q155.0,456.0 162.0,456.0 L330.0,456.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M440.0,302.0 L440.0,420.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M720.0,302.0 L720.0,354.0 Q720.0,361.0 713.0,361.0 L687.0,361.0 Q680.0,361.0 680.0,368.0 L680.0,420.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="40" y="60" width="230" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="155.0" y="83.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">解析开关</text><text x="155.0" y="100.3" text-anchor="middle" font-size="12" fill="#475569">--enable → ENABLE_MAP</text><text x="155.0" y="117.8" text-anchor="middle" font-size="12" fill="#475569">未知开关与空项拒绝</text><polygon points="346.0,60.0 514.0,60.0 530.0,96.0 514.0,132.0 346.0,132.0 330.0,96.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="430.0" y="92.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">有处理器键吗</text><text x="430.0" y="109.0" text-anchor="middle" font-size="12" fill="#475569">handler_keys 非空?</text><rect x="590" y="60" width="230" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="705.0" y="83.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">默认路径</text><text 