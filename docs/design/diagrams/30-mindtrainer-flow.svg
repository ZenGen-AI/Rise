<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">一次训练的编排</title><desc id="d">派发器校验指令、算好起点记忆摘要并备好轨迹源。编排器读训练记录判定起点,落盘后加载权重。batch 先对整份 GRPO 数据集预检,再逐步训练并周期存点;最后一步之后存最终点、转换格式、注册候选、记录置 executed。确定性失败把记录写成 failed,其余异常让记录保持 pending。 节点;- 派发器准备:读并校验 training_config / interact 算起点记忆摘要 / 构造归因后端与轨迹源;- 判定起点:decide_resume / noop 返回 · escalate 抛出;- 起点落盘:写 pending 记录 / 再 executor.load;- batch 预检:整份 GRPO 数据算奖励 / 校验组大小与组数;- 逐步训练:phase_at · batch_for_step / sft_step / grpo_opd_step;- 周期存点:每 checkpoint_every_steps 步 / 回写引用与曲线摘要;- 最终存点与转换:先回写 pending / 再 converter.convert;- 注册候选:candidate pending_review / 记录置 executed;- 确定性失败:记录写 failed · T2 / 异常原样重抛;- 其余异常:记录保持 pending / 下次派发时续训;连线;- 派发器准备 → 判定起点;- 判定起点 → 起点落盘;- 起点落盘 → batch 预检;- batch 预检 → 逐步训练;- 逐步训练 → 周期存点;- 周期存点 → 逐步训练;- 逐步训练 → 最终存点与转换:最后一步之后;- 最终存点与转换 → 注册候选;- 逐步训练 → 确定性失败:数据或配置坏(含步骤 4);- 逐步训练 → 其余异常:崩溃 · 瞬态</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="560" fill="#ffffff"/><path d="M260.0,110.0 L290.0,110.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M520.0,110.0 L550.0,110.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M780.0,110.0 L810.0,110.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M925.0,150.0 L925.0,188.0 Q925.0,195.0 918.0,195.0 L672.0,195.0 Q665.0,195.0 665.0,202.0 L665.0,240.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M780.0,264.0 L810.0,264.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M810.0,296.0 L780.0,296.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M665.0,320.0 L665.0,410.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M780.0,450.0 L810.0,450.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M550.0,264.0 L260.0,264.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M550.0,296.0 L412.0,296.0 Q405.0,296.0 405.0,303.0 L405.0,443.0 Q405.0,450.0 398.0,450.0 L260.0,450.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="30" y="70" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="145.0" y="88.9" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">派发器准备</text><text x="145.0" y="105.7" text-anchor="middle" font-size="12" fill="#475569">读并校验 training_config</text><text x="145.0" y="123.1" text-anchor="middle" font-size="12" fill="#475569">interact 算起点记忆摘要</text><text x="145.0" y="140.4" text-anchor="middle" font-size="12" fill="#475569">构造归因后端与轨迹源</text><rect x="290" y="70" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="405.0" y="97.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">判定起点</text><text x="405.0" y="114.3" text-anchor="middle" font-size="12" fill="#475569">decide_resume</text><text x="405.0" y="131.8" text-anchor="middle" font-size="12" fill="#475569">noop 返回 · escalate 抛出</text><rect x="550" y="70" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="665.0" y="97.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">起点落盘</text><text x="665.0" y="114.3" text-anchor="middle" font-size="12" fill="#475569">写 pending 记录</text><text x="665.0" y="131.8" text-anchor="middle" font-size="12" fill="#475569">再 executor.load</text><rect x="810" y="70" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="925.0" y="97.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">batch 预检</text><text x="925.0" y="114.3" text-anchor="middle" font-size="12" fill="#475569">整份 GRPO 数据算奖励</text><text x="925.0" y="131.8" text-anchor="middle" font-size="12" fill="#475569">校验组大小与组数</text><rect x="550" y="240" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="665.0" y="267.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">逐步训练</text><text x="665.0" y="284.4" text-anchor="middle" font-size="12" fill="#475569">phase_at · batch_for_step</text><text x="665.0" y="301.8" text-anchor="middle" font-size="12" fill="#475569">sft_step / grpo_opd_step</text><rect x="810" y="240" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="925.0" y="267.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">周期存点</text><text x="925.0" y="284.4" text-anchor="middle" font-size="12" fill="#475569">每 checkpoint_every_steps 步</text><text x="925.0" y="301.8" text-anchor="middle" font-size="12" fill="#475569">回写引用与曲线摘要</text><rect x="550" y="410" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="665.0" y="437.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">最终存点与转换</text><text x="665.0" y="454.4" text-anchor="middle" font-size="12" fill="#475569">先回写 pending</text><text x="665.0" y="471.8" text-anchor="middle" font-size="12" fill="#475569">再 converter.convert</text><rect x="810" y="410" width="230" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="925.0" y="437.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">注册候选</text><text x="925.0" y="454.4" text-anchor="middle" font-size="12" fill="#475569">candidate pending_review</text><text x="925.0" y="471.8" text-anchor="middle" font-size="12" fill="#475569">记录置 executed</text><rect x="30" y="240" width="230" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="145.0" y="267.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">确定性失败</text><text x="145.0" y="284.4" text-anchor="middle" font-size="12" fill="#475569">记录写 failed · T2</text><text x="145.0" y="301.8" text-anchor="middle" font-size="12" fill="#475569">异常原样重抛</text><rect x="30" y="410" width="230" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="145.0" y="437.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">其余异常</text><text x="145.0" y="454.4" text-anchor="middle" font-size="12" fill="#475569">记录保持 pending</text><text x="145.0" y="471.8" text-anchor="middle" font-size="12" fill="#475569">下次派发时续训</text><circle cx="30" cy="70" r="10" fill="#16a34a"/><text x="30" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text><circle cx="290" cy="70" r="10" fill="#16a34a"/><text x="290" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text><circle cx="550" cy="70" r="10" fill="#16a34a"/><text x="550" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text><circle cx="810" cy="70" r="10" fill="#16a34a"/><text x="810" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text><circle cx="550" cy="240" r="10" fill="#16a34a"/><text x="550" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text><circle cx="810" cy="240" r="10" fill="#16a34a"/><text x="810" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text><circle cx="550" cy="410" r="10" fill="#16a34a"/><text x="550" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text><circle cx="810" cy="410" r="10" fill="#16a34a"/><text x="810" y="414" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text><rect x="625.0" y="355.6" width="80.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="665.0" y="369.3" text-anchor="middle" font-size="12" fill="#475569">最后一步之后</text><rect x="337.3" y="254.6" width="135.4" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="405.0" y="268.3" text-anchor="middle" font-size="12" fill="#475569">数据或配置坏(含步骤 4)</text><rect x="367.5" y="363.6" width="75.1" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="405.0" y="377.3" text-anchor="middle" font-size="12" fill="#475569">崩溃 · 瞬态</text><rect x="40" y="530" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="65" y="541" font-size="12" fill="#475569">编排步骤</text><rect x="135.0" y="530" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="160.0" y="541" font-size="12" fill="#475569">确定性失败</text><rect x="242.0" y="530" width="18" height="13" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="267.0" y="541" font-size="12" fill="#475569">交给续训</text></svg>
