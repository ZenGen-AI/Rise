<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" width="1080" height="630" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">Actio 的模块组成</title><desc id="d">instance 在顶层编排技能路由、推理经验、记忆检索与轨迹组装。技能与经验共用触发谓词语言,谓词语言从信号注册表取信号,信号与记忆共用一处词面切分。箭头指向被导入的模块。errors 与 _check 被各模块导入,不画线。 节点;- instance.py:instantiate · ActioInstance.respond / decide / GuidedBackend · IgnoreGuidance · render_guidance;- skills.py:Skill · route · check_library / 排序键 (-priority, -version, id);- experience.py:ReasoningExperience / activate · select_tier 三级回退;- memory.py:MemoryEntry · snapshot / retrieve 词面重叠检索;- trace.py:build_trace · validate_trace / normalize_library_version;- triggers.py:五个算子 · 校验 · 求值 / referenced_signals;- signals.py:SignalRegistry / default_registry · 三个内置信号;- errors.py · _check.py:ActioDataError · 字段校验 / 被各模块导入;- text.py:tokens:ASCII 整词 / 汉字相邻二字切分;- simulator.datamodel:TurnRecord · Persona / Scenario · 唯一的包外导入;连线;- instance.py → skills.py;- instance.py → experience.py;- instance.py → memory.py;- instance.py → trace.py;- skills.py → triggers.py;- experience.py → triggers.py;- triggers.py → signals.py;- signals.py → text.py;- memory.py → text.py;- signals.py → simulator.datamodel:TurnRecord</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="630" fill="#ffffff"/><path d="M372.0,134.0 L372.0,165.0 Q372.0,172.0 365.0,172.0 L162.0,172.0 Q155.0,172.0 155.0,179.0 L155.0,210.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M485.4,134.0 L485.4,165.0 Q485.4,172.0 478.4,172.0 L412.0,172.0 Q405.0,172.0 405.0,179.0 L405.0,210.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-lin