<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" width="1080" height="500" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">条目如何进入规划上下文</title><desc id="d">装配上下文时按目标维度与当前基准版本筛出可用条目,按支持数与平均增益排序,截断到最多三条并受字符预算约束,再渲染成规划上下文的第七段。没有可用条目时该段渲染为空列表,提示逐字节稳定。 节点;- 7 取目标维度:诊断里一级分最低的维度 / 同分按维度名升序;- 8 筛可用条目:effective 且基准版本相同 / 反例过半的不注入;- 9 排序并截断:支持数降序 · 平均增益降序 / 最多三条;- 10 渲染第七段:每条一行 / 字符预算 900;- 11 交给规划器:PlanningContext 第七段 / 模板 PLANNER_V2;连线;- 7 取目标维度 → 8 筛可用条目;- 8 筛可用条目 → 9 排序并截断;- 9 排序并截断 → 10 渲染第七段;- 10 渲染第七段 → 11 交给规划器</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="500" fill="#ffffff"/><rect x="14" y="44" width="1052" height="330" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">assemble_context 的第七段</text><path d="M290.0,138.0 L340.0,138.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M590.0,138.0 L640.0,138.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M765.0,180.0 L765.0,250.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M640.0,292.0 L590.0,292.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="40" y="96" width="250" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="165.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">7 取目标维度</text><text x="165.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">诊断里一级分最低的维度</text><text x="165.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">同分按维度名升序</text><rect x="340" y="96" width="250" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="465.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">8 筛可用条目</text><text x="465.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">effective 且基准版本相同</text><text x="465.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">反例过半的不注入</text><rect x="640" y="96" width="250" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="765.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">9 排序并截断</text><text x="765.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">支持数降序 · 平均增益降序</text><text x="765.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">最多三条</text><rect x="640" y="250" width="250" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="765.0" y="279.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">10 渲染第七段</text><text x="765.0" y="296.4" text-anchor="middle" font-size="12" fill="#475569">每条一行</text><text x="765.0" y="313.8" text-anchor="middle" font-size="12" fill="#475569">字符预算 900</text><rect x="340" y="250" width="250" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="465.0" y="279.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">11 交给规划器</text><text x="465.0" y="296.4" text-anchor="middle" font-size="12" fill="#475569">PlanningContext 第七段</text><text x="465.0" y="313.8" text-anchor="middle" font-size="12" fill="#475569">模板 PLANNER_V2</text><rect x="40" y="250" width="250" height="70.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="40" y="250" width="4" height="70.0" rx="2" fill="#64748b"/><text x="54" y="270.0" font-size="12" fill="#0f172a">没有可用条目时</text><text x="54" y="288.0" font-size="12" fill="#0f172a">该段为空列表</text><text x="54" y="306.0" font-size="12" fill="#0f172a">渲染结果稳定</text><circle cx="40" cy="96" r="10" fill="#2563eb"/><text x="40" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text><circle cx="340" cy="96" r="10" fill="#2563eb"/><text x="340" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text><circle cx="640" cy="96" r="10" fill="#2563eb"/><text x="640" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">9</text><circle cx="640" cy="250" r="10" fill="#2563eb"/><text x="640" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">10</text><circle cx="340" cy="250" r="10" fill="#2563eb"/><text x="340" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">11</text><rect x="40" y="450" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="65" y="461" font-size="12" fill="#475569">控制层步骤</text></svg>
