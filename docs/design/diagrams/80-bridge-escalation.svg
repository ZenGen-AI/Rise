<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">桥接失败的分类与升级</title><desc id="d">子进程超时、非零退出、空输出是 T1,退避重试耗尽后抛 BridgeError T1;启动阶段的 OSError 是 T2,立即抛。调用方处理器见到任何 BridgeError 都升级为 T3:产物置 failed、写失败记录、等人处理。调用方自身的非桥接瞬态异常原样上抛,产物保持 pending;缺凭证在装配时失败。 节点;- 子进程失败:超时 · 非零退出 · 空输出;- 子进程起不来:启动阶段的任何 OSError;- BridgeError T1:退避重试已耗尽;- BridgeError T2:确定性,不重试;- 调用方自身的瞬态异常:OSError 等,非桥接;- 缺凭证:token_env 指向的变量为空;- 规划或轮次处理器:按 R18 收口;- T3:产物置 failed / record_failure 留痕 / 等人处理;- 保持 pending:产物不变 / 下一轮 tick 重来;- 装配失败:MissingCredentialError / factory 抛 FactoryConfigError / 此时才有退出码 2,不写树;连线;- 子进程失败 → BridgeError T1:重试耗尽;- 子进程起不来 → BridgeError T2:立即;- BridgeError T1 → 规划或轮次处理器;- BridgeError T2 → 规划或轮次处理器;- 规划或轮次处理器 → T3:任何 BridgeError;- 调用方自身的瞬态异常 → 保持 pending:原样上抛;- 缺凭证 → 装配失败:构造时</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="600" fill="#ffffff"/><rect x="14" y="44" width="520" height="266" rx="12" fill="#7c3aed" fill-opacity="0.05" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#7c3aed">桥接内部</text><rect x="14" y="322" width="520" height="242" rx="12" fill="#64748b" fill-opacity="0.05" stroke="#64748b" stroke-width="1.2"/><text x="28" y="344" text-anchor="start" font-size="13" font-weight="700" fill="#64748b">桥接之外</text><rect x="546" y="44" width="520" height="520" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="560" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">调用方与组合根</text><path d="M250.0,125.0 L296.0,125.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M250.0,255.0 L296.0,255.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M516.0,125.0 L541.0,125.0 Q548.0,125.0 548.0,132.0 L548.0,159.0 Q548.0,166.0 555.0,166.0 L580.0,166.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M516.0,255.0 L541.0,255.0 Q548.0,255.0 548.0,248.0 L548.0,221.0 Q548.0,214.0 555.0,214.0 L580.0,214.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M800.0,190.0 L840.0,190.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M250.0,385.0 L830.0,385.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M250.0,505.0 L830.0,505.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="30" y="90" width="220" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="140.0" y="121.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">子进程失败</text><text x="140.0" y="138.1" text-anchor="middle" font-size="12" fill="#475569">超时 · 非零退出 · 空输出</text><rect x="30" y="220" width="220" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="140.0" y="251.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">子进程起不来</text><text x="140.0" y="268.1" text-anchor="middle" font-size="12" fill="#475569">启动阶段的任何 OSError</text><rect x="296" y="90" width="220" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="406.0" y="121.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">BridgeError T1</text><text x="406.0" y="138.1" text-anchor="middle" font-size="12" fill="#475569">退避重试已耗尽</text><rect x="296" y="220" width="220" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="406.0" y="251.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">BridgeError T2</text><text x="406.0" y="268.1" text-anchor="middle" font-size="12" fill="#475569">确定性,不重试</text><rect x="30" y="350" width="220" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="140.0" y="381.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">调用方自身的瞬态异常</text><text x="140.0" y="398.1" text-anchor="middle" font-size="12" fill="#475569">OSError 等,非桥接</text><rect x="30" y="470" width="220" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="140.0" y="501.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">缺凭证</text><text x="140.0" y="518.0" text-anchor="middle" font-size="12" fill="#475569">token_env 指向的变量为空</text><polygon points="596.0,130.0 784.0,130.0 800.0,190.0 784.0,250.0 596.0,250.0 580.0,190.0" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="690.0" y="186.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">规划或轮次处理器</text><text x="690.0" y="203.1" text-anchor="middle" font-size="12" fill="#475569">按 R18 收口</text><rect x="840" y="150" width="210" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="945.0" y="168.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">T3</text><text x="945.0" y="185.7" text-anchor="middle" font-size="12" fill="#475569">产物置 failed</text><text x="945.0" y="203.1" text-anchor="middle" font-size="12" fill="#475569">record_failure 留痕</text><text x="945.0" y="220.4" text-anchor="middle" font-size="12" fill="#475569">等人处理</text><rect x="830" y="350" width="230" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="945.0" y="372.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">保持 pending</text><text x="945.0" y="389.4" text-anchor="middle" font-size="12" fill="#475569">产物不变</text><text x="945.0" y="406.8" text-anchor="middle" font-size="12" fill="#475569">下一轮 tick 重来</text><rect x="830" y="462" width="230" height="86" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="945.0" y="483.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">装配失败</text><text x="945.0" y="500.6" text-anchor="middle" font-size="12" fill="#475569">MissingCredentialError</text><text x="945.0" y="518.0" text-anchor="middle" font-size="12" fill="#475569">factory 抛 FactoryConfigError</text><text x="945.0" y="535.4" text-anchor="middle" font-size="12" fill="#475569">此时才有退出码 2,不写树</text><rect x="245.0" y="115.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="273.0" y="129.3" text-anchor="middle" font-size="12" fill="#475569">重试耗尽</text><rect x="257.0" y="245.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="273.0" y="259.3" text-anchor="middle" font-size="12" fill="#475569">立即</text><rect x="764.4" y="180.6" width="111.2" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="820.0" y="194.3" text-anchor="middle" font-size="12" fill="#475569">任何 BridgeError</text><rect x="512.0" y="375.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="540.0" y="389.3" text-anchor="middle" font-size="12" fill="#475569">原样上抛</text><rect x="518.0" y="495.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="540.0" y="509.3" text-anchor="middle" font-size="12" fill="#475569">构造时</text><rect x="40" y="575" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="65" y="586" font-size="12" fill="#475569">失败产出</text><rect x="135.0" y="575" width="18" height="13" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="160.0" y="586" font-size="12" fill="#475569">失败来源 / 中性结果</text><rect x="290.0" y="575" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="315.0" y="586" font-size="12" fill="#475569">调用方</text></svg>
