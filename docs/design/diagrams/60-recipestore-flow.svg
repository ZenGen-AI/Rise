<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">提名到入库到战绩回写</title><desc id="d">来源 run 晋级后提名器写配方候选,门③批准后收录处理器写入 recipes/;之后某个 run 复用该配方,走完门①后战绩处理器追加战绩条目,最近一条退化就废弃配方。 节点;- 提名:TrainScheduler 提名器 / compute_gain · 校验 / 写候选与 repro;- 门③ 人工审核:review 看 repro / approve / reject;- 收录处理器:写 recipe · lineage / 写空 track_record / 候选置 effective;- recipes/recipe-&lt;run&gt;/:配方 effective;- 规划选中配方:find_recipes 排序 / 指令带 recipe_ref;- 训练 · 诊断 · 门①:候选到 effective / 或 rejected;- 战绩处理器:compute_gain · 退化标记 / 追加条目 · verdict;- 写战绩标记:runs/&lt;run&gt;/recipe_track.yaml / 必要时 deprecate;连线;- 提名 → 门③ 人工审核;- 门③ 人工审核 → 收录处理器:approve;- 收录处理器 → recipes/recipe-&lt;run&gt;/;- recipes/recipe-&lt;run&gt;/ → 规划选中配方:可被检索(虚线);- 规划选中配方 → 训练 · 诊断 · 门①;- 训练 · 诊断 · 门① → 战绩处理器;- 战绩处理器 → 写战绩标记;- 写战绩标记 → recipes/recipe-&lt;run&gt;/:条目 · 废弃</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1080" height="600" fill="#ffffff"/><rect x="14" y="44" width="1052" height="230" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">入库:来源 run</text><rect x="14" y="296" width="1052" height="230" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="318" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">复用:后续 run</text><path d="M260.0,152.0 L300.0,152.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M500.0,152.0 L540.0,152.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M780.0,152.0 L820.0,152.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M930.0,194.0 L930.0,293.0 Q930.0,300.0 923.0,300.0 L157.0,300.0 Q150.0,300.0 150.0,307.0 L150.0,362.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ah0)"/><path d="M260.0,404.0 L300.0,404.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M500.0,404.0 L540.0,404.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M780.0,404.0 L820.0,404.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M1007.0,362.0 L1007.0,194.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="40" y="110" width="220" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="150.0" y="130.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">提名</text><text x="150.0" y="147.7" text-anchor="middle" font-size="12" fill="#475569">TrainScheduler 提名器</text><text x="150.0" y="165.1" text-anchor="middle" font-size="12" fill="#475569">compute_gain · 校验</text><text x="150.0" y="182.4" text-anchor="middle" font-size="12" fill="#475569">写候选与 repro</text><polygon points="316.0,110.0 484.0,110.0 500.0,152.0 484.0,194.0 316.0,194.0 300.0,152.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="400.0" y="139.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">门③ 人工审核</text><text x="400.0" y="156.3" text-anchor="middle" font-size="12" fill="#475569">review 看 repro</text><text x="400.0" y="173.8" text-anchor="middle" font-size="12" fill="#475569">approve / reject</text><rect x="540" y="110" width="240" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="660.0" y="130.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">收录处理器</text><text x="660.0" y="147.7" text-anchor="middle" font-size="12" fill="#475569">写 recipe · lineage</text><text x="660.0" y="165.1" text-anchor="middle" font-size="12" fill="#475569">写空 track_record</text><text x="660.0" y="182.4" text-anchor="middle" font-size="12" fill="#475569">候选置 effective</text><path d="M820,119 a110.0,9 0 0 1 220,0 v66 a110.0,9 0 0 1 -220,0 z" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><ellipse cx="930.0" cy="119" rx="110.0" ry="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="930.0" y="157.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">recipes/recipe-&lt;run&gt;/</text><text x="930.0" y="174.1" text-anchor="middle" font-size="12" fill="#475569">配方 effective</text><rect x="40" y="362" width="220" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="150.0" y="391.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">规划选中配方</text><text x="150.0" y="408.4" text-anchor="middle" font-size="12" fill="#475569">find_recipes 排序</text><text x="150.0" y="425.8" text-anchor="middle" font-size="12" fill="#475569">指令带 recipe_ref</text><rect x="300" y="362" width="200" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="400.0" y="391.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">训练 · 诊断 · 门①</text><text x="400.0" y="408.4" text-anchor="middle" font-size="12" fill="#475569">候选到 effective</text><text x="400.0" y="425.8" text-anchor="middle" font-size="12" fill="#475569">或 rejected</text><rect x="540" y="362" width="240" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="660.0" y="391.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">战绩处理器</text><text x="660.0" y="408.4" text-anchor="middle" font-size="12" fill="#475569">compute_gain · 退化标记</text><text x="660.0" y="425.8" text-anchor="middle" font-size="12" fill="#475569">追加条目 · verdict</text><rect x="820" y="362" width="220" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="930.0" y="391.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">写战绩标记</text><text x="930.0" y="408.4" text-anchor="middle" font-size="12" fill="#475569">runs/&lt;run&gt;/recipe_track.yaml</text><text x="930.0" y="425.8" text-anchor="middle" font-size="12" fill="#475569">必要时 deprecate</text><circle cx="40" cy="110" r="10" fill="#2563eb"/><text x="40" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text><circle cx="316" cy="110" r="10" fill="#2563eb"/><text x="316" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text><circle cx="540" cy="110" r="10" fill="#2563eb"/><text x="540" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text><circle cx="40" cy="362" r="10" fill="#2563eb"/><text x="40" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text><circle cx="300" cy="362" r="10" fill="#2563eb"/><text x="300" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text><circle cx="540" cy="362" r="10" fill="#2563eb"/><text x="540" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text><circle cx="820" cy="362" r="10" fill="#2563eb"/><text x="820" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text><rect x="492.1" y="142.6" width="55.9" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="520.0" y="156.3" text-anchor="middle" font-size="12" fill="#475569">approve</text><rect x="534.0" y="290.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="562.0" y="304.3" text-anchor="middle" font-size="12" fill="#475569">可被检索</text><rect x="969.5" y="293.8" width="75.1" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="1007.0" y="307.5" text-anchor="middle" font-size="12" fill="#475569">条目 · 废弃</text><rect x="40" y="550" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="65" y="561" font-size="12" fill="#475569">控制层动作</text><rect x="147.0" y="550" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="172.0" y="561" font-size="12" fill="#475569">计算层与门①</text><rect x="260.96000000000004" y="550" width="18" height="13" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="285.96000000000004" y="561" font-size="12" fill="#475569">门③</text><rect x="326.9200000000001" y="550" width="18" height="13" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="351.9200000000001" y="561" font-size="12" fill="#475569">产物</text><rect x="397.9200000000001" y="550" width="18" height="13" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="422.9200000000001" y="561" font-size="12" fill="#475569">虚线 = 只可被检索,不主动触发</text></svg>
