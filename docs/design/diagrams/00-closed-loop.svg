<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="1080" height="700" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">一轮迭代的闭环</title><desc id="d">主链路从写入训练指令开始,经训练、诊断评测、人工审核门①晋级为新基座。晋级之后三条支线并行:规划下一轮并回到起点,提名配方经门③入库,MindAgent 自进化经门②入库。 节点;- 写入训练指令:人工或调度器写入 / directive;- 派发并训练:缺清单时先合成数据 / SFT → GRPO + OPD;- 候选 checkpoint:pending_review / 等待诊断与审核;- 诊断评测:DiagnosticReport / 编排器 run_diagnostic;- 门①人工审核:approve / reject / 需要诊断报告在场;- 晋级 zengen-vN:候选 → effective / 新基座 = 最新 effective 版本;- 规划下一轮:装配上下文 · 决策 / 写入下一条 directive;- 提名配方:增益达标且无退化标记 / 写入 recipe_candidate;- MindAgent 轮次:部署模拟 · 经验分析 / 技能提案 · 离线验证;- 门③ 配方入库:需要可复现性校验报告;- RecipeStore 收录:recipe · lineage · track_record;- 门② 技能记忆纳入:需要验证结果在场;- 正式技能库与记忆库:library_state 版本递增;连线;- 写入训练指令 → 派发并训练;- 派发并训练 → 候选 checkpoint;- 候选 checkpoint → 诊断评测;- 诊断评测 → 门①人工审核;- 门①人工审核 → 晋级 zengen-vN;- 晋级 zengen-vN → 规划下一轮;- 晋级 zengen-vN → 提名配方;- 晋级 zengen-vN → MindAgent 轮次;- 规划下一轮 → 写入训练指令:下一轮;- 提名配方 → 门③ 配方入库;- 门③ 配方入库 → RecipeStore 收录;- MindAgent 轮次 → 门② 技能记忆纳入;- 门② 技能记忆纳入 → 正式技能库与记忆库</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="700" fill="#ffffff"/><rect x="14" y="44" width="1052" height="140" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">主链路:每一轮都走</text><rect x="14" y="330" width="1052" height="310" rx="12" fill="#64748b" fill-opacity="0.05" stroke="#64748b" stroke-width="1.2"/><text x="28" y="352" text-anchor="start" font-size="13" font-weight="700" fill="#64748b">晋级之后并行的三条支线</text><path d="M200.0,128.0 L238.0,128.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M414.0,128.0 L452.0,128.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M628.0,128.0 L666.0,128.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M842.0,128.0 L880.0,128.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M968.0,170.0 L968.0,194.0 Q968.0,201.0 961.0,201.0 L547.0,201.0 Q540.0,201.0 540.0,208.0 L540.0,232.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M415.0,267.0 L222.0,267.0 Q215.0,267.0 215.0,274.0 L215.0,384.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,302.0 L540.0,384.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M665.0,267.0 L908.0,267.0 Q915.0,267.0 915.0,274.0 L915.0,384.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M65.0,384.0 L65.0,170.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,460.0 L540.0,486.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,546.0 L540.0,572.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M915.0,460.0 L915.0,486.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M915.0,546.0 L915.0,572.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="24" y="86" width="176" height="84" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="112.0" y="115.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">写入训练指令</text><text x="112.0" y="132.3" text-anchor="middle" font-size="12" fill="#475569">人工或调度器写入</text><text x="112.0" y="149.8" text-anchor="middle" font-size="12" fill="#475569">directive</text><rect x="238" y="86" width="176" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="326.0" y="115.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">派发并训练</text><text x="326.0" y="132.3" text-anchor="middle" font-size="12" fill="#475569">缺清单时先合成数据</text><text x="326.0" y="149.8" text-anchor="middle" font-size="12" fill="#475569">SFT → GRPO + OPD</text><rect x="452" y="86" width="176" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="540.0" y="115.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">候选 checkpoint</text><text x="540.0" y="132.3" text-anchor="middle" font-size="12" fill="#475569">pending_review</text><text x="540.0" y="149.8" text-anchor="middle" font-size="12" fill="#475569">等待诊断与审核</text><rect x="666" y="86" width="176" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="754.0" y="115.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">诊断评测</text><text x="754.0" y="132.3" text-anchor="middle" font-size="12" fill="#475569">DiagnosticReport</text><text x="754.0" y="149.8" text-anchor="middle" font-size="12" fill="#475569">编排器 run_diagnostic</text><polygon points="896.0,86.0 1040.0,86.0 1056.0,128.0 1040.0,170.0 896.0,170.0 880.0,128.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="968.0" y="115.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">门①人工审核</text><text x="968.0" y="132.3" text-anchor="middle" font-size="12" fill="#475569">approve / reject</text><text x="968.0" y="149.8" text-anchor="middle" font-size="12" fill="#475569">需要诊断报告在场</text><rect x="415" y="232" width="250" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="254.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">晋级 zengen-vN</text><text x="540.0" y="271.4" text-anchor="middle" font-size="12" fill="#475569">候选 → effective</text><text x="540.0" y="288.8" text-anchor="middle" font-size="12" fill="#475569">新基座 = 最新 effective 版本</text><rect x="40" y="384" width="250" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="165.0" y="409.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">规划下一轮</text><text x="165.0" y="426.4" text-anchor="middle" font-size="12" fill="#475569">装配上下文 · 决策</text><text x="165.0" y="443.8" text-anchor="middle" font-size="12" fill="#475569">写入下一条 directive</text><rect x="415" y="384" width="250" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="409.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">提名配方</text><text x="540.0" y="426.4" text-anchor="middle" font-size="12" fill="#475569">增益达标且无退化标记</text><text x="540.0" y="443.8" text-anchor="middle" font-size="12" fill="#475569">写入 recipe_candidate</text><rect x="790" y="384" width="250" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="915.0" y="409.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MindAgent 轮次</text><text x="915.0" y="426.4" text-anchor="middle" font-size="12" fill="#475569">部署模拟 · 经验分析</text><text x="915.0" y="443.8" text-anchor="middle" font-size="12" fill="#475569">技能提案 · 离线验证</text><polygon points="431.0,486.0 649.0,486.0 665.0,516.0 649.0,546.0 431.0,546.0 415.0,516.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="540.0" y="512.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f17