<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">TrainPlanner 的三段分离</title><desc id="d">planner.plan 串起三段:上下文打包把 PlanningContext 套进版本化模板,决策后端把打包结果变成文本,输出解析把文本严格变成 PlannerDecision。三种后端都返回文本,走同一条解析路径。包外只依赖 controlplane 与 inference_bridge。 节点;- planner.plan:一次渲染 · 多次采样 / 共用重试预算 · 耗尽即失败;- context:PlanningContext 与五种子结构 / 构造即校验 · 严格互逆;- templates:PLANNER_V1 · install_template / load_template;- prompt:render_prompt → PackedContext / 占位符白名单;- BridgeDecisionBackend:packed.prompt 交给桥接;- HeuristicBackend:只读 packed.context / 输出 JSON 文本;- ScriptedDecisionBackend:测试用罐头回答;- decision:parse_decision / DecisionParseError;- PlannerDecision:七个字段 · 冻结;- controlplane:Envelope · GitStore · 路径函数;- inference_bridge:InferenceBridge · BridgeError;连线;- planner.plan → prompt:渲染;- planner.plan → BridgeDecisionBackend:decide;- planner.plan → decision:解析;- context → prompt:上下文;- templates → prompt:模板文本;- decision → PlannerDecision:合格才构造;- BridgeDecisionBackend → inference_bridge;- templates → controlplane</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="640" fill="#ffffff"/><rect x="14" y="170" width="344" height="330" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="192" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">① 上下文打包</text><rect x="368" y="170" width="344" height="330" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="382" y="192" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">② 决策后端</text><rect x="722" y="170" width="344" height="330" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="736" y="192" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">③ 输出解析</text><path d="M390.0,94.0 L370.0,94.0 Q363.0,94.0 363.0,101.0 L363.0,463.0 Q363.0,470.0 356.0,470.0 L332.0,470.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,132.0 L540.0,214.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M690.0,94.0 L887.0,94.0 Q894.0,94.0 894.0,101.0 L894.0,214.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M332.0,249.0 L339.0,249.0 Q346.0,249.0 346.0,256.0 L346.0,442.0 Q346.0,449.0 339.0,449.0 L332.0,449.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M186.0,384.0 L186.0,414.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M894.0,284.0 L894.0,314.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M394.0,244.0 L387.0,244.0 Q380.0,244.0 380.0,251.0 L380.0,523.0 Q380.0,530.0 387.0,530.0 L422.0,530.0 Q429.0,530.0 429.0,537.0 L429.0,548.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M40.0,349.0 L33.0,349.0 Q26.0,349.0 26.0,356.0 L26.0,571.0 Q26.0,578.0 33.0,578.0 L40.0,578.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="390" y="56" width="300" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="81.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">planner.plan</text><text x="540.0" y="98.3" text-anchor="middle" font-size="12" fill="#475569">一次渲染 · 多次采样</text><text x="540.0" y="115.8" text-anchor="middle" font-size="12" fill="#475569">共用重试预算 · 耗尽即失败</text><rect x="40" y="214" width="292" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="186.0" y="236.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">context</text><text x="186.0" y="253.3" text-anchor="middle" font-size="12" fill="#475569">PlanningContext 与五种子结构</text><text x="186.0" y="270.8" text-anchor="middle" font-size="12" fill="#475569">构造即校验 · 严格互逆</text><rect x="40" y="314" width="292" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="186.0" y="336.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">templates</text><text x="186.0" y="353.4" text-anchor="middle" font-size="12" fill="#475569">PLANNER_V1 · install_template</text><text x="186.0" y="370.8" text-anchor="middle" font-size="12" fill="#475569">load_template</text><rect x="40" y="414" width="292" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="186.0" y="436.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">prompt</text><text x="186.0" y="453.4" text-anchor="middle" font-size="12" fill="#475569">render_prompt → PackedContext</text><text x="186.0" y="470.8" text-anchor="middle" font-size="12" fill="#475569">占位符白名单</text><rect x="394" y="214" width="292" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="240.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">BridgeDecisionBackend</text><text x="540.0" y="257.1" text-anchor="middle" font-size="12" fill="#475569">packed.prompt 交给桥接</text><rect x="394" y="314" width="292" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="336.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">HeuristicBackend</text><text x="540.0" y="353.4" text-anchor="middle" font-size="12" fill="#475569">只读 packed.context</text><text x="540.0" y="370.8" text-anchor="middle" font-size="12" fill="#475569">输出 JSON 文本</text><rect x="394" y="414" width="292" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="440.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ScriptedDecisionBackend</text><text x="540.0" y="457.1" text-anchor="middle" font-size="12" fill="#475569">测试用罐头回答</text><rect x="748" y="214" width="292" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="894.0" y="236.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">decision</text><text x="894.0" y="253.3" text-anchor="middle" font-size="12" fill="#475569">parse_decision</text><text x="894.0" y="270.8" text-anchor="middle" font-size="12" fill="#475569">DecisionParseError</text><rect x="748" y="314" width="292" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="894.0" y="340.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">PlannerDecision</text><text x="894.0" y="357.1" text-anchor="middle" font-size="12" fill="#475569">七个字段 · 冻结</text><rect x="40" y="548" width="292" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="186.0" y="574.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">controlplane</text><text x="186.0" y="591.0" text-anchor="middle" font-size="12" fill="#475569">Envelope · GitStore · 路径函数</text><rect x="394" y="548" width="292" height="60" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="540.0" y="574.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">inference_bridge</text><text x="540.0" y="591.0" text-anchor="middle" font-size="12" fill="#475569">InferenceBridge · BridgeError</text><rect x="347.0" y="92.3" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="363.0" y="106.0" text-anchor="middle" font-size="12" fill="#475569">渲染</text><rect x="516.7" y="151.3" width="46.5" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="540.0" y="165.0" text-anchor="middle" font-size="12" fill="#475569">decide</text><rect x="836.0" y="84.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="852.0" y="98.3" text-anchor="middle" font-size="12" fill="#475569">解析</text><rect x="324.0" y="339.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="346.0" y="353.3" text-anchor="middle" font-size="12" fill="#475569">上下文</text><rect x="158.0" y="389.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="186.0" y="403.3" text-anchor="middle" font-size="12" fill="#475569">模板文本</text><rect x="860.0" y="289.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="894.0" y="303.3" text-anchor="middle" font-size="12" fill="#475569">合格才构造</text><rect x="720" y="570" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="745" y="581" font-size="12" fill="#475569">控制层包</text><rect x="815.0" y="570" width="18" height="13" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="840.0" y="581" font-size="12" fill="#475569">共享基础设施</text></svg>
