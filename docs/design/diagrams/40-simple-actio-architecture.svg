<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">SimpleActio 的模块组成</title><desc id="d">instance 在顶层编排技能路由、推理经验、记忆端口与轨迹组装。技能与经验共用触发谓词语言,谓词语言从信号注册表取信号,信号与替身记忆共用一处词面切分。记忆端口 memory_port 只定义协议与数据类型;memory 里的 TupleMemory 与 memory_starling 里的 StarlingMemory 是它的两个实现,starling 包只被 memory_starling 导入。箭头指向被导入的模块。errors 与 _check 被各模块导入,不画线。 节点;- instance.py:instantiate · SimpleActioInstance.respond / decide / GuidedBackend · IgnoreGuidance · render_guidance;- skills.py:Skill · route / check_library;- experience.py:ReasoningExperience / activate · select_tier;- memory.py:MemoryEntry · snapshot / TupleMemory 替身;- memory_port.py:MemoryBackend 协议 / MemoryHit · MemoryEvent;- trace.py:build_trace / validate_trace;- triggers.py:五个算子 · 校验 · 求值 / referenced_signals;- signals.py:SignalRegistry / default_registry · 三个内置信号;- memory_starling.py:StarlingMemory 适配器 / 唯一导入 starling;- simulator.datamodel:TurnRecord · Persona / Scenario · 包外的项目模块;- text.py:tokens:ASCII 整词 / 汉字相邻二字切分;- starling:原生 SQLite 记忆库的 Python 包 / 可选 extra memory;连线;- instance.py → skills.py;- instance.py → experience.py;- instance.py → memory.py;- instance.py → memory_port.py;- instance.py → trace.py;- skills.py → triggers.py;- experience.py → triggers.py;- triggers.py → signals.py;- signals.py → simulator.datamodel:TurnRecord;- signals.py → text.py;- memory.py → text.py;- memory.py → memory_port.py;- memory_starling.py → memory_port.py;- memory_starling.py → starling:唯一的第三方导入</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="620" fill="#ffffff"/><path d="M180.0,124.0 L180.0,150.0 Q180.0,157.0 173.0,157.0 L117.0,157.0 Q