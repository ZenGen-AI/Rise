<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">命令地图</title><desc id="d">TypeScript 命令行管门控写命令,直接改产物状态并提交。Python 一侧管调和与只读可观测,只读子命令不提交。两侧只经产物树通信。 节点;- review &lt;id&gt;:按类型打印证据 / 只读;- status:列出待审与待确认 / 只读;- approve &lt;id&gt;:证据不在场就拒绝 / pending_review → approved;- reject &lt;id&gt; [原因]:写 reject_reason / pending_review → rejected;- confirm &lt;directive-id&gt;:awaiting_confirmation → pending;- run:一直跑调和循环 / 退出码 0 或 2;- reconcile --once:跑一轮并打印动作 / 退出码 0 或 2;- install-defaults:显式写默认资产与配置 · run 与 reconcile 从不自动写;- trace · cost · logs &lt;run&gt;:只读 · 不提交 · 缺失时退出码 1(cost 除外);- git 产物树:control-plane/ · 两侧唯一的通信面;连线;- approve &lt;id&gt; → git 产物树:写状态并提交;- confirm &lt;directive-id&gt; → git 产物树;- trace · cost · logs &lt;run&gt; → git 产物树:只读</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="560" fill="#ffffff"/><rect x="14" y="44" width="500" height="450" rx="12" fill="#d97706" fill-opacity="0.05" stroke="#d97706" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#d97706">TypeScript 命令行 rismforge(门控写)</text><rect x="566" y="44" width="500" height="450" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="580" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">Python 入口 factory(调和与只读)</text><path d="M40.0,232.0 L33.0,232.0 Q26.0,232.0 26.0,239.0 L26.0,438.0 Q26.0,445.0 33.0,445.0 L380.0,445.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M422.5,366.0 L422.5,385.2 Q422.5,388.0 425.2,388.0 L425.2,388.0 Q428.0,388.0 428.0,390.8 L428.0,410.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M659.5,356.0 L659.5,379.2 Q659.5,383.0 655.8,383.0 L655.8,383.0 Q652.0,383.0 652.0,386.8 L652.0,410.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="40" y="90" width="210" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="145.0" y="109.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">review &lt;id&gt;</text><text x="145.0" y="126.3" text-anchor="middle" font-size="12" fill="#475569">按类型打印证据</text><text x="145.0" y="143.8" text-anchor="middle" font-size="12" fill="#475569">只读</text><rect x="280" y="90" width="210" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="385.0" y="109.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">status</text><text x="385.0" y="126.3" text-anchor="middle" font-size="12" fill="#475569">列出待审与待确认</text><text x="385.0" y="143.8" text-anchor="middle" font-size="12" fill="#475569">只读</text><rect x="40" y="200" width="210" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="145.0" y="219.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">approve &lt;id&gt;</text><text x="145.0" y="236.3" text-anchor="middle" font-size="12" fill="#475569">证据不在场就拒绝</text><text x="145.0" y="253.8" text-anchor="middle" font-size="12" fill="#475569">pending_review → approved</text><rect x="280" y="200" width="210" height="64" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="385.0" y="219.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">reject &lt;id&gt; [原因]</text><text x="385.0" y="236.3" text-anchor="middle" font-size="12" fill="#475569">写 reject_reason</text><text x="385.0" y="253.8" text-anchor="middle" font-