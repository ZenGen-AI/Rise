oke-width="1.5"/><ellipse cx="540.0" cy="419" rx="160.0" ry="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="540.0" y="450.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">git 产物树</text><text x="540.0" y="467.1" text-anchor="middle" font-size="12" fill="#475569">control-plane/ · 两侧唯一的通信面</text><rect x="49.5" y="435.6" width="80.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="89.5" y="449.3" text-anchor="middle" font-size="12" fill="#475569">写状态并提交</text><rect x="639.8" y="373.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="655.75" y="387.3" text-anchor="middle" font-size="12" fill="#475569">只读</text><rect x="40" y="530" width="18" height="13" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="65" y="541" font-size="12" fill="#475569">门控写命令</text><rect x="147.0" y="530" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="172.0" y="541" font-size="12" fill="#475569">调和与只读</text><rect x="254.0" y="530" width="18" height="13" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="279.0" y="541" font-size="12" fill="#475569">存储</text></svg>
