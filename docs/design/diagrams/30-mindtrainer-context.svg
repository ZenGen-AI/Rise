<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">MindTrainer 的上下文</title><desc id="d">调和循环把 pending 的训练指令交给 MindTrainer 派发器。MindTrainer 从产物树读数据集清单,InteractTrain 经受限直连①向实时环境服务要 rollout,训练由执行器协议完成,结果以训练记录与候选 checkpoint 写回产物树。 节点;- 指令作者:人工写入 directive / 或由 TrainScheduler 写入;- 产物树 control-plane/:directive · dataset_manifest / training_run · candidate_checkpoint;- ControlPlane 调和循环:dispatch_directive 动作 / 可注入的派发器 Dispatcher;- 批量数据集:SocialSimulator 生产 / 清单带 sha256;- MindTrainer:派发器 · 编排器 / 轨迹源 · 奖励 · 执行器;- 实时环境服务:SocialSimulator · gRPC 双向流 / 一条流一次会话;- ROLL · vLLM:训练执行器的后端 / 分布式训练 · 推理引擎;- DataProducer:缺清单时先合成数据 / 由组合根注入;连线;- 指令作者 → 产物树 control-plane/:写 directive;- ControlPlane 调和循环 ↔ 产物树 control-plane/:扫描 / 回写状态;- ControlPlane 调和循环 → MindTrainer:派发 pending 指令;- MindTrainer ↔ 产物树 control-plane/:读清单 · 写记录与候选;- 批量数据集 → 产物树 control-plane/:写清单与 episode;- MindTrainer ↔ 实时环境服务:① rollout 会话;- MindTrainer → ROLL · vLLM:TrainingExecutor 协议;- MindTrainer → DataProducer:produce</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1080" height="640" fill="#ffffff"/><rect x="14" y="44" width="1052" height="156" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">控制层与协调层(本地开发机)</text><rect x="14" y="226" width="1052" height="372" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text 