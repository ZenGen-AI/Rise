<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">桥接组件与横切记账</title><desc id="d">inference_bridge 由公共类型、命令行桥接、测试替身三个模块组成,只向 controlplane 一个方向依赖。controlplane 里的配置模块管凭证与脱敏,记账模块写成本与失败,观测模块只读,三者都经 GitStore 读写信封。 节点;- scripted.py:ScriptedBridge / ScriptExhaustedError;- base.py:BridgeResult · BridgeError / InferenceBridge · 记账函数;- cli.py:CliBridge · RunOutcome / Runner · subprocess_runner;- 外部命令行:子进程 / 提示词走标准输入;- 日志文件:&lt;run&gt;/&lt;task&gt;-&lt;k&gt;.log;- observe.py:trace · cost / 只读;- ledger.py:record_cost / record_failure;- config.py:BackendConfig · 凭证解析 · 脱敏 / 配置信封读写;- envelope.py · gitstore.py:Envelope · BigRef · GitStore:读写信封并提交;连线;- scripted.py → base.py:共用;- cli.py → base.py:共用;- base.py → ledger.py:record_cost;- cli.py → config.py:解析凭证 · 脱敏;- cli.py → 外部命令行:argv;- cli.py → 日志文件:写;- observe.py → envelope.py · gitstore.py:只读;- ledger.py → envelope.py · gitstore.py:写信封;- config.py → envelope.py · gitstore.py:读写配置</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="600" fill="#ffffff"/><rect x="14" y="44" width="850" height="160" rx="12" fill="#7c3aed" fill-opacity="0.05" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#7c3aed">inference_bridge 包</text><rect x="14" y="222" width="850" height="340" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="244" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">controlplane 包</text><rect x="876" y="44" width="190" height="518" rx="12" fill="#64748b" fill-opacity="0.05" stroke="#64748b" stroke-wid