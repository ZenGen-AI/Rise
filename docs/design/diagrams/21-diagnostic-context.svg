<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">诊断评测的上下文</title><desc id="d">ControlPlane 在候选待审时请求诊断,由注入的评估器调用诊断评测并写报告。诊断评测调 SoMEval 运行器与 judge 后端,动态轨复用 SocialSimulator 的运行器。报告写进产物树,由审核门①、规划与配方增益读取。 节点;- TrainScheduler:装配规划上下文;- RecipeStore:增益与战绩;- 审核门①:review 打印报告 / approve 要求报告在场;- ControlPlane:调和循环 · request_diagnostic;- 产物树:runs/&lt;run&gt;/diagnostic_report.yaml;- SocialSimulator 运行器:run_episode · 多轮驱动;- 诊断评测:src/diagnostic / 双轨评测 · 聚合 · 退化判定;- 情境生成器:训练情境批量生成;- SoMEval 运行器:SoMEvalRunner 协议;- judge 后端:JudgeBackend 协议;连线;- 产物树 → TrainScheduler:读分数与退化;- 产物树 → RecipeStore:读 L1 分;- 产物树 → 审核门①:读报告;- ControlPlane → 诊断评测:request_diagnostic;- 诊断评测 → 产物树:写报告;- 诊断评测 → SocialSimulator 运行器:动态轨;- 情境生成器 → 诊断评测:隔离校验;- 诊断评测 → SoMEval 运行器:静态轨;- 诊断评测 → judge 后端:judge 打分</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="720" fill="#ffffff"/><rect x="14" y="44" width="1052" height="128" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">控制层</text><rect x="14" y="196" width="1052" height="124" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="218" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">协调层</text><rect x="14" y="344" width="1052" height="160" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="1052" y="366" text-anchor="end" font-size="13" font-weight="700" fill="#16a34a">计算层</text><rect x="14" y="528" width="1052" height="140" rx="12" fill="#7c3aed" fil