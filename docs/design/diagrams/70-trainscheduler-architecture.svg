<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 690" width="1080" height="690" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">TrainScheduler 的模块</title><desc id="d">两个处理器是对外入口。规划处理器串起 run id 分配、上下文装配、动作解析与指令构造;提名处理器只经 recipes_port 用 RecipeStore。对 RecipeStore 的导入全部集中在 recipes_port,对 MindTrainer 只用 training_config 与 data_spec 两个模块。 节点;- nominate:提名判定 · 配方候选 / make_nominate_handler;- plan_handler:make_plan_handler / 写入顺序与三条重入规则;- trainplanner:plan · PlanningContext / PlannerDecision;- run_ids:分配 run-NNN;- assemble:装配上下文;- resolve:校验与解析;- directive:构造指令;- mindtrainer:training_config / data_spec;- recipes_port:对 RecipeStore 的全部导入;- config:两份配置的严格解析;- errors:SchedulerError 家族;- recipestore:gain · ids · library · validate;连线;- plan_handler → trainplanner:调用;- plan_handler → run_ids;- plan_handler → assemble;- plan_handler → resolve;- plan_handler → directive;- directive → mindtrainer:校验;- assemble → recipes_port;- resolve → recipes_port;- nominate → recipes_port;- recipes_port → recipestore:唯一导入口</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="690" fill="#ffffff"/><rect x="20" y="44" width="780" height="470" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="34" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">src/trainscheduler</text><path d="M740.0,131.0 L820.0,131.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M390.0,166.0 L390.0,193.0 Q390.0,200.0 383.0,200.0 L272.0,200.0 Q265.0,200.0 265.0,207.0 L265.0,250.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M415.0,166.0 L415.0,250.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M565.0,166.0 L565.0,250.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M715.0,166.0 L715.0,250.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M780.0,280.0 L809.0,280.0 Q810.0,280.0 810.0,281.0 L810.0,281.0 Q810.0,282.0 811.0,282.0 L840.0,282.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M415.0,310.0 L415.0,353.0 Q415.0,360.0 408.0,360.0 L207.0,360.0 Q200.0,360.0 200.0,367.0 L200.0,410.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M565.0,310.0 L565.0,373.0 Q565.0,380.0 558.0,380.0 L237.0,380.0 Q230.0,380.0 230.0,387.0 L230.0,410.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M70.0,166.0 L70.0,410.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M150.0,470.0 L150.0,560.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="40" y="96" width="250" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="165.0" y="118.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">nominate</text><text x="165.0" y="135.3" text-anchor="middle" font-size="12" fill="#475569">提名判定 · 配方候选</text><text x="165.0" y="152.8" text-anchor="middle" font-size="12" fill="#475569">make_nominate_handler</text><rect x="380" y="96" width="360" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="560.0" y="118.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">plan_handler</text><text x="560.0" y="135.3" text-anchor="middle" font-size="12" fill="#475569">make_plan_handler</text><text x="560.0" y="152.8" text-anchor="middle" font-size="12" fill="#475569">写入顺序与三条重入规则</text><rect x="820" y="96" width="220" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="118.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">trainplanner</text><text x="930.0" y="135.3" text-anchor="middle" font-size="12" fill="#475569">plan · PlanningContext</text><text x="930.0" y="152.8" text-anchor="middle" font-size="12" fill="#475569">PlannerDecision</text><rect x="200" y="250" width="130" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="265.0" y="276.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">run_ids</text><text x="265.0" y="293.1" text-anchor="middle" font-size="12" fill="#475569">分配 run-NNN</text><rect x="350" y="250" width="130" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="415.0" y="276.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">assemble</text><text x="415.0" y="293.1" text-anchor="middle" font-size="12" fill="#475569">装配上下文</text><rect x="500" y="250" width="130" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="565.0" y="276.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">resolve</text><text x="565.0" y="293.1" text-anchor="middle" font-size="12" fill="#475569">校验与解析</text><rect x="650" y="250" width="130" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="715.0" y="276.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">directive</text><text x="715.0" y="293.1" text-anchor="middle" font-size="12" fill="#475569">构造指令</text><rect x="840" y="250" width="200" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="940.0" y="269.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">mindtrainer</text><text x="940.0" y="286.4" text-anchor="middle" font-size="12" fill="#475569">training_config</text><text x="940.0" y="303.8" text-anchor="middle" font-size="12" fill="#475569">data_spec</text><rect x="40" y="410" width="220" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="150.0" y="436.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">recipes_port</text><text x="150.0" y="453.1" text-anchor="middle" font-size="12" fill="#475569">对 RecipeStore 的全部导入</text><rect x="300" y="410" width="180" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="390.0" y="436.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">config</text><text x="390.0" y="453.1" text-anchor="middle" font-size="12" fill="#475569">两份配置的严格解析</text><rect x="520" y="410" width="180" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="610.0" y="436.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">errors</text><text x="610.0" y="453.1" text-anchor="middle" font-size="12" fill="#475569">SchedulerError 家族</text><rect x="40" y="560" width="220" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="150.0" y="586.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">recipestore</text><text x="150.0" y="603.0" text-anchor="middle" font-size="12" fill="#475569">gain · ids · library · validate</text><rect x="300" y="548" width="470" height="52.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="300" y="548" width="4" height="52.0" rx="2" fill="#64748b"/><text x="314" y="568.0" font-size="12" fill="#0f172a">每个模块都可导入 controlplane、config 与 errors,连线从略</text><text x="314" y="586.0" font-size="12" fill="#0f172a">assemble、resolve、directive、config 都用 mindtrainer 的两个模块</text><rect x="764.0" y="121.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="780.0" y="135.3" text-anchor="middle" font-size="12" fill="#475569">调用</text><rect x="794.0" y="271.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="810.0" y="285.3" text-anchor="middle" font-size="12" fill="#475569">校验</text><rect x="116.0" y="505.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="150.0" y="519.3" text-anchor="middle" font-size="12" fill="#475569">唯一导入口</text><rect x="40" y="660" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="65" y="671" font-size="12" fill="#475569">本包模块</text><rect x="135.0" y="660" width="18" height="13" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4"/><text x="160.0" y="671" font-size="12" fill="#475569">控制层邻居包</text><rect x="254.0" y="660" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="279.0" y="671" font-size="12" fill="#475569">计算层邻居包</text></svg>
