<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 770" width="1080" height="770" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">SocialSimulator 仿真部分的组件</title><desc id="d">三层组件。共享核心是数据模型、后端协议与纯函数运行器。批量模块按需运行,生成情境与人格、产出数据集与清单并落盘;实时模块是由调用方启动的 gRPC 服务端,驱动器在后台线程调用同一个运行器。客户端运行在调用方进程。 节点;- 情境与人格生成:generators.py / generate_* · load_*;- 数据集与清单:dataset.py / produce_grouped_dataset;- 存储适配:store_adapter.py / write_* · read_*;- 后端协议:backends.py / ModelBackend · GenerationBackend;- 仿真运行器:runner.py / run_episode;- 数据模型:datamodel.py / Persona · Scenario · Episode;- 实时后端:ClientDrivenBackend / TimeoutBackend;- 会话驱动器:driver.py · SessionDriver / 后台线程 · outbox 队列;- 会话状态机:session.py / assert_transition;- 客户端:client.py / EnvironmentServiceClient;- 服务端:servicer.py · server.py / EnvironmentServicer;- 校验与编解码:validation.py · codec.py / realtime_env.proto;连线;- 情境与人格生成 → 后端协议:GenerationBackend;- 数据集与清单 → 仿真运行器:每条 rollout 调一次;- 数据集与清单 → 存储适配:落盘与读回;- 仿真运行器 → 后端协议:respond;- 会话驱动器 → 仿真运行器:同一个 run_episode;- 会话驱动器 → 实时后端:客户端位 · 对手位;- 会话驱动器 → 会话状态机:状态迁移;- 实时后端 → 后端协议:实现 ModelBackend;- 服务端 → 会话驱动器:启动 · 转发提交;- 服务端 → 校验与编解码:先校验再启动;- 客户端 ↔ 服务端:gRPC 双向流(接口①②)</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1080" height="770" fill="#ffffff"/><rect x="14" y="44" width="1052" height="150" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">批量模块:按需调用,跑完即止</text><rect x="14" y="216" width="1052" height="150" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="238" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">共享核心:无 IO 的纯函数与协议</text><rect x="14" y="388" width="1052" height="330" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="410" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">实时模块:gRPC 服务端,由调用方启动(客户端除外)</text><path d="M180.0,170.0 L180.0,264.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,170.0 L540.0,264.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M680.0,131.0 L760.0,131.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M400.0,303.0 L320.0,303.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,436.0 L540.0,342.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M400.0,475.0 L320.0,475.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M680.0,475.0 L760.0,475.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M180.0,436.0 L180.0,342.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,604.0 L540.0,514.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M680.0,643.0 L760.0,643.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M240.0,643.0 L400.0,643.0" fill="none" stroke="#d97706" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)" marker-start="url(#ah1)"/><rect x="40" y="92" width="280" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="180.0" y="118.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">情境与人格生成</text><text x="180.0" y="135.3" text-anchor="middle" font-size="12" fill="#475569">generators.py</text><text x="180.0" y="152.8" text-anchor="middle" font-size="12" fill="#475569">generate_* · load_*</text><rect x="400" y="92" width="280" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="540.0" y="118.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">数据集与清单</text><text x="540.0" y="135.3" text-anchor="middle" font-size="12" fill="#475569">dataset.py</text><text x="540.0" y="152.8" text-anchor="middle" font-size="12" fill="#475569">produce_grouped_dataset</text><rect x="760" y="92" width="280" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="900.0" y="118.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">存储适配</text><text x="900.0" y="135.3" text-anchor="middle" font-size="12" fill="#475569">store_adapter.py</text><text x="900.0" y="152.8" text-anchor="middle" font-size="12" fill="#475569">write_* · read_*</text><rect x="40" y="264" width="280" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="180.0" y="290.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">后端协议</text><text x="180.0" y="307.4" text-anchor="middle" font-size="12" fill="#475569">backends.py</text><text x="180.0" y="324.8" text-anchor="middle" font-size="12" fill="#475569">ModelBackend · GenerationBackend</text><rect x="400" y="264" width="280" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="540.0" y="290.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">仿真运行器</text><text x="540.0" y="307.4" text-anchor="middle" font-size="12" fill="#475569">runner.py</text><text x="540.0" y="324.8" text-anchor="middle" font-size="12" fill="#475569">run_episode</text><rect x="760" y="264" width="280" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="900.0" y="290.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">数据模型</text><text x="900.0" y="307.4" text-anchor="middle" font-size="12" fill="#475569">datamodel.py</text><text x="900.0" y="324.8" text-anchor="middle" font-size="12" fill="#475569">Persona · Scenario · Episode</text><rect x="40" y="436" width="280" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="180.0" y="462.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">实时后端</text><text x="180.0" y="479.4" text-anchor="middle" font-size="12" fill="#475569">ClientDrivenBackend</text><text x="180.0" y="496.8" text-anchor="middle" font-size="12" fill="#475569">TimeoutBackend</text><rect x="400" y="436" width="280" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="540.0" y="462.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">会话驱动器</text><text x="540.0" y="479.4" text-anchor="middle" font-size="12" fill="#475569">driver.py · SessionDriver</text><text x="540.0" y="496.8" text-anchor="middle" font-size="12" fill="#475569">后台线程 · outbox 队列</text><rect x="760" y="436" width="280" height="78" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="900.0" y="462.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">会话状态机</text><text x="900.0" y="479.4" text-anchor="middle" font-size="12" fill="#475569">session.py</text><text x="900.0" y="496.8" text-anchor="middle" font-size="12" fill="#475569">assert_transition</text><rect x="40" y="604" width="200" height="78" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="14