<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 470" width="1080" height="470" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">调度器产物的状态</title><desc id="d">规划决策从 pending 走到 executed 或 failed,规划前就失败时直接以 failed 写出。调度器写的指令按 confirm_directives 取初始状态。配方候选以 pending_review 写出,之后由人与 RecipeStore 推进。 节点;- 尚无决策;- 决策 pending;- executed;- failed;- awaiting_confirmation;- 指令 pending;- pending_review;- approved;- effective;连线;- 尚无决策 → 决策 pending:写下 next_run_id;- 决策 pending → executed:指令已写;- 决策 pending → failed:确定性失败;- 尚无决策 → failed:规划前失败;- awaiting_confirmation → 指令 pending:人工 confirm;- pending_review → approved:门③ approve;- approved → effective:RecipeStore 收录</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1080" height="470" fill="#ffffff"/><rect x="14" y="44" width="400" height="380" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">planner_decision</text><rect x="434" y="44" width="300" height="380" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="448" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">调度器写的 directive</text><rect x="754" y="44" width="312" height="380" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="768" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">recipe_candidate</text><path d="M120.0,136.0 L120.0,206.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M120.0,246.0 L120.0,316.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M200.0,226.0 L308.0,226.0 Q315.0,226.0 315.0,233.0 L315.0,316.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M200.0,116.0 L345.5,116.0 Q352.5,116.0 352.5,123.0 L352.5,316.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M585.0,136.0 L585.0,236.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M880.0,136.0 L880.0,206.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M880.0,246.0 L880.0,316.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="40" y="96" width="160" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="120.0" y="120.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">尚无决策</text><rect x="40" y="206" width="160" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="120.0" y="230.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">pending</text><rect x="40" y="316" width="160" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="120.0" y="340.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">executed</text><rect x="240" y="316" width="150" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="315.0" y="340.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">failed</text><rect x="460" y="96" width="250" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="585.0" y="120.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">awaiting_confirmation</text><rect x="460" y="236" width="250" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="585.0" y="260.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">pending</text><rect x="460" y="316" width="250" height="70.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="460" y="316" width="4" height="70.0" rx="2" fill="#64748b"/><text x="474" y="336.0" font-size="12" fill="#0f172a">confirm_directives 为真:</text><text x="474" y="354.0" font-size="12" fill="#0f172a">写成 awaiting_confirmation</text><text x="474" y="372.0" font-size="12" fill="#0f172a">为假:直接写成 pending</text><rect x="780" y="96" width="200" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="880.0" y="120.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">pending_review</text><rect x="780" y="206" width="200" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="880.0" y="230.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">approved</text><rect x="780" y="316" width="200" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="880.0" y="340.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">effective</text><rect x="67.0" y="161.6" width="106.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="120.0" y="175.3" text-anchor="middle" font-size="12" fill="#475569">写下 next_run_id</text><rect x="92.0" y="271.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="120.0" y="285.3" text-anchor="middle" font-size="12" fill="#475569">指令已写</text><rect x="237.8" y="216.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="271.75" y="230.3" text-anchor="middle" font-size="12" fill="#475569">确定性失败</text><rect x="271.8" y="106.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="305.75" y="120.3" text-anchor="middle" font-size="12" fill="#475569">规划前失败</text><rect x="543.7" y="176.6" width="82.6" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="585.0" y="190.3" text-anchor="middle" font-size="12" fill="#475569">人工 confirm</text><rect x="840.7" y="161.6" width="78.7" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="880.0" y="175.3" text-anchor="middle" font-size="12" fill="#475569">门③ approve</text><rect x="825.7" y="271.6" width="108.7" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="880.0" y="285.3" text-anchor="middle" font-size="12" fill="#475569">RecipeStore 收录</text><rect x="40" y="440" width="18" height="13" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="65" y="451" font-size="12" fill="#475569">等待人工</text><rect x="135.0" y="440" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="160.0" y="451" font-size="12" fill="#475569">进行中</text><rect x="218.0" y="440" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="243.0" y="451" font-size="12" fill="#475569">完成</text><rect x="289.0" y="440" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="314.0" y="451" font-size="12" fill="#475569">失败</text><rect x="360.0" y="440" width="18" height="13" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="385.0" y="451" font-size="12" fill="#475569">虚线框 = 产物尚不存在</text></svg>
