<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">策略经验的上下文</title><desc id="d">TrainScheduler 的规划处理器在装配上下文之前先落账,把一轮的决策与结果压成一条经验记录,再由全部记录重算出长期条目;随后装配的规划上下文带上选中的条目,交给 TrainPlanner 渲染。策略经验只读写产物树,不调用外部模型,也不碰外部推理桥接。 节点;- TrainScheduler:plan_handler · assemble_context / 落账在装配之前;- strategy_experience:落账 · 聚合 · 选取 / 纯函数 + 一次幂等写;- TrainPlanner:把条目渲染进提示 / 模板 PLANNER_V2;- ControlPlane 产物树:runs/&lt;run&gt;/strategy_experience.yaml / experience/exp-&lt;维度&gt;-&lt;哈希&gt;.yaml;- 诊断与账本:diagnostic_report.yaml / run_trace.yaml;连线;- TrainScheduler → strategy_experience:终态 run;- strategy_experience → ControlPlane 产物树:写记录与条目;- ControlPlane 产物树 → strategy_experience:读全部记录;- 诊断与账本 → strategy_experience:分数 · 成本 · 退化;- TrainScheduler → TrainPlanner:含第七段的上下文</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="560" fill="#ffffff"/><rect x="14" y="44" width="1052" height="300" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">控制层(本地开发机)</text><path d="M294.0,142.9 L415.0,142.9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M485.0,200.0 L485.0,295.0 Q485.0,302.0 478.0,302.0 L126.0,302.0 Q119.0,302.0 119.0,309.0 L119.0,404.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M230.0,404.0 L230.0,309.0 Q230.0,302.0 237.0,302.0 L588.0,302.0 Q595.0,302.0 595.0,295.0 L595.0,200.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M505.0,404.0 L505.0,309.0 Q505.0,302.0 512.0,302.0 L563.0,302.0 Q570.0,302.0 570.0,295.0 L570.0,200.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M169.0,116.0 L169.0,85.0 Q169.0,78.0 176.0,78.0 L904.0,78.0 Q911.0,78.0 911.0,85.0 L911.0,116.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="44" y="116" width="250" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="169.0" y="145.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">TrainScheduler</text><text x="169.0" y="162.3" text-anchor="middle" font-size="12" fill="#475569">plan_handler · assemble_context</text><text x="169.0" y="179.8" text-anchor="middle" font-size="12" fill="#475569">落账在装配之前</text><rect x="415" y="116" width="250" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="145.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">strategy_experience</text><text x="540.0" y="162.3" text-anchor="middle" font-size="12" fill="#475569">落账 · 聚合 · 选取</text><text x="540.0" y="179.8" text-anchor="middle" font-size="12" fill="#475569">纯函数 + 一次幂等写</text><rect x="786" y="116" width="250" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="911.0" y="145.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">TrainPlanner</text><text x="911.0" y="162.3" text-anchor="middle" font-size="12" fill="#475569">把条目渲染进提示</text><text x="911.0" y="179.8" text-anchor="middle" font-size="12" fill="#475569">模板 PLANNER_V2</text><path d="M44,413 a150.0,9 0 0 1 300,0 v78 a150.0,9 0 0 1 -300,0 z" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><ellipse cx="194.0" cy="413" rx="150.0" ry="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="194.0" y="448.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ControlPlane 产物树</text><text x="194.0" y="465.4" text-anchor="middle" font-size="12" fill="#475569">runs/&lt;run&gt;/strategy_experience.yaml</text><text x="194.0" y="482.8" text-anchor="middle" font-size="12" fill="#475569">experience/exp-&lt;维度&gt;-&lt;哈希&gt;.yaml</text><path d="M415,413 a150.0,9 0 0 1 300,0 v78 a150.0,9 0 0 1 -300,0 z" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><ellipse cx="565.0" cy="413" rx="150.0" ry="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="565.0" y="448.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">诊断与账本</text><text x="565.0" y="465.4" text-anchor="middle" font-size="12" fill="#475569">diagnostic_report.yaml</text><text x="565.0" y="482.8" text-anchor="middle" font-size="12" fill="#475569">run_trace.yaml</text><rect x="786" y="404" width="250" height="70.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="786" y="404" width="4" height="70.0" rx="2" fill="#64748b"/><text x="800" y="424.0" font-size="12" fill="#0f172a">策略经验不调用外部模型</text><text x="800" y="442.0" font-size="12" fill="#0f172a">条目的正负只由诊断报告决定</text><text x="800" y="460.0" font-size="12" fill="#0f172a">外部 agent 不参与写入</text><rect x="326.3" y="133.4" width="56.4" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="354.5" y="147.2" text-anchor="middle" font-size="12" fill="#475569">终态 run</text><rect x="262.0" y="292.6" width="80.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="302.0" y="306.3" text-anchor="middle" font-size="12" fill="#475569">写记录与条目</text><rect x="378.5" y="292.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="412.5" y="306.3" text-anchor="middle" font-size="12" fill="#475569">读全部记录</text><rect x="478.4" y="292.6" width="118.2" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="537.5" y="306.3" text-anchor="middle" font-size="12" fill="#475569">分数 · 成本 · 退化</text><rect x="488.0" y="68.6" width="104.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="540.0" y="82.3" text-anchor="middle" font-size="12" fill="#475569">含第七段的上下文</text><rect x="40" y="522" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="65" y="533" font-size="12" fill="#475569">控制层</text><rect x="123.0" y="522" width="18" height="13" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="148.0" y="533" font-size="12" fill="#475569">存储</text></svg>
