<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">TrainPlanner 的上下文</title><desc id="d">TrainScheduler 装配规划上下文并带着领域校验器调用 TrainPlanner,拿回决策或明确的失败。TrainPlanner 只经外部推理桥接调用外部强模型;产物树里它只碰提示模板。组合根负责选后端和安装默认模板。 节点;- TrainScheduler:装配 PlanningContext / 领域校验 · 写 planner_decision;- TrainPlanner:打包 · 决策后端 · 严格解析 / 无状态;- 外部推理桥接:complete(prompt) → 文本 / 退避重试 · 成本记账;- factory 组合根:选决策后端 / 安装默认模板 PLANNER_V1;- 外部强模型:命令行进程 / 只返回文本;- ControlPlane 产物树:config/prompts/planner-&lt;版本&gt;.yaml / runs/&lt;run&gt;/planner_decision.yaml;连线;- TrainScheduler → TrainPlanner:上下文 + 校验器;- TrainPlanner → TrainScheduler:决策或失败;- TrainPlanner → 外部推理桥接:提示文本;- 外部推理桥接 → 外部强模型:子进程;- factory 组合根 → TrainPlanner:注入后端;- TrainScheduler → ControlPlane 产物树:读上下文 · 写决策;- factory 组合根 → ControlPlane 产物树:安装模板</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="560" fill="#ffffff"/><rect x="14" y="44" width="1052" height="300" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">控制层(本地开发机)</text><path d="M294.0,125.4 L415.0,125.4" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M415.0,156.5 L294.0,156.5" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M665.0,138.0 L786.0,138.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M911.0,180.0 L911.0,246.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,246.0 L540.0,180.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M119.0,180.0 L119.0,285.0 Q119.0,290.0 114.0,290.0 L114.0,290.0 Q109.0,290.0 109.0,295.0 L109.0,400.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M415.0,282.0 L276.0,282.0 Q269.0,282.0 269.0,289.0 L269.0,400.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="44" y="96" width="250" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="169.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">TrainScheduler</text><text x="169.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">装配 PlanningContext</text><text x="169.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">领域校验 · 写 planner_decision</text><rect x="415" y="96" width="250" height="84" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">TrainPlanner</text><text x="540.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">打包 · 决策后端 · 严格解析</text><text x="540.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">无状态</text><rect x="786" y="96" width="250" height="84" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="911.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">外部推理桥接</text><text x="911.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">complete(prompt) → 文本</text><text x="911.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">退避重试 · 成本记账</text><rect x="415" y="246" width="250" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="540.0" y="269.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">factory 组合根</text><text x="540.0" y="286.4" text-anchor="middle" font-size="12" fill="#475569">选决策后端</text><text x="540.0" y="303.8" text-anchor="middle" font-size="12" fill="#475569">安装默认模板 PLANNER_V1</text><rect x="786" y="246" width="250" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="911.0" y="269.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">外部强模型</text><text x="911.0" y="286.4" text-anchor="middle" font-size="12" fill="#475569">命令行进程</text><text x="911.0" y="303.8" text-anchor="middle" font-size="12" fill="#475569">只返回文本</text><path d="M44,409 a150.0,9 0 0 1 300,0 v78 a150.0,9 0 0 1 -300,0 z" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><ellipse cx="194.0" cy="409" rx="150.0" ry="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="194.0" y="444.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ControlPlane 产物树</text><text x="194.0" y="461.4" text-anchor="middle" font-size="12" fill="#475569">config/prompts/planner-&lt;版本&gt;.yaml</text><text x="194.0" y="478.8" text-anchor="middle" font-size="12" fill="#475569">runs/&lt;run&gt;/planner_decision.yaml</text><rect x="415" y="404" width="621" height="52.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="415" y="404" width="4" height="52.0" rx="2" fill="#64748b"/><text x="429" y="424.0" font-size="12" fill="#0f172a">TrainPlanner 不读树里的 run、配方、诊断</text><text x="429" y="442.0" font-size="12" fill="#0f172a">也不写 planner_decision;它只产出结构化决策,不改任何代码</text><rect x="307.2" y="116.0" width="94.5" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="354.5" y="129.7" text-anchor="middle" font-size="12" fill="#475569">上下文 + 校验器</text><rect x="320.5" y="147.0" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="354.5" y="160.8" text-anchor="middle" font-size="12" fill="#475569">决策或失败</text><rect x="697.5" y="128.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="725.5" y="142.3" text-anchor="middle" font-size="12" fill="#475569">提示文本</text><rect x="889.0" y="203.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="911.0" y="217.3" text-anchor="middle" font-size="12" fill="#475569">子进程</text><rect x="512.0" y="203.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="540.0" y="217.3" text-anchor="middle" font-size="12" fill="#475569">注入后端</text><rect x="58.5" y="280.6" width="111.1" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="114.005" y="294.3" text-anchor="middle" font-size="12" fill="#475569">读上下文 · 写决策</text><rect x="255.0" y="272.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="283.0" y="286.3" text-anchor="middle" font-size="12" fill="#475569">安装模板</text><rect x="40" y="525" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="65" y="536" font-size="12" fill="#475569">控制层</text><rect x="123.0" y="525" width="18" height="13" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="148.0" y="536" font-size="12" fill="#475569">共享基础设施</text><rect x="242.0" y="525" width="18" height="13" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="267.0" y="536" font-size="12" fill="#475569">存储</text></svg>
