<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">两类状态机与驱动者</title><desc id="d">需审核类:候选由派发器直接写成 pending_review,命令行批准或拒绝,守护进程晋级为 effective。非审核类:指令由守护进程置 executed 或 failed;awaiting_confirmation 经命令行 confirm 转 pending。迁移表还允许 draft 提交审核、effective 废弃或被取代、executed 被下游消费。 节点;- draft;- pending_review;- approved;- effective;- rejected;- deprecated;- superseded;- awaiting_confirmation;- pending;- executed;- consumed;- failed;连线;- draft → pending_review:提交审核;- pending_review → approved:CLI approve;- pending_review → rejected:CLI reject;- approved → effective:promote_candidate;- approved → rejected:仅收录处理器(虚线);- effective → deprecated:战绩退化;- effective → superseded:被取代;- awaiting_confirmation → pending:CLI confirm;- pending → executed:派发器正常返回;- executed → consumed:被下游读取;- pending → failed:DirectiveFailedError;- awaiting_confirmation → failed:人工改文件(虚线)</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1080" height="560" fill="#ffffff"/><rect x="14" y="44" width="520" height="460" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">需审核类:候选 checkpoint · 配方候选 · 技能记忆提案</text><rect x="546" y="44" width="520" height="460" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="560" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">非审核类:directive(其余产物直接写成终态)</text><path d="M135.0,136.0 L135.0,196.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M135.0,236.0 L135.0,296.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M220.0,216.0 L330.0,216.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M135.0,336.0 L135.0,396.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M220.0,316.0 L403.0,316.0 Q410.0,316.0 410.0,309.0 L410.0,236.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ah0)"/><path d="M220.0,408.0 L268.0,408.0 Q275.0,408.0 275.0,401.0 L275.0,397.0 Q275.0,390.0 282.0,390.0 L330.0,390.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M220.0,428.0 L268.0,428.0 Q275.0,428.0 275.0,435.0 L275.0,453.0 Q275.0,460.0 282.0,460.0 L330.0,460.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M705.0,136.0 L705.0,196.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M705.0,236.0 L705.0,296.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M705.0,336.0 L705.0,396.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M820.0,216.0 L928.0,216.0 Q935.0,216.0 935.0,223.0 L935.0,296.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M820.0,116.0 L1003.0,116.0 Q1010.0,116.0 1010.0,123.0 L1010.0,296.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ah0)"/><rect x="50" y="96" width="170" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="135.0" y="120.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">draft</text><rect x="50" y="196" width="170" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="135.0" y="220.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">pending_review</text><rect x="50" y="296" width="170" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="135.0" y="320.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">approved</text><rect x="50" y="396" width="170" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="135.0" y="420.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">effective</text><rect x="330" y="196" width="160" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="410.0" y="220.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">rejected</text><rect x="330" y="370" width="160" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="410.0" y="394.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">deprecated</text><rect x="330" y="440" width="160" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="410.0" y="464.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">superseded</text><rect x="270" y="96" width="240" height="52.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="270" y="96" width="4" height="52.0" rx="2" fill="#64748b"/><text x="284" y="116.0" font-size="12" fill="#0f172a">派发器写候选时直接写</text><text x="284" y="134.0" font-size="12" fill="#0f172a">pending_review,不经 draft</text><rect x="590" y="96" width="230" height="40" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="705.0" y="120.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">awaiting_confirmation</text><rect x="590" y="196" width="230" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="705.0" y="220.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">pending</text><rect x="590" y="296" width="230" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="705.0" y="320.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">executed</text><rect x="590" y="396" width="230" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="705.0" y="420.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">consumed</text><rect x="890" y="296" width="150" height="40" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="965.0" y="320.6" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">failed</text><rect x="860" y="396" width="190" height="52.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="860" y="396" width="4" height="52.0" rx="2" fill="#64748b"/><text x="874" y="416.0" font-size="12" fill="#0f172a">failed 是终态</text><text x="874" y="434.0" font-size="12" fill="#0f172a">原因写进 payload.failure</text><rect x="107.0" y="156.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="135.0" y="170.3" text-anchor="middle" font-size="12" fill="#475569">提交审核</text><rect x="94.8" y="256.6" width="80.4" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="135.0" y="270.3" text-anchor="middle" font-size="12" fill="#475569">CLI approve</text><rect x="240.8" y="206.6" width="68.5" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="275.0" y="220.3" text-anchor="middle" font-size="12" fill="#475569">CLI reject</text><rect x="74.7" y="356.6" width="120.7" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="135.0" y="370.3" text-anchor="middle" font-size="12" fill="#475569">promote_candidate</text><rect x="274.5" y="306.6" width="80.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="314.5" y="320.3" text-anchor="middle" font-size="12" fill="#475569">仅收录处理器</text><rect x="247.0" y="389.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="275.0" y="403.3" text-anchor="middle" font-size="12" fill="#475569">战绩退化</text><rect x="253.0" y="434.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="275.0" y="448.3" text-anchor="middle" font-size="12" fill="#475569">被取代</text><rect x="665.4" y="156.6" width="79.3" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="705.0" y="170.3" text-anchor="middle" font-size="12" fill="#475569">CLI confirm</text><rect x="659.0" y="256.6" width="92.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="705.0" y="270.3" text-anchor="middle" font-size="12" fill="#475569">派发器正常返回</text><rect x="671.0" y="356.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="705.0" y="370.3" text-anchor="middle" font-size="12" fill="#475569">被下游读取</text><rect x="866.9" y="237.8" width="136.2" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="935.0" y="251.6" text-anchor="middle" font-size="12" fill="#475569">DirectiveFailedError</text><rect x="915.5" y="106.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="949.5" y="120.3" text-anchor="middle" font-size="12" fill="#475569">人工改文件</text><rect x="40" y="524" width="18" height="13" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="65" y="535" font-size="12" fill="#475569">等待人工</text><rect x="135.0" y="524" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="160.0" y="535" font-size="12" fill="#475569">生效 / 完成</text><rect x="242.0" y="524" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="267.0" y="535" font-size="12" fill="#475569">失败 / 拒绝</text><rect x="349.0" y="524" width="18" height="13" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="374.0" y="535" font-size="12" fill="#475569">虚线 = 人工直接改文件 / approved → rejected 仅收录处理器走</text></svg>
