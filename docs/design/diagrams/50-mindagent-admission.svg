<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">提案到入库的审核链</title><desc id="d">验证结果先按阈值筛选,未过的写进轮次的 dropped。通过的打包成 pending_review 提案,人工在门②批准或拒绝。批准后收录处理器先校验全部增量,再写库条目、递增 library_state,最后把提案置 effective。增量不合法时记一次 T2 失败记录(提案缺 run_id、run 目录不在或已记过时不写),提案留在 approved。 节点;- 验证结果:fired_on_motivating / fired_elsewhere;- 阈值筛选:≥ 0.8 且 ≤ 0.2 才通过;- 提案 pending_review:skill_memory_proposal / 带 verification;- 门② 人工审核:review 看证据 / approve / reject;- dropped 记录:写进轮次产物;- 提案 approved:调和循环产生 / admit_proposal;- 校验全部增量:Skill / MemoryEntry / 不合法则一条不写;- 写库条目:skill_library/ / memory_library/;- library_state:对应版本 +1 / admitted 追加一条;- 提案 effective:收录完成;- T2 失败记录:提案留在 approved / failure-admit-&lt;提案&gt;;- 提案 rejected:保留记录;连线;- 验证结果 → 阈值筛选;- 阈值筛选 → 提案 pending_review:通过;- 阈值筛选 → dropped 记录:未通过;- 提案 pending_review → 门② 人工审核;- 门② 人工审核 → 提案 approved:approve;- 门② 人工审核 → 提案 rejected:reject;- 提案 approved → 校验全部增量;- 校验全部增量 → 写库条目;- 写库条目 → library_state;- library_state → 提案 effective;- 校验全部增量 → T2 失败记录:不合法</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1080" height="600" fill="#ffffff"/><path d="M230.0,188.0 L290.0,188.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M490.0,188.0 L550.0,188.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M390.0,150.0 L390.0,96.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M750.0,188.0 L810.0,188.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M876.5,226.0 L876.5,320.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M1000.0,188.0 L1028.0,188.0 Q1035.0,188.0 1035.0,195.0 L1035.0,505.0 Q1035.0,512.0 1028.0,512.0 L1000.0,512.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M810.0,358.0 L750.0,358.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M550.0,358.0 L490.0,358.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M290.0,358.0 L230.0,358.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M130.0,396.0 L130.0,480.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M650.0,396.0 L650.0,480.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah2)"/><rect x="30" y="150" width="200" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="130.0" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">验证结果</text><text x="130.0" y="192.3" text-anchor="middle" font-size="12" fill="#475569">fired_on_motivating</text><text x="130.0" y="209.8" text-anchor="middle" font-size="12" fill="#475569">fired_elsewhere</text><rect x="290" y="150" width="200" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="390.0" y="184.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">阈值筛选</text><text x="390.0" y="201.1" text-anchor="middle" font-size="12" fill="#475569">≥ 0.8 且 ≤ 0.2 才通过</text><rect x="550" y="150" width="200" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="650.0" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">提案 pending_review</text><text x="650.0" y="192.3" text-anchor="middle" font-size="12" fill="#475569">skill_memory_proposal</text><text x="650.0" y="209.8" text-anchor="middle" font-size="12" fill="#475569">带 verification</text><polygon points="826.0,150.0 984.0,150.0 1000.0,188.0 984.0,226.0 826.0,226.0 810.0,188.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="905.0" y="175.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">门② 人工审核</text><text x="905.0" y="192.3" text-anchor="middle" font-size="12" fill="#475569">review 看证据</text><text x="905.0" y="209.8" text-anchor="middle" font-size="12" fill="#475569">approve / reject</text><rect x="290" y="40" width="200" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="390.0" y="64.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">dropped 记录</text><text x="390.0" y="81.0" text-anchor="middle" font-size="12" fill="#475569">写进轮次产物</text><rect x="810" y="320" width="190" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="905.0" y="345.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">提案 approved</text><text x="905.0" y="362.4" text-anchor="middle" font-size="12" fill="#475569">调和循环产生</text><text x="905.0" y="379.8" text-anchor="middle" font-size="12" fill="#475569">admit_proposal</text><rect x="550" y="320" width="200" height="76" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="650.0" y="345.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">校验全部增量</text><text x="650.0" y="362.4" text-anchor="middle" font-size="12" fill="#475569">Skill / MemoryEntry</text><text x="650.0" y="379.8" text-anchor="middle" font-size="12" fill="#475569">不合法则一条不写</text><rect x="290" y="320" width="200" height="76" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="390.0" y="345.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">写库条目</text><text x="390.0" y="362.4" text-anchor="middle" font-size="12" fill="#475569">skill_library/</text><text x="390.0" y="379.8" text-anchor="middle" font-size="12" fill="#475569">memory_library/</text><rect x="30" y="320" width="200" height="76" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="130.0" y="345.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">library_state</text><text x="130.0" y="362.4" text-anchor="middle" font-size="12" fill="#475569">对应版本 +1</text><text x="130.0" y="379.8" text-anchor="middle" font-size="12" fill="#475569">admitted 追加一条</text><rect x="30" y="480" width="200" height="64" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="130.0" y="508.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">提案 effective</text><text x="130.0" y="525.0" text-anchor="middle" font-size="12" fill="#475569">收录完成</text><rect x="550" y="480" width="200" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="650.0" y="499.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">T2 失败记录</text><text x="650.0" y="516.4" text-anchor="middle" font-size="12" fill="#475569">提案留在 approved</text><text x="650.0" y="533.8" text-anchor="middle" font-size="12" fill="#475569">failure-admit-&lt;提案&gt;</text><rect x="810" y="480" width="190" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="905.0" y="508.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">提案 rejected</text><text x="905.0" y="525.0" text-anchor="middle" font-size="12" fill="#475569">保留记录</text><circle cx="550" cy="320" r="10" fill="#16a34a"/><text x="550" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text><circle cx="290" cy="320" r="10" fill="#16a34a"/><text x="290" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text><circle cx="30" cy="320" r="10" fill="#16a34a"/><text x="30" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text><circle cx="30" cy="480" r="10" fill="#16a34a"/><text x="30" y="484" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text><rect x="290" y="470" width="230" height="52.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="290" y="470" width="4" height="52.0" rx="2" fill="#64748b"/><text x="304" y="490.0" font-size="12" fill="#0f172a">每步可重入:条目已在就跳过</text><text x="304" y="508.0" font-size="12" fill="#0f172a">admitted 已记就不再递增</text><rect x="504.0" y="178.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="520.0" y="192.3" text-anchor="middle" font-size="12" fill="#475569">通过</text><rect x="368.0" y="113.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="390.0" y="127.3" text-anchor="middle" font-size="12" fill="#475569">未通过</text><rect x="848.6" y="263.6" width="55.9" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="876.5" y="277.3" text-anchor="middle" font-size="12" fill="#475569">approve</text><rect x="1013.0" y="340.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="1035.0" y="354.3" text-anchor="middle" font-size="12" fill="#475569">reject</text><rect x="628.0" y="428.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="650.0" y="442.3" text-anchor="middle" font-size="12" fill="#475569">不合法</text><rec