xt x="293.5" y="280.3" text-anchor="middle" font-size="12" fill="#475569">仅收录处理器</text><rect x="232.0" y="346.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="260.0" y="360.3" text-anchor="middle" font-size="12" fill="#475569">战绩退化</text><rect x="178.0" y="406.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="200.0" y="420.3" text-anchor="middle" font-size="12" fill="#475569">被取代</text><rect x="678.7" y="156.6" width="82.6" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="720.0" y="170.3" text-anchor="middle" font-size="12" fill="#475569">confirm 命令</text><rect x="692.0" y="256.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="720.0" y="270.3" text-anchor="middle" font-size="12" fill="#475569">派发成功</text><rect x="686.0" y="356.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="720.0" y="370.3" text-anchor="middle" font-size="12" fill="#475569">被下游读取</text><rect x="839.0" y="206.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="873.0" y="220.3" text-anchor="middle" font-size="12" fill="#475569">确定性失败</text><rect x="898.6" y="106.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="932.6" y="120.3" text-anchor="middle" font-size="12" fill="#475569">人工改文件</text><rect x="40" y="496" width="18" height="13" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="65" y="507" font-size="12" fill="#475569">等待人工</text><rect x="135.0" y="496" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="160.0" y="507" font-size="12" fill="#475569">生效 / 完成</text><rect x="242.0" y="496" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="267.0" y="507" font-size="12" fill="#475569">失败 / 拒绝</text><rect x="349.0" y="496" width="18" height="13" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="374.0" y="507" font-size="12" fill="#475569">虚线 = 人工直接改文件 / approved → rejected 仅收录处理器走</text></svg>
