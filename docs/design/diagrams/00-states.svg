<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">产物状态机</title><desc id="d">需审核类产物经人工批准才能生效,可被拒绝,生效后可废弃或被取代。已批准的提案在收录失败时,只许收录处理器把它改为被拒绝。非审核类产物从待执行走到已执行再到已消费,失败是保留记录的终态。 节点;- draft;- pending_review;- approved;- effective;- rejected;- deprecated;- superseded;- awaiting_confirmation;- pending;- executed;- consumed;- failed;连线;- draft → pending_review:提交审核;- pending_review → approved:approve;- pending_review → rejected:reject;- approved → effective:收录 / 晋级;- approved → rejected:仅收录处理器(虚线);- effective → deprecated:战绩退化;- effective → superseded:被取代;- awaiting_confirmation → pending:confirm 命令;- pending → executed:派发成功;- executed → consumed:被下游读取;- pending → failed:确定性失败;- awaiting_confirmation → failed:人工改文件(虚线)</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1080" height="520" fill="#ffffff"/><rect x="14" y="44" width="500" height="440" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">需审核类产物:checkpoint 候选 · 配方候选 · 技能记忆提案</text><rect x="566" y="44" width="500" height="440" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="580" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">非审核类产物:指令 · 诊断报告 · 轮次记录</text><path d="M140.0,136.0 L140.0,176.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M140.0,216.0 L140.0,256.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M220.0,196.0 L300.0,196.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M140.0,296.0 L140.0,336.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M220.0,276.0 L363.0,276.0 Q370.0,276.0 370.0,269.0 L370.0,216.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ah0)"/><path d="M220.0,356.0 L300.0,356.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M140.0,376.0 L140.0,409.0 Q140.0,416.0 147.0,416.0 L300.0,416.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M720.0,136.0 L720.0,196.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M720.0,236.0 L720.0,296.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M720.0,336.0 L720.0,396.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M830.0,216.0 L915.0,216.0 Q922.0,216.0 922.0,223.0 L922.0,296.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M830.0,116.0 L985.0,116.0 Q992.0,116.0 992.0,123.0 L992.0,296.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ah0)"/><rect x="60" y="96" width="160" height="40" rx="8" fill="#f8fafc" str