t="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="360.0" y="173.3" text-anchor="middle" font-size="12" fill="#475569">数据或配置坏</text><rect x="692.0" y="88.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="720.0" y="102.3" text-anchor="middle" font-size="12" fill="#475569">下游消费</text><rect x="142.0" y="72.6" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="170.0" y="86.3" text-anchor="middle" font-size="12" fill="#475569">存点回写</text><rect x="332.1" y="295.6" width="55.9" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="360.0" y="309.3" text-anchor="middle" font-size="12" fill="#475569">approve</text><rect x="338.0" y="341.1" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="360.0" y="354.8" text-anchor="middle" font-size="12" fill="#475569">reject</text><rect x="691.3" y="286.6" width="57.3" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="720.0" y="300.3" text-anchor="middle" font-size="12" fill="#475569">promote</text><rect x="40" y="410" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="65" y="421" font-size="12" fill="#475569">MindTrainer 写</text><rect x="178.32" y="410" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="203.32" y="421" font-size="12" fill="#475569">失败终态</text><rect x="273.32" y="410" width="18" height="13" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="298.32" y="421" font-size="12" fill="#475569">人工动作</text><rect x="368.32" y="410" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="393.32" y="421" font-size="12" fill="#475569">调和循环</text><rect x="463.32" y="410" width="18" height="13" rx="3" fill="#f8fafc" stroke="#64748b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="488.32" y="421" font-size="12" fill="#475569">虚线 = 别的写方</text></svg>
