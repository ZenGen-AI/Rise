<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" width="1080" height="440" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">训练记录与候选的状态</title><desc id="d">训练记录走非审核类状态机:pending 期间可反复回写存点进度,确定性失败到 failed,收尾到 executed。候选由 MindTrainer 以 pending_review 注册,之后的审核与晋级归审核门①与调和循环。 节点;- pending:运行中 · 可续训 / 回写 checkpoint 进度;- executed:候选已注册;- failed:确定性失败 · T2 / 终态,保留;- consumed:不由 MindTrainer 写;- pending_review:register_candidate 写入;- approved:审核门① 人工批准;- rejected:审核门① 人工拒绝;- effective:调和循环晋级为 zengen;连线;- pending → executed:收尾完成;- pending → failed:数据或配置坏;- executed → consumed:下游消费(虚线);- pending_review → approved:approve;- pending_review → rejected:reject;- approved → effective:promote</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="440" fill="#ffffff"/><rect x="14" y="44" width="1052" height="170" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">training_run(MindTrainer 写)</text><rect x="14" y="236" width="1052" height="160" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="258" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">candidate_checkpoint(MindTrainer 只写第一步)</text><path d="M280.0,124.0 L353.0,124.0 Q360.0,124.0 360.0,117.0 L360.0,105.0 Q360.0,98.0 367.0,98.0 L440.0,98.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M280.0,160.0 L353.0,160.0 Q360.0,160.0 360.0,167.0 L360.0,171.0 Q360.0,178.0 367.0,178.0 L440.0,178.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linej