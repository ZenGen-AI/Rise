<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">controlplane 的模块</title><desc id="d">三层模块。驱动层是纯函数 reconcile 与守护进程 daemon;工具层是只读解析、观测、配置函数,以及记账与证据等级;存储层是 GitStore、读取链、信封、路径与状态机。箭头是导入方向。 节点;- reconcile.py:纯函数 reconcile / TreeState · Action;- daemon.py:run_daemon · reconcile_once / apply_action · 派发缝;- simulator.stubs:骨架桩,包级回指;- models.py:latest_promoted / _checkpoint;- observe.py:trace · cost / sum_costs;- config.py:凭证变量名 / 脱敏 redact;- ledger · evidence:记账 · 证据等级;- paths.py:目录常量与路径函数;- states.py:两张迁移表;- gitstore.py:GitStore · git 子进程 / 逐字节相同不提交;- 读取链:read_product 入口 / 迁移 → Schema 校验;- envelope.py:Envelope · BigRef / OwnerRef;连线;- daemon.py → reconcile.py:调用;- daemon.py → simulator.stubs:导入;- daemon.py → gitstore.py:读写产物;- models.py → gitstore.py;- observe.py → gitstore.py;- ledger · evidence → gitstore.py;- gitstore.py → paths.py;- gitstore.py → 读取链;- 读取链 → envelope.py</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1080" height="560" fill="#ffffff"/><rect x="14" y="44" width="1052" height="124" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">驱动层</text><rect x="14" y="186" width="1052" height="124" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="208" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">工具层(被其他包直接调用)</text><r