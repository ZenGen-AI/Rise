<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" width="1080" height="430" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">策略条目的生命周期</title><desc id="d">条目首次写出时证据不足,支持数到二且平均增益为正才转为可用;反例过半即废弃,基准版本变更则整体失效。状态写在条目载荷里,由重算决定;人直接改写过的条目不再被机器改写。 节点;- 条目 insufficient:支持数不足二;- 条目 effective:可注入;- 条目 deprecated:反例过半;- 条目 stale:基准版本已换;- 人工保留:机器不再改写;连线;- 条目 insufficient → 条目 effective:支持数 ≥ 2;- 条目 insufficient → 条目 deprecated:反例过半;- 条目 effective → 条目 deprecated:反例过半;- 条目 effective → 条目 stale:换基准版本;- 条目 insufficient → 条目 stale:换基准版本;- 条目 effective → 人工保留:人直接改载荷(虚线)</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="430" fill="#ffffff"/><rect x="14" y="44" width="1052" height="300" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">experience/exp-&lt;维度&gt;-&lt;哈希&gt;.yaml</text><path d="M260.0,140.0 L340.0,140.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M160.0,170.0 L160.0,283.0 Q160.0,290.0 167.0,290.0 L340.0,290.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M440.0,170.0 L440.0,260.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,140.0 L680.0,140.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linej