<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">SocialSimulator 仿真部分的上下文</title><desc id="d">仿真部分居中。MindTrainer 经清单读批量数据集,经接口①跑实时会话;诊断评测与 ControlPlane 骨架桩以库调用复用它;它把情境、人格、Episode 与清单写进产物树。MindAgent 经接口②连入会话,SimpleActio 的激活轨迹随每轮回传。 节点;- MindTrainer:batch:读清单并校验 / interact:实时会话客户端;- MindAgent:部署经验采集客户端;- 诊断评测:动态轨直接调用 run_episode;- SocialSimulator 仿真部分:情境与人格 · 仿真运行器 / 批量数据集 · 实时环境服务;- ControlPlane 骨架桩:simulator.stubs 调情境生成器;- 产物树:scenarios/ · personas/ / runs/&lt;run&gt;/episodes/ / dataset_manifest_&lt;阶段&gt;;- SimpleActio:每轮附带激活轨迹;连线;- MindTrainer ↔ SocialSimulator 仿真部分:① gRPC 会话;- MindAgent ↔ SocialSimulator 仿真部分:② gRPC 会话;- 诊断评测 → SocialSimulator 仿真部分:库调用;- ControlPlane 骨架桩 → SocialSimulator 仿真部分:库调用;- SocialSimulator 仿真部分 ↔ 产物树:写入并读回;- SimpleActio → SocialSimulator 仿真部分:activation_trace</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="560" fill="#ffffff"/><rect x="14" y="44" width="300" height="470" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">调用方(计算层)</text><rect x="766" y="44" width="300" height="470" rx="12" fill="#7c3aed" fill-opacity="0.05" stroke="#7c3aed" stroke-width="1.2"/><text x="1052" y="66" text-anchor="end" font-size="13" font-weight="700" fill="#7c3aed">存储与共享基础设施</text><path d="M290.0,148.0 L333.0,148.0 Q340.0,148.0 340.0,155.0 L340.0,221.8 Q340.0,228.8