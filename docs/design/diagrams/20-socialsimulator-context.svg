th="1.5"/><text x="165.0" y="400.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">诊断评测</text><text x="165.0" y="417.1" text-anchor="middle" font-size="12" fill="#475569">动态轨直接调用 run_episode</text><rect x="390" y="200" width="300" height="96" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="540.0" y="235.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SocialSimulator 仿真部分</text><text x="540.0" y="252.3" text-anchor="middle" font-size="12" fill="#475569">情境与人格 · 仿真运行器</text><text x="540.0" y="269.8" text-anchor="middle" font-size="12" fill="#475569">批量数据集 · 实时环境服务</text><rect x="415" y="72" width="250" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="540.0" y="100.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ControlPlane 骨架桩</text><text x="540.0" y="117.0" text-anchor="middle" font-size="12" fill="#475569">simulator.stubs 调情境生成器</text><path d="M800,195 a120.0,9 0 0 1 240,0 v106 a120.0,9 0 0 1 -240,0 z" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><ellipse cx="920.0" cy="195" rx="120.0" ry="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="920.0" y="235.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">产物树</text><text x="920.0" y="252.7" text-anchor="middle" font-size="12" fill="#475569">scenarios/ · personas/</text><text x="920.0" y="270.1" text-anchor="middle" font-size="12" fill="#475569">runs/&lt;run&gt;/episodes/</text><text x="920.0" y="287.4" text-anchor="middle" font-size="12" fill="#475569">dataset_manifest_&lt;阶段&gt;</text><rect x="800" y="392" width="240" height="64" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="920.0" y="420.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SimpleActio</text><text x="920.0" y="437.1" text-anchor="middle" font-size="12" fill="#475569">每轮附带激活轨迹</text><rect x="301.0" y="179.0" width="78.0" height="18.9" rx="4" fill="#ff