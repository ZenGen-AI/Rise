<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">部署拓扑</title><desc id="d">控制层跑在本地开发机,含命令行、调和守护进程、git 产物树和决策组件;计算层跑在远程 GPU 服务器,含批量任务、训练进程、实时环境服务和大体量产物。两层之间经 SSH 下发任务,大体量产物在 git 树里只存引用。 节点;- 人工命令行:TypeScript / 审核 · 批准 · 驳回 · 状态;- 调和守护进程:Python · 轮询产物树 / 纯函数决定动作;- git 产物树:control-plane/ / YAML · 每次变更提交;- 外部推理桥接:命令行调用外部模型 / 凭证只在本机;- 决策与配方组件:TrainScheduler / TrainPlanner / RecipeStore;- 外部强模型:Claude Code · Codex · DeepSeek;- 批量任务:数据合成 · 诊断评测 / 按需启动,跑完退出;- 训练进程:MindTrainer + ROLL / 训练执行器;- 推理服务 vLLM:rollout 与评测的模型调用;- 实时环境服务:gRPC 双向流 · 常驻进程 / 每会话状态隔离;- 大体量产物:checkpoint · 数据集 · 日志 / 训练与批量任务写入,git 树里只留引用;连线;- 人工命令行 → git 产物树:写状态;- 调和守护进程 ↔ git 产物树;- 决策与配方组件 ↔ git 产物树;- 决策与配方组件 → 外部推理桥接;- 外部推理桥接 → 外部强模型:命令行进程;- 调和守护进程 ↔ 批量任务:SSH 下发;- 训练进程 ↔ 实时环境服务:①;- git 产物树 → 大体量产物:引用 + sha256(虚线)</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1080" height="640" fill="#ffffff"/><rect x="14" y="44" width="460" height="430" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">控制层 · 本地开发机</text><rect x="606" y="44" width="460" height="430" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="620" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">计算层 · 远程 GPU 服务器</text><rect x="14" y="500" width="460" height="100" rx="12" fill="#64748b" fill-opacity="0.05" stroke="#64748b" stroke-width="1.2"/><text x="28" y="522" text-anchor="start" font-size="13" font-weight="700" fill="#64748b">外部服务</text><path d="M134.0,162.0 L134.0,179.0 Q134.0,186.0 141.0,186.0 L177.0,186.0 Q184.0,186.0 184.0,193.0 L184.0,210.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M350.0,162.0 L350.0,179.0 Q350.0,186.0 343.0,186.0 L291.0,186.0 Q284.0,186.0 284.0,193.0 L284.0,210.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M350.0,330.0 L350.0,317.0 Q350.0,310.0 343.0,310.0 L321.0,310.0 Q314.0,310.0 314.0,303.0 L314.0,290.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M250.0,372.0 L224.0,372.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M129.0,414.0 L129.0,538.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M450.0,127.0 L626.0,127.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M942.0,162.0 L942.0,210.0" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)" marker-start="url(#ah1)"/><path d="M334.0,250.0 L473.0,250.0 Q480.0,250.0 480.0,257.0 L480.0,363.0 Q480.0,370.0 487.0,370.0 L626.0,370.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#ah0)"/><rect x="34" y="92" width="200" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="134.0" y="114.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a