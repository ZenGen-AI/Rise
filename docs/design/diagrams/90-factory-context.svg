<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">factory 与命令行的上下文</title><desc id="d">人经两种语言的命令行进入系统。TypeScript 命令行直接改产物树并提交;Python 入口调用组合根 factory,由它装配各子系统并启动调和循环。原守护进程入口保留,只注入 MindTrainer 派发器。 节点;- 人工:审核人 · 开发者;- TypeScript 命令行:rise review · approve / reject · status · confirm;- Python 入口:run_factory.py · run_factory_dev.py / run · reconcile · 只读子命令;- 守护进程入口:run_controlplane.py / → mindtrainer.wire;- factory 组合根:唯一知道所有包的地方 / 任何包都不导入它;- 被装配的子系统:派发器 · 诊断评估器 / 六个处理器 · 外部推理桥接;- git 产物树:control-plane/ / YAML · 每次变更提交;- ControlPlane:调和循环 run_daemon / reconcile_once;连线;- 人工 → TypeScript 命令行:审核 · 确认;- 人工 → Python 入口;- 人工 → 守护进程入口;- TypeScript 命令行 → git 产物树:门控写 · 提交;- Python 入口 → factory 组合根:调用;- factory 组合根 → 被装配的子系统:构造;- factory 组合根 → ControlPlane:注入并启动;- ControlPlane ↔ git 产物树:读写;- 守护进程入口 → ControlPlane:只注入 MindTrainer 派发器</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="600" fill="#ffffff"/><rect x="210" y="44" width="320" height="470" rx="12" fill="#d97706" fill-opacity="0.05" stroke="#d97706" stroke-width="1.2"/><text x="224" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#d97706">人机入口</text><path d="M184.0,250.8 L203.0,250.8 Q210.0,250.8 210.0,243.8 L210.0,127.0 Q210.0,120.0 217.0,120.0 L236.0,120.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M184.0,270.0 L236.0,270.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M184.0,289.2 L203.0,289.2 Q210.0,289.2 210.0,296.2 L210.0,423.0 Q