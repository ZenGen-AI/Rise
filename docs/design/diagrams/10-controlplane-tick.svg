<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">一次调和 tick</title><desc id="d">读树投影成视图,纯函数算出动作列表,逐个执行。下发指令走派发器,诊断走评估器,晋级做三次写入,等待审核不做事。资源暂时不可用时延后重试;读不出的产物记为 unreadable 并暂停闭环;其余未捕获的异常让守护进程退出;正常结束后休眠再来。 节点;- 读树 read_tree_state:扫 runs/* 的指令与候选 / 取 models/ 的最大版本号 / 读不出的记为 unreadable;- 决策 reconcile:纯函数,无 IO / 输出有序动作列表;- 休眠 interval_s:max_ticks 到达则退出;- dispatch_directive:调派发器 / 返回 → executed / DirectiveFailedError → failed;- request_diagnostic:评估器写 diagnostic_report / 缺省时由桩占位;- promote_candidate:写 zengen-vN / 候选 → effective / 写 outcome;- await_review:无自动动作 / 等人工审核门①;- 未捕获异常上抛:派发器其他异常 / git 失败 · OSError / 守护进程退出 / 指令仍 pending 等重启;- DeferredError 延后:不写树 · 状态不动 / 退避重试,超上限才退出;- git 产物树:每次写入一个提交 · 内容相同不提交;连线;- 读树 read_tree_state → 决策 reconcile:TreeState;- 决策 reconcile → 休眠 interval_s:动作执行完;- 休眠 interval_s → 读树 read_tree_state:下一次 tick;- 决策 reconcile → dispatch_directive;- 决策 reconcile → request_diagnostic;- 决策 reconcile → promote_candidate;- 决策 reconcile → await_review;- dispatch_directive → 未捕获异常上抛:其他异常;- dispatch_directive → DeferredError 延后:资源暂不可用;- request_diagnostic → git 产物树;- promote_candidate → git 产物树:三次写入</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1080" height="600" fill="#ffffff"/><path d="M340.0,104.0 L410.0,104.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M700.0,104.0 L790.0,104.0" fill="none" stroke="#475569" st