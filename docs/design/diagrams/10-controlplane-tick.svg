x="415.0" y="280.4" text-anchor="middle" font-size="12" fill="#475569">评估器写 diagnostic_report</text><text x="415.0" y="297.8" text-anchor="middle" font-size="12" fill="#475569">缺省时由桩占位</text><rect x="560" y="230" width="230" height="92" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="675.0" y="254.8" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">promote_candidate</text><text x="675.0" y="271.6" text-anchor="middle" font-size="12" fill="#475569">写 zengen-vN</text><text x="675.0" y="289.0" text-anchor="middle" font-size="12" fill="#475569">候选 → effective</text><text x="675.0" y="306.4" text-anchor="middle" font-size="12" fill="#475569">写 outcome</text><polygon points="836.0,230.0 1024.0,230.0 1040.0,276.0 1024.0,322.0 836.0,322.0 820.0,276.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="930.0" y="263.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">await_review</text><text x="930.0" y="280.4" text-anchor="middle" font-size="12" fill="#475569">无自动动作</text><text x="930.0" y="297.8" text-anchor="middle" font-size="12" fill="#475569">等人工审核门①</text><rect x="40" y="420" width="230" height="110" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="155.0" y="445.1" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">未捕获异常上抛</text><text x="155.0" y="461.9" text-anchor="middle" font-size="12" fill="#475569">派发器其他异常</text><text x="155.0" y="479.3" text-anchor="middle" font-size="12" fill="#475569">git 失败 · OSError</text><text x="155.0" y="496.8" text-anchor="middle" font-size="12" fill="#475569">守护进程退出</text><text x="155.0" y="514.1" text-anchor="middle" font-size="12" fill="#475569">指令仍 pending 等重启</text><rect x="300" y="420" width="230" height="110" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="415.0" y="462.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">DeferredError 延后</text><text x="415.0" y="479.4" text-anchor="mid