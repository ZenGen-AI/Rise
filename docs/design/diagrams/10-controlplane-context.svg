<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">ControlPlane 的上下文</title><desc id="d">审核人经 TypeScript 命令行改审核状态,守护进程由入口启动并注入派发器。守护进程扫描 git 产物树,把指令交给派发器,缺省时调用骨架桩。诊断评估器与闭环处理器经注入缝接入,由 factory 组合根装配。 节点;- 审核人:人工审核门① / 确认指令;- 人工命令行 rise:TypeScript · 门控写命令 / review approve reject status;- 调和守护进程:Python · run_daemon / 纯函数 reconcile + 执行壳;- 入口 run_controlplane:mindtrainer.wire.main / 注入 MindTrainer 派发器;- factory 组合根:组装处理器与评估器;- MindTrainer 派发器:训练出候选 checkpoint;- 诊断评估器:替换 request_diagnostic;- 闭环处理器:规划 · 提名 · 战绩 / 智能体轮次 · 收录;- git 产物树 control-plane/:YAML 信封 · 每次变更一次提交 · 唯一真相;- simulator.stubs:骨架桩:默认派发器 / 与默认诊断器;连线;- 审核人 → 人工命令行 rise:命令;- 人工命令行 rise → git 产物树 control-plane/:改状态并提交;- 调和守护进程 ↔ git 产物树 control-plane/:扫描 · 写回;- 入口 run_controlplane → 调和守护进程:启动并注入;- factory 组合根 → 调和守护进程;- 调和守护进程 → MindTrainer 派发器:派发指令;- 调和守护进程 → 诊断评估器;- 调和守护进程 → 闭环处理器;- 调和守护进程 → simulator.stubs:缺省时调用</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1080" height="560" fill="#ffffff"/><rect x="250" y="150" width="560" height="150" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="264" y="172" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">ControlPlane(协调层,本地开发机)</text><path d="M220.0,234.0 L270.0,234.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M395.0,272.0 L395.0,420.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M622.0,272.0 L622.0,420.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)" marker-start="url(#ah0)"/><path d="M670.0,114.0 L670.0,196.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M896.0,114.0 L896.0,133.0 Q896.0,140.0 889.0,140.0 L713.0,140.0 Q706.0,140.0 706.0,147.0 L706.0,196.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M790.0,211.2 L814.4,211.2 Q820.0,211.2 820.0,205.6 L820.0,205.6 Q820.0,200.0 825.6,200.0 L850.0,200.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M790.0,234.0 L803.0,233.3 Q810.0,233.0 810.0,240.0 L810.0,273.0 Q810.0,280.0 817.0,280.0 L850.0,280.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M790.0,256.8 L823.0,257.0 Q830.0,257.0 830.0,264.0 L830.0,344.0 Q830.0,351.0 837.0,351.0 L850.0,351.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M754.0,272.0 L754.0,468.0 Q754.0,475.0 761.0,475.0 L850.0,475.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><rect x="30" y="196" width="190" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="125.0" y="221.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">审核人</text><text x="125.0" y="238.3" text-anchor="middle" font-size="12" fill="#475569">人工审核门①</text><text x="125.0" y="255.8" text-anchor="middle" font-size="12" fill="#475569">确认指令</text><rect x="270" y="196" width="250" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="395.0" y="221.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">人工命令行 rise</text><text x="395.0" y="238.3" text-anchor="middle" font-size="12" fill="#475569">TypeScript · 门控写命令</text><text x="395.0" y="255.8" text-anchor="middle" font-size="12" fill="#475569">review approve reject status</text><rect x="550" y="196" width="240" height="76" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="670.0" y="221.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">调和守护进程</text><text x="670.0" y="238.3" text-anchor="middle" font-size="12" fill="#475569">Python · run_daemon</text><text x="670.0" y="255.8" text-anchor="middle" font-size="12" fill="#475569">纯函数 reconcile + 执行壳</text><rect x="550" y="44" width="240" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="670.0" y="66.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">入口 run_controlplane</text><text x="670.0" y="83.3" text-anchor="middle" font-size="12" fill="#475569">mindtrainer.wire.main</text><text x="670.0" y="100.8" text-anchor="middle" font-size="12" fill="#475569">注入 MindTrainer 派发器</text><rect x="830" y="44" width="220" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="940.0" y="75.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">factory 组合根</text><text x="940.0" y="92.0" text-anchor="middle" font-size="12" fill="#475569">组装处理器与评估器</text><rect x="850" y="170" width="200" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="950.0" y="196.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MindTrainer 派发器</text><text x="950.0" y="213.1" text-anchor="middle" font-size="12" fill="#475569">训练出候选 checkpoint</text><rect x="850" y="250" width="200" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="950.0" y="276.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">诊断评估器</text><text x="950.0" y="293.1" text-anchor="middle" font-size="12" fill="#475569">替换 request_diagnostic</text><rect x="850" y="330" width="200" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="950.0" y="352.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">闭环处理器</text><text x="950.0" y="369.4" text-anchor="middle" font-size="12" fill="#475569">规划 · 提名 · 战绩</text><text x="950.0" y="386.8" text-anchor="middle" font-size="12" fill="#475569">智能体轮次 · 收录</text><path d="M270,429 a225.0,9 0 0 1 450,0 v58 a225.0,9 0 0 1 -450,0 z" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><ellipse cx="495.0" cy="429" rx="225.0" ry="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="495.0" y="463.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">git 产物树 control-plane/</text><text x="495.0" y="480.1" text-anchor="middle" font-size="12" fill="#475569">YAML 信封 · 每次变更一次提交 · 唯一真相</text><rect x="850" y="440" width="200" height="70" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="950.0" y="462.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">simulator.stubs</text><text x="950.0" y="479.4" text-anchor="middle" font-size="12" fill="#475569">骨架桩:默认派发器</text><text x="950.0" y="496.8" text-anchor="middle" font-size="12" fill="#475569">与默认诊断器</text><rect x="30" y="330" width="200" height="70.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="30" y="330" width="4" height="70.0" rx="2" fill="#64748b"/><text x="44" y="350.0" font-size="12" fill="#0f172a">派发器、评估器与处理器</text><text x="44" y="368.0" font-size="12" fill="#0f172a">自己经 GitStore 写产物</text><text x="44" y="386.0" font-size="12" fill="#0f172a">守护进程只管状态迁移</text><rect x="229.0" y="224.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="245.0" y="238.3" text-anchor="middle" font-size="12" fill="#475569">命令</text><rect x="355.0" y="336.6" width="80.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="395.0" y="350.3" text-anchor="middle" font-size="12" fill="#475569">改状态并提交</text><rect x="584.5" y="336.6" width="75.1" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="622.0" y="350.3" text-anchor="middle" font-size="12" fill="#475569">扫描 · 写回</text><rect x="636.0" y="145.6" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="670.0" y="159.3" text-anchor="middle" font-size="12" fill="#475569">启动并注入</text><rect x="792.0" y="196.2" width="56.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="820.0" y="209.9" text-anchor="middle" font-size="12" fill="#475569">派发指令</text><rect x="720.0" y="397.1" width="68.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="754.0" y="410.9" text-anchor="middle" font-size="12" fill="#475569">缺省时调用</text><rect x="40" y="530" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="65" y="541" font-size="12" fill="#475569">协调层 / 控制层</text><rect x="171.0" y="530" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="196.0" y="541" font-size="12" fill="#475569">计算层与入口</text><rect x="290.0" y="530" width="18" height="13" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="315.0" y="541" font-size="12" fill="#475569">人工</text><rect x="361.0" y="530" width="18" height="13" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="386.0" y="541" font-size="12" fill="#475569">存储</text></svg>
