<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 580" width="1080" height="580" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">一次 respond 的内部流程</title><desc id="d">前三步是纯函数 decide:求信号并路由技能、激活推理经验、检索记忆。第四步按固定顺序渲染指导语,第五步把 history 副本与指导语交给后端,第六步组装并校验激活轨迹,第七步返回三元组。后端返回值不合规时抛 TypeError。 节点;- 调用方:respond(persona, scenario, / history, speaker_slot);- 信号与技能路由:registry.fired 求信号 / route 排序后选第一个;- 推理经验:activate:applies_when / 主 → 次 → 保底;- 记忆检索:查询词 = 对方最后一句 / retrieve 取前 memory_limit 条;- 渲染指导语:技能 → 经验 → 记忆 / 每行带来源前缀;- 后端 respond_guided:传 history 深拷贝 / 必须返回二元组;- 组装激活轨迹:build_trace 组装 / 随即 validate_trace;- 返回三元组:(utterance, / inner_thought, trace);- TypeError:后端返回值不是二元组;连线;- 调用方 → 信号与技能路由;- 信号与技能路由 → 推理经验;- 推理经验 → 记忆检索;- 记忆检索 → 渲染指导语;- 渲染指导语 → 后端 respond_guided;- 后端 respond_guided → 组装激活轨迹;- 组装激活轨迹 → 返回三元组;- 后端 respond_guided → TypeError:不合规</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs><rect width="1080" height="580" fill="#ffffff"/><rect x="14" y="40" width="1052" height="170" rx="12" fill="#7c3aed" fill-opacity="0.05" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="62" text-anchor="start" font-size="13" font-weight="700" fill="#7c3aed">decide:纯函数,不调用模型后端</text><rect x="14" y="240" width="1052" height="300" rx="12" fill="#7c3aed" fill-opacity="0.05" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="262" text-anchor="start" font-size="13" font-weight="700" fill="#7c3aed">调用后端并组装激活轨迹</text><path d="M250.0,138.0 L290.0,138.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M510.0,138.0 L550.0,138.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M770.0,138.0 L810.0,138.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M920.0,180.0 L920.0,290.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M810.0,332.0 L770.0,332.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M550.0,332.0 L510.0,332.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M290.0,332.0 L250.0,332.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M660.0,374.0 L660.0,440.0" fill="none" stroke="#dc2626" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><rect x="30" y="96" width="220" height="84" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="140.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">调用方</text><text x="140.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">respond(persona, scenario,</text><text x="140.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">history, speaker_slot)</text><rect x="290" y="96" width="220" height="84" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="400.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">信号与技能路由</text><text x="400.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">registry.fired 求信号</text><text x="400.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">route 排序后选第一个</text><rect x="550" y="96" width="220" height="84" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="660.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">推理经验</text><text x="660.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">activate:applies_when</text><text x="660.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">主 → 次 → 保底</text><rect x="810" y="96" width="220" height="84" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="920.0" y="125.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">记忆检索</text><text x="920.0" y="142.3" text-anchor="middle" font-size="12" fill="#475569">查询词 = 对方最后一句</text><text x="920.0" y="159.8" text-anchor="middle" font-size="12" fill="#475569">retrieve 取前 memory_limit 条</text><rect x="810" y="290" width="220" height="84" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="920.0" y="319.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">渲染指导语</text><text x="920.0" y="336.4" text-anchor="middle" font-size="12" fill="#475569">技能 → 经验 → 记忆</text><text x="920.0" y="353.8" text-anchor="middle" font-size="12" fill="#475569">每行带来源前缀</text><rect x="550" y="290" width="220" height="84" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="660.0" y="319.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">后端 respond_guided</text><text x="660.0" y="336.4" text-anchor="middle" font-size="12" fill="#475569">传 history 深拷贝</text><text x="660.0" y="353.8" text-anchor="middle" font-size="12" fill="#475569">必须返回二元组</text><rect x="290" y="290" width="220" height="84" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="400.0" y="319.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">组装激活轨迹</text><text x="400.0" y="336.4" text-anchor="middle" font-size="12" fill="#475569">build_trace 组装</text><text x="400.0" y="353.8" text-anchor="middle" font-size="12" fill="#475569">随即 validate_trace</text><rect x="30" y="290" width="220" height="84" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="140.0" y="319.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">返回三元组</text><text x="140.0" y="336.4" text-anchor="middle" font-size="12" fill="#475569">(utterance,</text><text x="140.0" y="353.8" text-anchor="middle" font-size="12" fill="#475569">inner_thought, trace)</text><rect x="550" y="440" width="220" height="64" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="660.0" y="468.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">TypeError</text><text x="660.0" y="485.1" text-anchor="middle" font-size="12" fill="#475569">后端返回值不是二元组</text><circle cx="290" cy="96" r="10" fill="#7c3aed"/><text x="290" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text><circle cx="550" cy="96" r="10" fill="#7c3aed"/><text x="550" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text><circle cx="810" cy="96" r="10" fill="#7c3aed"/><text x="810" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text><circle cx="810" cy="290" r="10" fill="#7c3aed"/><text x="810" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text><circle cx="550" cy="290" r="10" fill="#7c3aed"/><text x="550" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text><circle cx="290" cy="290" r="10" fill="#7c3aed"/><text x="290" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text><circle cx="30" cy="290" r="10" fill="#7c3aed"/><text x="30" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text><rect x="638.0" y="397.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="660.0" y="411.3" text-anchor="middle" font-size="12" fill="#475569">不合规</text><rect x="40" y="552" width="18" height="13" rx="3