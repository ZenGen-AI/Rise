<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">一次落账的六个步骤</title><desc id="d">规划处理器在装配上下文之前先跑落账:读终态 run 的决策与结果,算策略签名,判定归因,写一条 run 级经验记录;再由全部记录重算出长期条目,并判定失效与废弃。每一步都可重入,记录与条目内容不变时不产生提交。 节点;- 1 读终态 run:候选 effective 或 rejected / 决策 · 报告 · 账本;- 2 算策略签名:维度 · 动作 · 模式 / 扰动键排序;- 3 判归因:new 记 low / clone 无扰动归配方;- 4 写 run 记录:strategy_experience.yaml / 幂等键;- 5 重算条目:由全部记录纯函数重算 / 不是增量累加;- 6 失效与废弃:反例过半 · 基准换版 / 人改过的条目不动;连线;- 1 读终态 run → 2 算策略签名;- 2 算策略签名 → 3 判归因;- 3 判归因 → 4 写 run 记录;- 4 写 run 记录 → 5 重算条目;- 5 重算条目 → 6 失效与废弃</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="540" fill="#ffffff"/><rect x="14" y="44" width="1052" height="360" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">plan_next_round 处理器内的落账</text><path d="M320.0,136.0 L380.0,136.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M660.0,136.0 L720.0,136.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M860.0,176.0 L860.0,250.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M720.0,290.0 L660.0,290.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M380.0,290.0 L320.0,290.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="40" y="96" width="280" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="180.0" y="123.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">1 读终态 run</text><text x="180.0" y="140.3" text-anchor="middle" font-size="12" fill="#475569">候选 effective 或 rejected</text><text x="180.0" y="157.8" text-anchor="middle" font-size="12" fill="#475569">决策 · 报告 · 账本</text><rect x="380" y="96" width="280" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="520.0" y="123.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">2 算策略签名</text><text x="520.0" y="140.3" text-anchor="middle" font-size="12" fill="#475569">维度 · 动作 · 模式</text><text x="520.0" y="157.8" text-anchor="middle" font-size="12" fill="#475569">扰动键排序</text><rect x="720" y="96" width="280" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="860.0" y="123.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">3 判归因</text><text x="860.0" y="140.3" text-anchor="middle" font-size="12" fill="#475569">new 记 low</text><text x="860.0" y="157.8" text-anchor="middle" font-size="12" fill="#475569">clone 无扰动归配方</text><rect x="720" y="250" width="280" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="860.0" y="277.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">4 写 run 记录</text><text x="860.0" y="294.4" text-anchor="middle" font-size="12" fill="#475569">strategy_experience.yaml</text><text x="860.0" y="311.8" text-anchor="middle" font-size="12" fill="#475569">幂等键</text><rect x="380" y="250" width="280" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="520.0" y="277.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">5 重算条目</text><text x="520.0" y="294.4" text-anchor="middle" font-size="12" fill="#475569">由全部记录纯函数重算</text><text x="520.0" y="311.8" text-anchor="middle" font-size="12" fill="#475569">不是增量累加</text><rect x="40" y="250" width="280" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="180.0" y="277.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">6 失效与废弃</text><text x="180.0" y="294.4" text-anchor="middle" font-size="12" fill="#475569">反例过半 · 基准换版</text><text x="180.0" y="311.8" text-anchor="middle" font-size="12" fill="#475569">人改过的条目不动</text><circle cx="40" cy="96" r="10" fill="#2563eb"/><text x="40" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text><circle cx="380" cy="96" r="10" fill="#2563eb"/><text x="380" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text><circle cx="720" cy="96" r="10" fill="#2563eb"/><text x="720" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text><circle cx="720" cy="250" r="10" fill="#2563eb"/><text x="720" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text><circle cx="380" cy="250" r="10" fill="#2563eb"/><text x="380" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text><circle cx="40" cy="250" r="10" fill="#2563eb"/><text x="40" y="254" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text><rect x="40" y="420" width="620" height="70.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1"/><rect x="40" y="420" width="4" height="70.0" rx="2" fill="#64748b"/><text x="54" y="440.0" font-size="12" fill="#0f172a">落账只读产物树,不调外部模型</text><text x="54" y="458.0" font-size="12" fill="#0f172a">重入时按同一批记录重算,结果逐字节相同</text><text x="54" y="476.0" font-size="12" fill="#0f172a">内容不变时 GitStore 不提交</text><rect x="700" y="430" width="18" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="725" y="441" font-size="12" fill="#475569">控制层步骤</text></svg>
