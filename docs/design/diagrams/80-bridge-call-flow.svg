<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">一次 CliBridge 调用</title><desc id="d">构造时解析凭证,缺凭证直接失败。每次调用先校验路径段,再起子进程并判定结果:T1 且未耗尽则退避后重试,其余情形都先写一份脱敏日志;成功的调用记一条成本后返回结果,失败的抛 BridgeError。 节点;- 构造 CliBridge:校验 retry_policy / 解析凭证;- complete():校验 run_id · task_id;- 起子进程:白名单环境 · 空临时目录 / 标准输入 · 超时 timeout_s;- 判定本次尝试:OSError → T2 / 超时 · 非零 · 空输出 → T1 / 其余 → 成功;- 构造失败:MissingCredentialError / 不是 BridgeError;- 退避:base × 2^(n-1) 秒 / 最后一次失败后不睡;- 写日志:每次 complete 一份 · 含各次尝试 / 整体过 redact · 返回 BigRef;- 记账:external_inference / calls = 本次尝试数;- 返回 BridgeResult:text 去首尾空白 / token 恒为 None;- 抛 BridgeError:T1:attempts = max_attempts / T2:立即,不重试;连线;- 构造 CliBridge → complete();- complete() → 起子进程;- 起子进程 → 判定本次尝试;- 构造 CliBridge → 构造失败:缺凭证;- 判定本次尝试 → 退避:T1 未耗尽;- 退避 → 起子进程:重试;- 判定本次尝试 → 写日志:成功 / T1 耗尽 / T2;- 写日志 → 记账:成功;- 记账 → 返回 BridgeResult;- 写日志 → 抛 BridgeError:失败</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="640" fill="#ffffff"/><rect x="14" y="44" width="1052" height="160" rx="12" fill="#7c3aed" fill-opacity="0.05" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#7c3aed">构造与一次尝试</text><rect x="14" y="222" width="1052" height="380" rx="12" fill="#64748b" fill-opacity="0.05" stroke="#64748b" stroke-width="1.2"/><text x="28" y="244" text-anchor="start" font-size="13" font-weight="700" fill="#64748b">收尾</text><path d="M240.0,136.0 L280.0,136.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M480.0,136.0 L520.0,136.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M750.0,136.0 L800.0,136.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M135.0,176.0 L135.0,270.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M850.0,186.0 L850.0,293.0 Q850.0,300.0 843.0,300.0 L750.0,300.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M635.0,260.0 L635.0,176.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M987.5,186.0 L987.5,380.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M800.0,420.0 L750.0,420.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M520.0,420.0 L480.0,420.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M925.0,460.0 L925.0,510.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="30" y="96" width="210" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="135.0" y="123.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">构造 CliBridge</text><text x="135.0" y="140.3" text-anchor="middle" font-size="12" fill="#475569">校验 retry_policy</text><text x="135.0" y="157.8" text-anchor="middle" font-size="12" fill="#475569">解析凭证</text><rect x="280" y="96" width="200" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="380.0" y="132.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">complete()</text><text x="380.0" y="149.1" text-anchor="middle" font-size="12" fill="#475569">校验 run_id · task_id</text><rect x="520" y="96" width="230" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="635.0" y="123.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">起子进程</text><text x="635.0" y="140.3" text-anchor="middle" font-size="12" fill="#475569">白名单环境 · 空临时目录</text><text x="635.0" y="157.8" text-anchor="middle" font-size="12" fill="#475569">标准输入 · 超时 timeout_s</text><polygon points="816.0,86.0 1034.0,86.0 1050.0,136.0 1034.0,186.0 816.0,186.0 800.0,136.0" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/><text x="925.0" y="114.9" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">判定本次尝试</text><text x="925.0" y="131.7" text-anchor="middle" font-size="12" fill="#475569">OSError → T2</text><text x="925.0" y="149.1" text-anchor="middle" font-size="12" fill="#475569">超时 · 非零 · 空输出 → T1</text><text x="925.0" y="166.4" text-anchor="middle" font-size="12" fill="#475569">其余 → 成功</text><rect x="30" y="270" width="210" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="135.0" y="292.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">构造失败</text><text x="135.0" y="309.4" text-anchor="middle" font-size="12" fill="#475569">MissingCredentialError</text><text x="135.0" y="326.8" text-anchor="middle" font-size="12" fill="#475569">不是 BridgeError</text><rect x="520" y="260" width="230" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="635.0" y="287.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">退避</text><text x="635.0" y="304.4" text-anchor="middle" font-size="12" fill="#475569">base × 2^(n-1) 秒</text><text x="635.0" y="321.8" text-anchor="middle" font-size="12" fill="#475569">最后一次失败后不睡</text><rect x="800" y="380" width="250" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="925.0" y="407.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">写日志</text><text x="925.0" y="424.4" text-anchor="middle" font-size="12" fill="#475569">每次 complete 一份 · 含各次尝试</text><text x="925.0" y="441.8" text-anchor="middle" font-size="12" fill="#475569">整体过 redact · 返回 BigRef</text><rect x="520" y="380" width="230" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text x="635.0" y="407.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">记账</text><text x="635.0" y="424.4" text-anchor="middle" font-size="12" fill="#475569">external_inference</text><text x="635.0" y="441.8" text-anchor="middle" font-size="12" fill="#475569">calls = 本次尝试数</text><rect x="280" y="380" width="200" height="80" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="380.0" y="407.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">返回 BridgeResult</text><text x="380.0" y="424.4" text-anchor="middle" font-size="12" fill="#475569">text 去首尾空白</text><text x="380.0" y="441.8" text-anchor="middle" font-size="12" fill="#475569">token 恒为 None</text><rect x="800" y="510" width="250" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="925.0" y="532.6" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">抛 BridgeError</text><text x="925.0" y="549.4" text-anchor="middle" font-size="12" fill="#475569">T1:attempts = max_attempts</text><text x="925.0" y="566.8" text-anchor="middle" font-size="12" fill="#475569">T2:立即,不重试</text><circle cx="30" cy="96" r="10" fill="#7c3aed"/><text x="30" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text><circle cx="280" cy="96" r="10" fill="#7c3aed"/><text x="280" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text><circle cx="520" cy="96" r="10" fill="#7c3aed"/><text x="520" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text><circle cx="816" cy="86" r="10" fill="#7c3aed"/><text x="816" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text><circle cx="520" cy="260" r="10" fill="#7c3aed"/><text x="520" y="264" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text><circle cx="800" cy="380" r="10" fill="#7c3aed"/><text x="800" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text><circle cx="520" cy="380" r="10" fill="#7c3aed"/><text x="520" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text><circle cx="280" cy="380" r="10" fill="#7c3aed"/><text x="280" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">8</text><circle cx="800" cy="510" r="10" fill="#7c3aed"/><text x="800" y="514" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">9</text><rect x="113.0" y="213.6" width="44.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="135.0" y="227.3" text-anchor="middle" font-size="12" fill="#475569">缺凭证</text><rect x="818.5" y="283.6" width="63.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="850.0" y="297.3" text-anchor="middle" font-size="12" fill="#475569">T1 未耗尽</text><rect x="619.0" y="208.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="635.0" y="222.3" text-anchor="middle" font-size="12" fill="#475569">重试</text><rect x="930.5" y="263.9" width="114.1" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="987.5" y="277.6" text-anchor="middle" font-size="12" fill="#475569">成功 / T1 耗尽 / T2</text><rect x="759.0" y="410.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="775.0" y="424.3" text-anchor="middle" font-size="12" fill="#475569">成功</text><rect x="909.0" y="475.6" width="32.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="925.0" y="489.3" text-anchor="middle" font-size="12" fill="#475569">失败</text><rect x="40" y="615" width="18" height="13" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="65" y="626" font-size="12" fill="#475569">桥接内的步骤</text><rect x="159.0" y="615" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="184.0" y="626" font-size="12" fill="#475569">正常返回</text><rect x="254.0" y="615" width="18" height="13" rx="3" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/><text x="279.0" y="626" font-size="12" fill="#475569">失败出口</text></svg>
