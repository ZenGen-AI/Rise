<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">MindTrainer 的组件</title><desc id="d">上层是入口与编排:派发器读配置并构造轨迹源工厂,编排器读训练记录交给续训判定,再逐步驱动训练。下层是模式无关的流水线:两种轨迹源产出同一种轨迹批,之后的奖励、分组、执行器与 checkpoint 管理器完全共享。 节点;- 训练配置:training_config.py / 校验 · 哈希 · phase_at;- 派发器:dispatch.py · wire.py / 指令 → 训练;- 编排器:orchestrator.py / resume_or_run · run_training;- 续训判定:resume.py / decide_resume 纯函数;- Interact 轨迹源:InteractTrajectorySource / 实时会话 · 受限直连①;- Batch 轨迹源:BatchTrajectorySource / 读清单 · 校验哈希;- 奖励管线:reward_pipeline.py / 归因 · 校验 · 组合;- 分组与优势:grouping.py / 组内均值基线;- 训练执行器:executor.py / MockExecutor;- checkpoint 管理器:checkpoint.py / 转换 · 注册候选;- 产物树:dataset_manifest · episodes · training_run · candidate_checkpoint;连线;- 派发器 → 训练配置:读取并校验;- 派发器 → 编排器:调用;- 编排器 → 续训判定:判定;- 派发器 → Interact 轨迹源:make_sources 构造轨迹源;- 派发器 → Batch 轨迹源;- 编排器 → 训练执行器:逐步驱动;- Interact 轨迹源 → 奖励管线:轨迹批;- Batch 轨迹源 → 奖励管线:轨迹批;- 奖励管线 → 分组与优势;- 分组与优势 → 训练执行器;- 训练执行器 → checkpoint 管理器;- Batch 轨迹源 → 产物树:读清单与 episode;- checkpoint 管理器 → 产物树:注册候选</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="600" fill="#ffffff"/><rect x="14" y="44" width="1052" height="152" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">入口与编排</text><rect x="14" y="222" width="1052" height="344" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="244" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">模式无关的训练流水线</text><path d="M300.0,131.0 L250.0,131.0" fill="none" stroke="#475569" stroke-