<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" width="1080" height="640" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">MindAgent 上下文</title><desc id="d">调和循环产生 start_agent_round 与 admit_proposal 两个动作,交给组合根注册的 MindAgent 处理器。MindAgent 读模型与正式库、写轮次与提案,经受限直连②向实时环境服务采集部署经验,用 SimpleActio 建实例,可选经外部推理桥接生成技能策略。门②由人工批准提案。 节点;- factory 组合根:注册两个处理器 / 注入配置与工厂;- ControlPlane:调和循环 · 产物树 / 动作 start_agent_round · admit_proposal;- 门② 人工审核:review · approve · reject / 验证结果在场才可批准;- MindAgent:轮次处理器 · 收录处理器 / 部署 · 分析 · 提案 · 验证 · 打包;- 实时环境服务:SocialSimulator / gRPC 双向流 · 对手人格;- SimpleActio:技能库 · 显式记忆 / 每次响应附激活轨迹;- 外部推理桥接:可选:生成技能策略;连线;- factory 组合根 → ControlPlane:注册处理器;- 门② 人工审核 → ControlPlane:改提案状态;- factory 组合根 → MindAgent:注入依赖;- ControlPlane → MindAgent:调用处理器;- MindAgent → ControlPlane:读写产物;- MindAgent ↔ 实时环境服务:② 部署会话;- MindAgent → SimpleActio:instantiate;- MindAgent → 外部推理桥接:可选</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1080" height="640" fill="#ffffff"/><path d="M204.0,110.0 L330.0,110.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M846.0,110.0 L730.0,110.0" fill="none" stroke="#d97706" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)"/><path d="M114.0,150.0 L114.0,308.0 Q114.0,315.0 121.0,315.0 L330.0,315.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M450.0,150.0 L450.0,270.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M610.0,270.0 L610.0,150.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M730.0,315.0 L856.0,315.0" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)" marker-start="url(#ah1)"/><path d="M430.0,360.0 L430.0,470.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M650.0,360.0 L650.0,470.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="24" y="70" width="180" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="114.0" y="97.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">factory 组合根</text><text x="114.0" y="114.3" text-anchor="middle" font-size="12" fill="#475569">注册两个处理器</text><text x="114.0" y="131.8" text-anchor="middle" font-size="12" fill="#475569">注入配置与工厂</text><rect x="330" y="70" width="400" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="530.0" y="97.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ControlPlane</text><text x="530.0" y="114.3" text-anchor="middle" font-size="12" fill="#475569">调和循环 · 产物树</text><text x="530.0" y="131.8" text-anchor="middle" font-size="12" fill="#475569">动作 start_agent_round · admit_proposal</text><polygon points="862.0,70.0 1040.0,70.0 1056.0,110.0 1040.0,150.0 862.0,150.0 846.0,110.0" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/><text x="951.0" y="97.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">门② 人工审核</text><text x="951.0" y="114.3" text-anchor="middle" font-size="12" fill="#475569">review · approve · reject</text><text x="951.0" y="131.8" text-anchor="middle" font-s