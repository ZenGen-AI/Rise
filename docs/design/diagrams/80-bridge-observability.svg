="323.7" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">本地日志文件</text><text x="440.0" y="340.5" text-anchor="middle" font-size="12" fill="#475569">.rismforge/logs/&lt;run&gt;/</text><rect x="30" y="424" width="230" height="70" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="145.0" y="455.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">计算层任务</text><text x="145.0" y="472.1" text-anchor="middle" font-size="12" fill="#475569">训练 · 评测进程</text><path d="M330,427 a110.0,9 0 0 1 220,0 v50.900000000000006 a110.0,9 0 0 1 -220,0 z" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><ellipse cx="440.0" cy="427" rx="110.0" ry="9" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="440.0" y="457.7" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">计算层文件</text><text x="440.0" y="474.5" text-anchor="middle" font-size="12" fill="#475569">指标流 · 进程日志</text><rect x="830" y="76" width="220" height="64" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="940.0" y="104.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">cost</text><text x="940.0" y="121.0" text-anchor="middle" font-size="12" fill="#475569">明细与汇总</text><rect x="830" y="210" width="220" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="940.0" y="237.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">trace</text><text x="940.0" y="254.3" text-anchor="middle" font-size="12" fill="#475569">产物状态 · links</text><text x="940.0" y="271.8" text-anchor="middle" font-size="12" fill="#475569">引用可达性</text><rect x="830" y="380" width="220" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="940.0" y="416.2" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">logs</text><text x="940.0" y="433.1" text-anchor="middle" font-size="12" fill="#475569">顺 log_refs 读内容</text><rect x="111.0" y="230.6" width="68.0" height="18.9"