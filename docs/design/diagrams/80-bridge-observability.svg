<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">可观测的三层数据</title><desc id="d">L1 在 git 树里:记账模块写 run_trace 的成本与失败记录。L3 本地日志由命令行桥接写,树里只留引用。L2 指标与计算层 L3 日志留在计算层,只读命令读不到。cost 读 run_trace,trace 列产物与引用可达性,logs 顺引用读日志。 节点;- controlplane.ledger:record_cost / record_failure;- run_trace.yaml:cost_records;- failure-&lt;task&gt;.yaml:category · log_refs;- CliBridge:每次调用一份日志;- 本地日志文件:.rismforge/logs/&lt;run&gt;/;- 计算层任务:训练 · 评测进程;- 计算层文件:指标流 · 进程日志;- cost:明细与汇总;- trace:产物状态 · links / 引用可达性;- logs:顺 log_refs 读内容;连线;- controlplane.ledger → run_trace.yaml;- controlplane.ledger → failure-&lt;task&gt;.yaml;- CliBridge → controlplane.ledger:成功后记账;- CliBridge → 本地日志文件:脱敏写入;- failure-&lt;task&gt;.yaml → 本地日志文件:log_refs;- 计算层任务 → 计算层文件:写入;- run_trace.yaml → cost:读;- failure-&lt;task&gt;.yaml → trace:读;- 本地日志文件 → logs:file:// 读;- 计算层文件 → logs:不可达(虚线)</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="560" fill="#ffffff"/><rect x="14" y="44" width="780" height="200" rx="12" fill="#0891b2" fill-opacity="0.05" stroke="#0891b2" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#0891b2">L1 结构化摘要:git 树</text><rect x="14" y="258" width="780" height="120" rx="12" fill="#7c3aed" fill-opacity="0.05" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="280" text-anchor="start" font-size="13" font-weight="700" fill="#7c3aed">L3 桥接日志:控制面仓库工作区,git 不可见</text><rect x="14" y="392" width="780" height="120" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="414" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">L2 指标流与计算层 L3 日志</text><rect x="806" y="44" width="260" height="468" rx="12" fill="#64748b" fill-opacity="0.05" stroke="#64748b" stroke-width="1.2"/><text x="820" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#64748b">只读命令</text><path d="M260.0,134.0 L288.0,134.0 Q295.0,134.0 295.0,127.0 L295.0,121.4 Q295.0,114.4 302.0,114.4 L330.0,114.4" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M260.0,166.0 L288.0,166.0 Q295.0,166.0 295.0,173.0 L295.0,182.6 Q295.0,189.6 302.0,189.6 L330.0,189.6" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M145.0,290.0 L145.0,190.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M260.0,325.0 L291.7,325.0 Q295.0,325.0 295.0,321.7 L295.0,321.7 Q295.0,318.4 298.3,318.4 L330.0,318.4" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M440.0,228.0 L440.0,284.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M260.0,459.0 L291.7,459.0 Q295.0,459.0 295.0,455.7 L295.0,455.7 Q295.0,452.4 298.3,452.4 L330.0,452.4" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M550.0,108.0 L830.0,108.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M550.0,196.0 L683.0,196.0 Q690.0,196.0 690.0,203.0 L690.0,235.0 Q690.0,242.0 697.0,242.0 L830.0,242.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M550.0,318.4 L683.0,318.4 Q690.0,318.4 690.0,325.4 L690.0,397.0 Q690.0,404.0 697.0,404.0 L830.0,404.0" f