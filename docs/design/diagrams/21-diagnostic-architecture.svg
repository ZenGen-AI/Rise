<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" width="1080" height="680" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">诊断评测的组件</title><desc id="d">评估器从产物树取资产与基线后调用编排器。编排器是薄协调层,依次调用流水线模块,模块之间不互相调用,箭头是数据流向。统计模块被多处调用,隔离校验器独立暴露,供情境生成路径调用。 节点;- evaluator · assets:make_diagnostic_evaluator / 资产读写 · 基线解析 · backends;- orchestrator:run_diagnostic · 只编排,不含统计与决策;- taxonomy_loader:按档选题 · 变体族;- someval_adapter:静态轨执行 · 原始输出;- dynamic_track:动态轨 episode / 题目来自调用方 spec;- scorer:规则 · judge · 偏差守卫;- error_classifier:变体族通过模式 / 动态一致性;- store_adapter:report 组装 · 写产物树;- regression:退化判定 · 版本可比;- aggregator:L3 → L2 → L1 · 融合;- stats:Wilson 区间 · 通过率 / 方差 · 区间相交;- isolation:污染过滤 · 独立暴露 / 供情境生成路径调用;连线;- evaluator · assets → orchestrator:配置 · 基线 · backends;- orchestrator → taxonomy_loader:按序调用;- taxonomy_loader → someval_adapter:静态题;- someval_adapter → scorer;- dynamic_track → scorer;- scorer → error_classifier:ItemResult;- scorer → aggregator:ItemResult;- aggregator → regression:分数;- regression → store_adapter:标记;- error_classifier → store_adapter:ErrorProfile</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1080" height="680" fill="#ffffff"/><rect x="14" y="44" width="1052" height="110" rx="12" fill="#2563eb" fill-opacity="0.05" stroke="#2563eb" stroke-width="1.2"/><text x="28" y="66" text-anchor="start" font-size="13" font-weight="700" fill="#2563eb">入口</text><rect x="14" y="168" width="1052" height="330" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="190" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">流水线模块:编排器依次调用,箭头为数据流向</text><rect x="14" y="512" width="1052" height="128" rx="12" fill="#64748b" fill-opacity="0.05" stroke="#64748b" stroke-width="1.2"/><text x="28" y="534" text-anchor="start" font-size="13" font-weight="700" fill="#64748b">横切模块</text><path d="M340.0,113.0 L520.0,113.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M540.0,146.0 L540.0,155.0 Q540.0,162.0 533.0,162.0 L147.0,162.0 Q140.0,162.0 140.0,169.0 L140.0,236.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M240.0,268.0 L268.0,268.0 Q275.0,268.0 275.0,261.0 L275.0,245.4 Q275.0,238.4 282.0,238.4 L310.0,238.4" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M510.0,232.0 L538.0,232.0 Q545.0,232.0 545.0,239.0 L545.0,248.2 Q545.0,255.2 552.0,255.2 L580.0,255.2" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M510.0,331.0 L538.0,331.0 Q545.0,331.0 545.0,324.0 L545.0,291.0 Q545.0,284.0 552.0,284.0 L580.0,284.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M780.0,268.0 L850.0,268.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M680.0,300.0 L680.0,400.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M580.0,432.0 L510.0,432.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M310.0,432.0 L240.0,432.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M950.0,300.0 L950.0,477.0 Q950.0,484.0 943.0,484.0 L147.0,484.0 Q140.0,484.0 140.0,477.0 L140.0,464.0" fill="none" stroke="#475569" stro