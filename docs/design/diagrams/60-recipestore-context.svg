<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">RecipeStore 的上下文</title><desc id="d">TrainScheduler 写配方候选并调用 RecipeStore 的检索、增益与校验函数;调和循环经两个处理器驱动收录与战绩回写;RecipeStore 只读写产物树里的四类目录。 节点;- TrainScheduler:提名器 · 规划处理器;- ControlPlane 调和循环:产生 admit_recipe / record_track 动作;- factory 组合根:注册两个处理器;- RecipeStore:校验 · 检索 · 增益 · 战绩 · 生命周期 / 收录处理器 · 战绩处理器;- recipe_candidates/:配方候选 · 审核类;- recipes/:配方 · 谱系 · 战绩;- runs/&lt;run&gt;/:指令 · 候选 · 诊断报告;- models/:zengen-vN · 只读;- 门③ 配方入库:repro 在场才可批准;连线;- TrainScheduler → RecipeStore:检索 · 增益 · 校验;- TrainScheduler → recipe_candidates/:提名:写候选;- factory 组合根 → ControlPlane 调和循环:注册;- ControlPlane 调和循环 → RecipeStore:调用处理器;- RecipeStore → recipe_candidates/:读候选 · 置 effective;- RecipeStore → recipes/:收录 · 战绩 · 废弃;- RecipeStore → runs/&lt;run&gt;/:读报告 · 写战绩标记;- RecipeStore → models/:读基线 links;- 门③ 配方入库 → recipe_candidates/:approve / reject</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1080" height="720" fill="#ffffff"/><path d="M230.0,290.0 L290.0,290.0 Q295.0,290.0 295.0,295.0 L295.0,295.0 Q295.0,300.0 300.0,300.0 L360.0,300.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M130.0,330.0 L130.0,480.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M820.0,100.0 L770.0,100.0" fill="none" stroke="#475569" stroke-width="1.6" str