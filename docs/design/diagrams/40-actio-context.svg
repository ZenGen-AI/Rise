<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 610" width="1080" height="610" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei','Segoe UI',Helvetica,Arial,sans-serif"><title id="t">Actio 的上下文</title><desc id="d">SocialSimulator 的运行器与 MindAgent 的客户端循环都实例化 Actio 并调用 respond。Actio 把技能、经验与记忆渲染成指导语交给模型后端,包外只导入 simulator.datamodel。技能库与记忆库由 MindAgent 读入后传给 Actio,Actio 自己不读产物树。 节点;- SocialSimulator:仿真运行器 run_episode / 实时环境服务 · episode 落盘;- MindAgent:部署驱动器的客户端循环 / 分析 · 提案 · 验证;- Actio:instantiate 组装 ActioInstance / respond 返回三元组与激活轨迹;- simulator.datamodel:Persona · Scenario · TurnRecord;- 模型后端:respond 或 respond_guided / 测试用罐头后端;- 技能库与记忆库:skill_library/ · memory_library/ / 由 MindAgent 读写;连线;- SocialSimulator → Actio:runner 把实例当后端;- MindAgent → Actio:instantiate · respond;- MindAgent ↔ SocialSimulator:② submit_turn 带轨迹;- Actio → 模型后端:指导语 + history 副本;- Actio → simulator.datamodel:唯一的包外导入;- 技能库与记忆库 → MindAgent:读入条目与库版本</desc><defs><marker id="ah0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker></defs><rect width="1080" height="610" fill="#ffffff"/><rect x="14" y="40" width="1052" height="150" rx="12" fill="#16a34a" fill-opacity="0.05" stroke="#16a34a" stroke-width="1.2"/><text x="28" y="62" text-anchor="start" font-size="13" font-weight="700" fill="#16a34a">计算层</text><rect x="14" y="214" width="1052" height="170" rx="12" fill="#7c3aed" fill-opacity="0.05" stroke="#7c3aed" stroke-width="1.2"/><text x="28" y="236" text-anchor="start" font-size="13" font-weight="700" fill="#7c3aed">共享基础设施</text><rect x="14" y="408" width="1052" height="160" rx="12" fill="#64748b" fill-opacity="0.05" stroke="#64748b" stroke-width="1.2"/><text x="28" y="430" text-anchor="start" font-size="13" font-weight="700" fill="#64748b">Actio 之外的依赖与数据</text><path d="M300.0,170.0 L300.0,209.0 Q300.0,216.0 307.0,216.0 L421.0,216.0 Q428.0,216.0 428.0,223.0 L428.0,262.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M780.0,170.0 L780.0,209.0 Q780.0,216.0 773.0,216.0 L659.0,216.0 Q652.0,216.0 652.0,223.0 L652.0,262.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M700.0,128.0 L380.0,128.0" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah1)" marker-start="url(#ah1)"/><path d="M540.0,352.0 L540.0,458.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M380.0,307.0 L207.0,307.0 Q200.0,307.0 200.0,314.0 L200.0,458.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><path d="M880.0,448.0 L880.0,316.0 Q880.0,309.0 887.0,309.0 L933.0,309.0 Q940.0,309.0 940.0,302.0 L940.0,170.0" fill="none" stroke="#475569" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah0)"/><rect x="60" y="86" width="320" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="220.0" y="115.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">SocialSimulator</text><text x="220.0" y="132.3" text-anchor="middle" font-size="12" fill="#475569">仿真运行器 run_episode</text><text x="220.0" y="149.8" text-anchor="middle" font-size="12" fill="#475569">实时环境服务 · episode 落盘</text><rect x="700" y="86" width="320" height="84" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="860.0" y="115.5" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">MindAgent</text><tex