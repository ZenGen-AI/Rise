/><text x="364.0" y="220.3" text-anchor="middle" font-size="12" fill="#475569">runner 把实例当后端</text><rect x="647.2" y="206.6" width="137.6" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="716.0" y="220.3" text-anchor="middle" font-size="12" fill="#475569">instantiate · respond</text><rect x="474.9" y="118.6" width="130.3" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="540.0" y="132.3" text-anchor="middle" font-size="12" fill="#475569">② submit_turn 带轨迹</text><rect x="475.4" y="395.6" width="129.2" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="540.0" y="409.3" text-anchor="middle" font-size="12" fill="#475569">指导语 + history 副本</text><rect x="168.5" y="297.6" width="92.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="214.5" y="311.3" text-anchor="middle" font-size="12" fill="#475569">唯一的包外导入</text><rect x="858.0" y="299.6" width="104.0" height="18.9" rx="4" fill="#ffffff" fill-opacity="0.94"/><text x="910.0" y="313.3" text-anchor="middle" font-size="12" fill="#475569">读入条目与库版本</text><rect x="40" y="582" width="18" height="13" rx="3" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4"/><text x="65" y="593" font-size="12" fill="#475569">计算层</text><rect x="123.0" y="582" width="18" height="13" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="148.0" y="593" font-size="12" fill="#475569">共享基础设施</text><rect x="242.0" y="582" width="18" height="13" rx="3" fill="#ecfeff" stroke="#0891b2" stroke-width="1.4"/><text x="267.0" y="593" font-size="12" fill="#475569">产物</text><rect x="313.0" y="582" width="18" height="13" rx="3" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/><text x="338.0" y="593" font-size="12" fill="#475569">受限直连②</text></svg>
